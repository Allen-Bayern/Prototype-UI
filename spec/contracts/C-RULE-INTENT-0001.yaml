id: C-RULE-INTENT-0001
type: contract
title: Rule intent records analyzable operations
status: draft
since: 0.1.0
summary: Rule `intent` records declarative operations for later execution and must not run arbitrary callbacks or host-specific side effects during setup.
statement:
  zh-CN: >-
    Rule 的 `intent` 只记录明确、可分析的操作。`IntentBuilder` 在 setup 期不得直接执行副作用，不得调用原型作者 runtime callback，不得触达 host，也不得直接 mutate state、feedback、context 或 template。每个 intent channel 必须定义自身的 builder 形状、RuleIR 表示、合并语义、激活/失效行为与执行边界。


  en: >-
    Rule `intent` only records clear, analyzable operations. During setup, `IntentBuilder` must not directly execute side effects, call prototype-author runtime callbacks, touch the host, or directly mutate state, feedback, context, or template. Each intent channel must define its own builder shape, RuleIR representation, merge semantics, activation/deactivation behavior, and execution boundary.


criteria:
  - id: C-RULE-INTENT-0001-A
    text:
      zh-CN: '`IntentBuilder` 必须记录操作，而不是在 setup 期执行操作。'
      en: '`IntentBuilder` must record operations rather than execute them during setup.'
  - id: C-RULE-INTENT-0001-B
    text:
      zh-CN: Rule intent 不得包含任意 callback 或宿主特定命令式逻辑。
      en: Rule intent must not contain arbitrary callbacks or host-specific imperative logic.
  - id: C-RULE-INTENT-0001-C
    text:
      zh-CN: 同一 Rule 内记录的 intent op 顺序必须保留。
      en: The order of intent ops recorded within a Rule must be preserved.
  - id: C-RULE-INTENT-0001-D
    text:
      zh-CN: 不同 intent channel 的合并与执行语义必须由各自契约定义，Rule core 不提供隐式跨通道优先级。
      en: Merge and execution semantics for different intent channels must be defined by their own contracts; Rule core provides no implicit cross-channel priority.
sources:
  - path: internal/contracts/rule/intent.compose.v0.md
    sections:
      - IntentBuilder Boundary
      - Operation Model
      - Channel Independence
dependsOn:
  contracts:
    - C-RULE-0003
    - C-RULE-0004
revisions:
  - version: 0.1.0
    change: introduced
    summary: Captured Rule intent as analyzable operation recording rather than arbitrary side-effect execution.
tags:
