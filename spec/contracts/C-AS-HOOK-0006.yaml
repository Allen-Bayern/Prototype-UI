id: C-AS-HOOK-0006
type: contract
title: asHook result exposes setup-only disposers and analyzable artifacts
status: draft
since: 0.1.0
summary: AsHookResult is the caller result synthesized from captured setup effects, and may expose handles, artifacts, render fragments, and setup-only disposers.
statement:
  zh-CN: >-
    `AsHookResult` 是 asHook caller 的返回值，不是 authored asHook `setup` 的返回值。runtime 必须通过分析该 asHook setup frame 中声明的 setup syntax、captured handles、artifacts、setup 返回的 render fragment 与可撤销 setup effects 来合成 `AsHookResult`。对于 setup 期间引入的副作用，asHook 有义务尽可能提供对应 disposer；但这些 disposer 仍遵守 setup-only removal 边界，只能在 setup 期间调用，不得成为 runtime cleanup、callback disposer 或 lifecycle disposer。无法撤销或无需撤销的贡献，例如单纯创建 state slot，可以不提供真正删除语义。


  en: >-
    `AsHookResult` is the return value of an asHook caller, not the return value of the authored asHook `setup`. The runtime must synthesize `AsHookResult` by analyzing setup syntax, captured handles, artifacts, the render fragment returned by setup, and reversible setup effects declared in that asHook setup frame. For side effects introduced during setup, asHook should provide corresponding disposers whenever possible; however, these disposers still follow the setup-only removal boundary and may only be called during setup, not as runtime cleanup, callback disposers, or lifecycle disposers. Contributions that cannot or need not be removed, such as creating a state slot, do not need true deletion semantics.


criteria:
  - id: C-AS-HOOK-0006-A
    text:
      zh-CN: >-
        `AsHookResult` 必须是 asHook caller 合成出来的对象，可以暴露 asHook setup frame 引入的 handles、artifacts、render fragment 与 disposers。


      en: >-
        `AsHookResult` must be the synthesized object returned by the asHook caller and may expose handles, artifacts, render fragments, and disposers introduced by the asHook setup frame.


  - id: C-AS-HOOK-0006-B
    text:
      zh-CN: asHook 应尽可能为 setup 期间引入的可撤销副作用提供 disposer。
      en: asHook should provide disposers for reversible setup-introduced side effects whenever possible.
  - id: C-AS-HOOK-0006-C
    text:
      zh-CN: asHook result 中的 setup-effect disposer 必须只能在 setup 期间调用。
      en: Setup-effect disposers in an asHook result must be callable only during setup.
  - id: C-AS-HOOK-0006-D
    text:
      zh-CN: asHook disposer 不得被解释为 runtime API、callback cleanup 或 lifecycle disposer。
      en: asHook disposers must not be interpreted as runtime APIs, callback cleanup, or lifecycle disposers.
  - id: C-AS-HOOK-0006-E
    text:
      zh-CN: 无法撤销或无需撤销的 setup contribution 可以暴露 handle 或 artifact，而不要求真正删除语义。
      en: Setup contributions that cannot or need not be removed may expose handles or artifacts without requiring true deletion semantics.
