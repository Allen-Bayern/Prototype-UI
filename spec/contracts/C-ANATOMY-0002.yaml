id: C-ANATOMY-0002
type: contract
title: Anatomy family specs are static definitions
status: draft
since: 0.1.0
summary: A stable anatomy family is defined by a reference-identity family token that carries its canonical spec, including the required root role.
statement:
  zh-CN: >-
    Anatomy family spec 是 static-only 定义。稳定共享的 family 必须通过 `createAnatomyFamily(debugName, spec)` 创建 family token，并让 token 携带该 family 的 canonical spec；该 spec 必须声明 root role，因为 root claim 是 anatomy domain 的 scope anchor。`debugName` 仅用于诊断与调试，family identity 由 token 引用身份决定。


  en: >-
    An anatomy family spec is a static-only definition. Stable shared families must be created with `createAnatomyFamily(debugName, spec)` so the family token carries the canonical spec; that spec must declare the root role because a root claim is the scope anchor for an anatomy domain. `debugName` is diagnostic/debug metadata only, while family identity is the token's reference identity.


criteria:
  - id: C-ANATOMY-0002-A
    text:
      zh-CN: '`createAnatomyFamily(debugName, spec)` 必须被视为定义稳定 anatomy family spec 的 static-only API。'
      en: '`createAnatomyFamily(debugName, spec)` must be treated as the static-only API for defining a stable anatomy family spec.'
  - id: C-ANATOMY-0002-B
    text:
      zh-CN: Family identity 必须由 family token 的引用身份决定，不得由 `debugName` 字符串决定。
      en: Family identity must be determined by the family token's reference identity, not by the `debugName` string.
  - id: C-ANATOMY-0002-C
    text:
      zh-CN: '`debugName` 只能用于诊断、调试、日志或开发工具展示。'
      en: '`debugName` may only be used for diagnostics, debugging, logs, or developer-tool display.'
  - id: C-ANATOMY-0002-D
    text:
      zh-CN: 稳定库级 family 不应要求每个 part 在 setup 期间重复注册同一份 spec。
      en: A stable library-level family should not require every part to register the same spec again during setup.
  - id: C-ANATOMY-0002-E
    text:
      zh-CN: Family spec 必须声明 `root` role；缺失 root 的 family spec 必须被视为非法。
      en: A family spec must declare the `root` role; a family spec without root must be invalid.
sources:
  - path: internal/contracts/anatomy/family-declaration.v0.impl-notes.md
    sections:
