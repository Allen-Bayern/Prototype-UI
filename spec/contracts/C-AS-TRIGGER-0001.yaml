id: C-AS-TRIGGER-0001
type: contract
title: asTrigger merges continuous nested trigger event routes to the outermost trigger
status: draft
since: 0.1.0
summary: asTrigger is a privileged asHook that makes nested trigger prototypes share one activation event route, owned by the outermost continuous trigger in the direct host parent chain.
statement:
  zh-CN: >-
    `asTrigger()` 是核心契约中的特权 asHook。它把宿主中直接连续嵌套的 trigger 原型视为同一个 trigger event route，并将该 route 统一合并到连续 trigger 链的最外层 trigger 原型。直接父子关系与父原型查询由 host-cap 提供；`asTrigger` 消费这些 host-cap 结果，但不自行定义宿主树、DOM containment 或跨宿主 parent 关系。链路在第一个非 trigger 原型、缺失 parent、缺失 prototype 查询结果或 host-cap 无法证明直接父子关系处停止。


  en: >-
    `asTrigger()` is a privileged asHook in the core contract set. It treats directly and continuously nested trigger prototypes in a host as one trigger event route, and merges that route to the outermost trigger prototype in the continuous trigger chain. Direct parenthood and parent prototype lookup are provided by host caps; `asTrigger` consumes those host-cap results but does not define the host tree, DOM containment, or cross-host parent relation itself. The chain stops at the first non-trigger prototype, missing parent, missing prototype lookup result, or host-cap result that cannot prove direct parenthood.


criteria:
  - id: C-AS-TRIGGER-0001-A
    text:
      zh-CN: '`asTrigger()` 必须被建模为特权 asHook，而不是普通 authored asHook 或普通事件注册 helper。'
      en: '`asTrigger()` must be modeled as a privileged asHook, not as an ordinary authored asHook or plain event registration helper.'
  - id: C-AS-TRIGGER-0001-B
    text:
      zh-CN: '`asTrigger()` 必须在 caller prototype 的 asHook trace 中以 privileged trigger identity 记录自身。'
      en: '`asTrigger()` must record itself in the caller prototype asHook trace with a privileged trigger identity.'
  - id: C-AS-TRIGGER-0001-C
    text:
      zh-CN: '`asTrigger()` 必须为当前 caller 的逻辑 instance 记录解析后的 trigger route owner，并由 host 将该 owner identity 投影给 event routing；该 identity 不等同于宿主 DOM target。'
      en: '`asTrigger()` must record the resolved trigger route owner for the current caller logical instance and let the host project that owner identity to event routing; that identity is not the host DOM target.'
  - id: C-AS-TRIGGER-0001-D
    text:
      zh-CN: 当当前 trigger 的直接 parent 也是 trigger，并且该关系连续成立时，activation/event root route 必须合并到连续 trigger 链的最外层 trigger。
      en: When the current trigger's direct parent is also a trigger and that relation remains continuous, the activation/event root route must merge to the outermost trigger in the continuous trigger chain.
  - id: C-AS-TRIGGER-0001-E
    text:
      zh-CN: 当 parent 缺失、parent prototype 缺失、parent 不是 trigger，或 host-cap 不能证明直接 trigger 父子关系时，合并必须停止，当前 trigger 保持自身 route owner。
      en: When the parent is missing, the parent prototype is missing, the parent is not a trigger, or host caps cannot prove direct trigger parenthood, merging must stop and the current trigger remains its own route owner.
  - id: C-AS-TRIGGER-0001-F
    text:
      zh-CN: '`asTrigger()` 的稳定依赖只应包括 asHook privileged/trace 语义、event 通路，以及 host-cap 提供的逻辑 instance、parent、prototype 与 event route projection；不得要求 focus、state interaction、overlay、boundary 或 hit-participation 参与其核心语义。'
      en: '`asTrigger()` stable dependencies should include only asHook privileged/trace semantics, the event path, and host-cap-provided logical instance, parent, prototype, and event-route projection; it must not require focus, state interaction, overlay, boundary, or hit-participation for its core semantics.'
  - id: C-AS-TRIGGER-0001-G
    text:
      zh-CN: host-cap 提供的逻辑 instance identity 必须保持 opaque；`asTrigger()` 不得把该 identity 强制转换或假定为 `EventTarget`，而必须通过 host 提供的 route-target projection 获得可绑定的 event target。
      en: Host-cap-provided logical instance identities must remain opaque; `asTrigger()` must not cast or assume such an identity to be an `EventTarget` and must obtain a bindable event target through the host-provided route-target projection.
  - id: C-AS-TRIGGER-0001-H
    text:
      zh-CN: 当逻辑 trigger owner 在 setup 时尚无物理 view，或其 view epoch 后续被替换时，route-target projection 必须保留逻辑 owner，并把既有 event registrations 绑定或迁移到当前有效 target。
      en: When a logical trigger owner has no physical view during setup or its view epoch is later replaced, route-target projection must preserve the logical owner and bind or migrate existing event registrations to the current live target.
