id: C-AS-HOOK-0003
type: contract
title: defineAsHook accepts a prototype-compatible spec
status: draft
since: 0.1.0
summary: defineAsHook must accept the standard no-arg prototype definition shape, where name remains the prototype spec name and setup follows the prototype setup contract.
statement:
  zh-CN: >-
    `defineAsHook(spec)` 必须接受与 `definePrototype(spec)` 兼容的无参数定义描述。`spec.name` 是 prototype spec 的名称属性，必须遵守 prototype name 的命名规则；它不是作者代码中的 caller binding name。`spec.setup` 仍然是 prototype setup 入口，不因为该 spec 被用于 `defineAsHook` 而改变结构；其返回通道仍然遵守 prototype setup 契约，只能产出 render function 或 void，且 void 由当前 v0 runtime 解释为默认匿名 slot render。普通 authored asHook 的 `setup` 不接收 options/configure API，额外配置能力应由 asHook caller 返回的 handle/API 或后续明确契约提供。


  en: >-
    `defineAsHook(spec)` must accept a no-arg definition shape compatible with `definePrototype(spec)`. `spec.name` is the prototype spec name and must follow prototype name rules; it is not the caller binding name used in author code. `spec.setup` remains the prototype setup entry and does not change shape just because the spec is used by `defineAsHook`; its return channel still follows the prototype setup contract and may only produce a render function or void, with void interpreted by the current v0 runtime as the default anonymous slot render. Ordinary authored asHook `setup` does not receive options/configure APIs; extra configuration capability should come from handles/APIs returned by the asHook caller or future explicit contracts.


criteria:
  - id: C-AS-HOOK-0003-A
    text:
      zh-CN: >-
        `defineAsHook(spec)` 必须接受标准 prototype-compatible 的 `name` 与 `setup` 描述。


      en: >-
        `defineAsHook(spec)` must accept a standard prototype-compatible `name` and `setup` description.


  - id: C-AS-HOOK-0003-B
    text:
      zh-CN: >-
        `spec.name` 表达 prototype spec name，而不是 caller 函数名。


      en: >-
        `spec.name` represents the prototype spec name, not the caller function name.


  - id: C-AS-HOOK-0003-C
    text:
      zh-CN: >-
        asHook 的 `setup` 必须是无参数配置入口，其结构不得偏离 prototype setup；返回通道必须遵守 prototype setup 契约：只能返回 render function 或 void。


      en: >-
        asHook `setup` must be a no-options configuration entry whose shape does not diverge from prototype setup; its return channel must follow the prototype setup contract: render function or void only.


  - id: C-AS-HOOK-0003-D
    text:
      zh-CN: asHook 的 render fragment 不会自动提交；调用者必须显式组合它。
      en: An asHook render fragment must not commit automatically; the caller must compose it explicitly.
