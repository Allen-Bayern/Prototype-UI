id: C-LIFECYCLE-0008
type: contract
title: View intent governs L1 materialization without owning lifecycle facts
status: draft
since: 0.1.0
summary: An alive Proto instance may update desired view presence from callback-time run APIs while RuntimeSession and the adapter owner retain authority over actual view phases and terminal disposal.
statement:
  zh-CN: >-
    Proto UI 必须以 instance-owned ViewIntent 表达 L1 view materialization 的期望状态，并将该期望与 RuntimeSession 的实际 mount phase、感知状态以及 terminal instance disposal 分离。默认 intent 为 present；prototype runtime callback 可以通过 `run.lifecycle.setPresent(present)` 在首次 view 创建前或 alive 期间更新 intent。adapter owner 必须按最新 intent 调和 view epoch，但该 API 不得直接调用 host mount/unmount、伪造实际 phase、销毁 Proto instance 或延长 terminal owner lifetime。


  en: >-
    Proto UI must express desired L1 view materialization through an instance-owned ViewIntent and keep that intent separate from RuntimeSession's actual mount phase, perceptual state, and terminal instance disposal. The default intent is present; prototype runtime callbacks may update the intent through `run.lifecycle.setPresent(present)` before the first view is created or while the instance remains alive. The adapter owner must reconcile the latest intent into view epochs, but this API must not directly invoke host mount/unmount, fabricate actual phases, dispose the Proto instance, or extend the terminal owner's lifetime.


criteria:
  - id: C-LIFECYCLE-0008-A
    text:
      zh-CN: ViewIntent 的 desired 状态、RuntimeSession mount phase 与 transition/perceptual state 必须是彼此独立的状态轴；ViewIntent 不得复制实际 mount phase 状态机。
      en: Desired ViewIntent state, RuntimeSession mount phase, and transition/perceptual state must be independent axes; ViewIntent must not duplicate the actual mount-phase state machine.
  - id: C-LIFECYCLE-0008-B
    text:
      zh-CN: 未调用 runtime view-presence API 的实例必须默认为 desired present，以保持普通 prototype 的 eager materialization 行为。
      en: Instances that do not call the runtime view-presence API must default to desired present, preserving eager materialization for ordinary prototypes.
  - id: C-LIFECYCLE-0008-C
    text:
      zh-CN: desired=detached 可以在首次 view 创建前生效；此时 setup 与 created 必须已经完成，但不得因为 intent 本身执行 render、commit 或 mounted callback。
      en: desired=detached may take effect before the first view is created; setup and created must already be complete, but the intent itself must not cause render, commit, or mounted callbacks.
  - id: C-LIFECYCLE-0008-D
    text:
      zh-CN: adapter owner 必须将最新 intent 调和为实际 view epoch；被更新 intent 取代的 attach、detach、commit 或异步 completion 必须失效。
      en: The adapter owner must reconcile the latest intent into actual view epochs; attach, detach, commit, or asynchronous completions superseded by a newer intent must become inert.
  - id: C-LIFECYCLE-0008-E
    text:
      zh-CN: 将 alive instance 调和到 detached 只能执行 repeatable unmount 并释放 view-owned resources；不得释放 instance-owned state、props、context identity、expose 或 setup 结果。
      en: Reconciling an alive instance to detached may only perform repeatable unmount and release view-owned resources; it must not release instance-owned state, props, context identity, exposes, or setup results.
  - id: C-LIFECYCLE-0008-F
    text:
      zh-CN: terminal owner teardown 的 dispose 权限必须高于所有 ViewIntent；原型作者不得通过 ViewIntent 自行 dispose 或要求复活 instance。
      en: Terminal owner teardown and disposal authority must override every ViewIntent; prototype authors must not dispose or request revival of an instance through ViewIntent.
  - id: C-LIFECYCLE-0008-G
    text:
      zh-CN: prototype-visible 的 L1 控制必须由 callback-only 的 `run.lifecycle.setPresent(boolean)` 提供；setup、render、disposing 与 disposed 阶段的调用必须失败，并且该 surface 不得暴露 RuntimeSession、adapter bridge 或 host-specific lifecycle API。
      en: Prototype-visible L1 control must be provided by callback-only `run.lifecycle.setPresent(boolean)`; calls during setup, render, disposing, or disposed phases must fail, and the surface must not expose RuntimeSession, an adapter bridge, or host-specific lifecycle APIs.
  - id: C-LIFECYCLE-0008-H
    text:
      zh-CN: adapter owner 的首次 intent reconciliation 必须发生在 created callbacks 完成之后，使 created 中写入的 initial intent 能在任何首次 render、commit 或 mount 之前生效。
      en: The adapter owner's first intent reconciliation must occur after created callbacks complete so initial intent written during created takes effect before any first render, commit, or mount.
  - id: C-LIFECYCLE-0008-I
    text:
      zh-CN: L1 只保证当前 Proto instance 的逻辑状态跨 view epoch 保留；被 detached view 包含的宿主子组件实例与原生 view state 不属于该保证。
      en: L1 only guarantees preservation of the current Proto instance's logical state across view epochs; host child-component instances and native view state contained by the detached view are outside this guarantee.
dependsOn:
  contracts:
    - C-LIFECYCLE-0005
    - C-LIFECYCLE-0006
    - C-LIFECYCLE-0007
revisions:
  - version: 0.1.0
    change: introduced
    summary: Defined the declarative ViewIntent boundary for L1 materialization and detached owner reconciliation.
tags:
  - lifecycle
  - view-intent
  - materialization
  - presence
  - adapter
