id: C-RULE-0004
type: contract
title: def.rule is a setup-only declaration API
status: draft
since: 0.1.0
summary: '`def.rule(spec)` declares rules during setup and must not create runtime rule declarations.'
statement:
  zh-CN: >-
    `def.rule(spec)` 是 setup-only 的声明 API。原型作者只能在 setup 阶段声明 Rule；runtime 代码不得新增 Rule。`RuleSpec` 必须由 `when` 与 `intent` 组成，分别记录条件表达式与意图操作；它们在 setup 期只产生可分析数据，不执行 runtime 逻辑。


  en: >-
    `def.rule(spec)` is a setup-only declaration API. Prototype authors may declare Rules only during setup; runtime code must not add new Rules. `RuleSpec` must contain `when` and `intent`, recording the condition expression and intent operations respectively; during setup they produce analyzable data and do not execute runtime logic.


criteria:
  - id: C-RULE-0004-A
    text:
      zh-CN: '`def.rule(spec)` 必须只能在 setup 阶段调用。'
      en: '`def.rule(spec)` must be callable only during setup.'
  - id: C-RULE-0004-B
    text:
      zh-CN: runtime 阶段不得通过 `def.rule` 或等价入口新增 Rule。
      en: Runtime must not add Rules through `def.rule` or equivalent entries.
  - id: C-RULE-0004-C
    text:
      zh-CN: '`RuleSpec.when` 必须记录条件表达式，不得执行 runtime side effect。'
      en: '`RuleSpec.when` must record a condition expression and must not execute runtime side effects.'
  - id: C-RULE-0004-D
    text:
      zh-CN: '`RuleSpec.intent` 必须记录意图操作，不得在 setup 期直接执行这些操作。'
      en: '`RuleSpec.intent` must record intent operations and must not execute those operations directly during setup.'
sources:
  - path: internal/contracts/rule/define.setup-only.v0.md
