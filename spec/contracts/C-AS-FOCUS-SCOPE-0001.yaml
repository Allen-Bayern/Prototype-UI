id: C-AS-FOCUS-SCOPE-0001
type: contract
title: asFocusScope declares a focus coordination boundary
status: draft
since: 0.1.0
summary: asFocusScope is a privileged no-arg singleton asHook for boundary-level focus coordination, including entry, restore, empty container policy, and access to an internal roving handle through its returned handle.
statement:
  zh-CN: >-
    `asFocusScope()` 是 focus domain 的特权 no-arg asHook，用于声明当前原型实例形成 focus coordination boundary。它负责 boundary-level 的 entry、restore、trap/containment、empty container policy 与 scope-level focus requests；setup 期配置必须通过返回的 scope handle 表达。它可以暴露内部 `asFocusRoving()` 风格的 roving handle，但不应吞并所有同级 item navigation 规则，也不负责把 child 自动变成 focusable。


  en: >-
    `asFocusScope()` is the focus-domain privileged no-arg asHook for declaring that the current prototype instance forms a focus coordination boundary. It owns boundary-level entry, restore, trap/containment, empty container policy, and scope-level focus requests; setup-time configuration must be expressed through the returned scope handle. It may expose an internal `asFocusRoving()`-style roving handle, but it should not absorb all sibling item navigation rules and does not make children focusable by itself.


criteria:
  - id: C-AS-FOCUS-SCOPE-0001-A
    text:
      zh-CN: '`asFocusScope()` 必须是特权 no-arg asHook，并且同一 setup 内重复调用必须复用同一个 scope handle。'
      en: '`asFocusScope()` must be a privileged no-arg asHook, and repeated calls in the same setup must reuse the same scope handle.'
  - id: C-AS-FOCUS-SCOPE-0001-B
    text:
      zh-CN: scope handle 必须提供 `focusFirst`、`focusLast`、`focusNext`、`focusPrev`、`focusSelected` 与 `restoreFocus` 这类结构化 focus request。
      en: The scope handle must provide structured focus requests such as `focusFirst`, `focusLast`, `focusNext`, `focusPrev`, `focusSelected`, and `restoreFocus`.
  - id: C-AS-FOCUS-SCOPE-0001-C
    text:
      zh-CN: scope 的 `configure(...)` 必须限制在 setup 期使用。
      en: '`asFocusScope().configure(...)` must be restricted to setup-time use.'
  - id: C-AS-FOCUS-SCOPE-0001-D
    text:
      zh-CN: '`emptyPolicy: container` 必须允许 scope 在没有 focusable child 的情况下激活自身 boundary 状态，而不伪造 node focus。'
      en: '`emptyPolicy: container` must allow a scope to activate its own boundary state without focusable children and without faking node focus.'
  - id: C-AS-FOCUS-SCOPE-0001-E
    text:
      zh-CN: '`getRoving()` 必须返回 scope 内部的 roving handle，并将当前 scope 声明为 roving owner。'
      en: "`getRoving()` must return the scope's internal roving handle and declare the current scope as a roving owner."
