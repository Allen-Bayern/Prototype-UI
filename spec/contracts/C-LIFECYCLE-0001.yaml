id: C-LIFECYCLE-0001
type: contract
title: Prototype execution separates setup-time planning from runtime execution
status: draft
since: 0.1.0
summary: '`setup` materializes one Proto instance; `runtime` covers its alive period, including detached mount intervals.'
statement:
  zh-CN: >-
    Proto UI 的生命周期模型首先被粗略划分为 `setup` 与 `runtime` 两个执行时期：`setup` 是每个 Proto instance 恰好执行一次的实例物化时期，原型作者只能声明、注册或计划该实例的能力；`runtime` 从 setup exit 后开始，覆盖实例 alive、detached、mounted、disposing 直到 dispose complete 的运行过程。host view 暂时 detached 不得结束 runtime 时期。


  en: >-
    Proto UI first separates lifecycle execution into the coarse `setup` and `runtime` periods. `setup` is the per-Proto-instance materialization period and executes exactly once for that instance; prototype authors may only declare, register, or plan its capabilities. `runtime` begins after setup exits and covers the instance while alive, detached, mounted, disposing, and until disposal completes. A temporarily detached host view does not end the runtime period.


criteria:
  - id: C-LIFECYCLE-0001-A
    text:
      zh-CN: '`setup` 时期必须表示某个具体 Proto instance 正在物化、但 runtime callback 与 host view 尚不可用的阶段。'
      en: The `setup` period must represent materialization of a concrete Proto instance before runtime callbacks and host views are available.
  - id: C-LIFECYCLE-0001-B
    text:
      zh-CN: '`setup` 时期的原型 API 语义必须是声明、注册、配置或计划，而不是针对某次真实运行立即执行。'
      en: Prototype APIs in the `setup` period must describe declarations, registrations, configuration, or plans rather than immediate execution for a real invocation.
  - id: C-LIFECYCLE-0001-C
    text:
      zh-CN: '`runtime` 时期必须持续到 instance dispose complete；repeatable unmount 或 detached 状态不得提前结束 runtime。'
      en: The `runtime` period must continue until instance disposal completes; repeatable unmount or detached state must not end runtime early.
  - id: C-LIFECYCLE-0001-D
    text:
      zh-CN: '`runtime` 时期的原型 API 可以观察或作用于当前实例的运行输入、状态、上下文与 host 驱动 callback。'
      en: Prototype APIs in the `runtime` period may observe or act on the current instance's runtime input, state, context, and host-driven callbacks.
  - id: C-LIFECYCLE-0001-E
    text:
      zh-CN: 生命周期 callback 模型与 CP checkpoint 模型不得重新定义 `setup` 语义，只能对 `runtime` 时期进行更细粒度的划分。
      en: The lifecycle callback model and CP checkpoint model must not redefine `setup` semantics; they may only refine the `runtime` period at finer granularity.
  - id: C-LIFECYCLE-0001-F
    text:
      zh-CN: 用于 API 可用性判断的 execution guard 必须至少能区分 `setup` 与 `runtime` 两个时期。
      en: Execution guards used for API availability must at least distinguish the `setup` and `runtime` periods.
