id: C-RULE-0002
type: contract
title: Rule is optional but recommended when expressive enough
status: draft
since: 0.1.0
summary: Rule does not increase the prototype syntax expressive ceiling, but it is the recommended path when behavior fits its declarative condition-to-intent model.
statement:
  zh-CN: >-
    Rule 是可选语法：砍掉 Rule 不应让其他原型语法失去表达同类行为的能力，原型作者通常仍可通过 callback、state、feedback、props、context 等 API 表达同样逻辑。但当某段逻辑能被 Rule 清晰表达时，Rule 是官方推荐路径，因为它将原型作者意图保留为可分析结构，使 adapter 能在无需 compiler 级静态分析的情况下发现优化路径。


  en: >-
    Rule is optional syntax: removing Rule should not make other prototype syntax unable to express the same class of behavior, and prototype authors can usually use callbacks, state, feedback, props, context, and related APIs instead. When a behavior can be expressed clearly by Rule, Rule is the official recommended path because it preserves prototype-author intent as an analyzable structure, allowing adapters to find optimization paths without compiler-grade static analysis.


criteria:
  - id: C-RULE-0002-A
    text:
      zh-CN: Rule 不得被描述为其他原型语法表达能力的必要前提。
      en: Rule must not be described as a prerequisite for the expressiveness of other prototype syntax.
  - id: C-RULE-0002-B
    text:
      zh-CN: 当逻辑可以清晰表达为“条件成立则产生意图”时，官方应推荐使用 Rule。
      en: When logic can be clearly expressed as "condition holds, then produce intent," official guidance should recommend Rule.
  - id: C-RULE-0002-C
    text:
      zh-CN: Rule 的推荐性来自其可分析意图，而不是来自更高的语法表达力上限。
      en: Rule is recommended because it preserves analyzable intent, not because it raises the expressive ceiling of prototype syntax.
  - id: C-RULE-0002-D
    text:
      zh-CN: Rule 表达力有限；历史依赖、宿主特化或任意副作用逻辑不应被强行塞入 Rule。
      en: Rule has limited expressiveness; history-dependent, host-specific, or arbitrary side-effect logic should not be forced into Rule.
