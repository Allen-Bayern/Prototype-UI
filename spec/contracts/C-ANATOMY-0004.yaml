id: C-ANATOMY-0004
type: contract
title: Anatomy claim declares a role
status: draft
since: 0.1.0
summary: An anatomy claim is a setup-only declaration that the current prototype instance takes one role in one family.
statement:
  zh-CN: >-
    `def.anatomy.claim(family, { role, profile? })` 是 setup-only 的 role 声明。它表示当前 prototype instance 主动声明自己在某个 anatomy family 中承担某个 role；claim 只声明结构身份，不创建 part、不注入行为、不移动结构，也不替代 asHook 调用。


  en: >-
    `def.anatomy.claim(family, { role, profile? })` is a setup-only role declaration. It means the current prototype instance claims one role in an anatomy family; a claim only declares structural identity, and does not create parts, inject behavior, move structure, or replace asHook calls.


criteria:
  - id: C-ANATOMY-0004-A
    text:
      zh-CN: '`def.anatomy.claim` 只能在 setup 期间调用。'
      en: '`def.anatomy.claim` may only be called during setup.'
  - id: C-ANATOMY-0004-B
    text:
      zh-CN: Claim 的 role 必须存在于对应 family spec 中。
      en: The claimed role must exist in the corresponding family spec.
  - id: C-ANATOMY-0004-C
    text:
      zh-CN: 同一 prototype instance 在同一 family 中只能 claim 一个 role。
      en: One prototype instance may claim only one role in the same family.
  - id: C-ANATOMY-0004-D
    text:
      zh-CN: '`profile` 只能由 root role 的 claim 指定；非 root claim 指定 profile 必须视为非法声明。'
      en: '`profile` may only be specified by a root-role claim; specifying a profile on a non-root claim must be treated as an invalid declaration.'
  - id: C-ANATOMY-0004-E
    text:
      zh-CN: Claim 不得隐式调用、注入或替代任何 asHook 行为。
      en: A claim must not implicitly call, inject, or replace any asHook behavior.
