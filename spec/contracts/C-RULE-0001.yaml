id: C-RULE-0001
type: contract
title: Rule is not an information channel
status: draft
since: 0.1.0
summary: Rule expresses condition-to-intent relationships and must not be treated as a Proto UI information channel.
statement:
  zh-CN: >-
    Rule 不是信息通路。它不在 User、App Maker、Component、Other Component 或 host/environment 之间传递信息；它表达的是“当某些可观察条件成立时，产生明确意图”的声明式关系。Rule 的 `when` 输入与 `intent` 执行均依赖其他模块或通路提供语义。


  en: >-
    Rule is not an information channel. It does not carry information between User, App Maker, Component, Other Component, or host/environment; it expresses the declarative relationship "when observable conditions hold, produce clear intent." Rule's `when` inputs and `intent` execution depend on semantics provided by other modules or channels.


criteria:
  - id: C-RULE-0001-A
    text:
      zh-CN: Rule 必须被识别为声明式条件到意图的语法，而不是信息通路。
      en: Rule must be identified as declarative condition-to-intent syntax, not as an information channel.
  - id: C-RULE-0001-B
    text:
      zh-CN: Rule 不得被归类为 Props、Feedback、Event、Expose 或 Context 的替代通路。
      en: Rule must not be classified as a replacement channel for Props, Feedback, Event, Expose, or Context.
  - id: C-RULE-0001-C
    text:
      zh-CN: Rule 的输入必须来自其他模块或通路暴露的可观察值；Rule 本身不创造新的信息来源。
      en: Rule inputs must come from observable values exposed by other modules or channels; Rule itself does not create a new information source.
  - id: C-RULE-0001-D
    text:
      zh-CN: Rule 的意图必须交由对应模块或执行边界实现；Rule 本身不直接承担信息通路的发送或接收身份。
      en: Rule intents must be realized by the corresponding module or execution boundary; Rule itself does not directly own a sender or receiver identity as an information channel.
