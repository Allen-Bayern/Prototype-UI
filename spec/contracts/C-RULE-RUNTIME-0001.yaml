id: C-RULE-RUNTIME-0001
type: contract
title: Rule evaluation produces a Plan or equivalent optimized execution
status: draft
since: 0.1.0
summary: Runtime evaluates RuleIR against current inputs, collects active intent in declaration order, and produces a semantic Plan unless an extension executes an equivalent optimized path.
statement:
  zh-CN: >-
    Rule runtime 必须以当前可观察输入评估 RuleIR，选出 active Rule，按声明顺序收集 intent，并对稳定 intent channel 产出语义 Plan。当前 v0 稳定默认 Plan 是 `style.tokens`。Runtime 不得直接触达宿主；默认执行器可以通过 feedback runtime style API 应用 Plan。扩展或 adapter 可以在保持语义等价的前提下 short-circuit Plan 或输出优化产物，但优化结果不得反过来定义 Rule core 语义。


  en: >-
    Rule runtime must evaluate RuleIR against current observable inputs, select active Rules, collect intent in declaration order, and produce a semantic Plan for stable intent channels. The current stable v0 default Plan is `style.tokens`. Runtime must not touch the host directly; the default executor may apply the Plan through feedback runtime style APIs. Extensions or adapters may short-circuit the Plan or produce optimized artifacts when semantics remain equivalent, but optimized results must not define Rule core semantics.


criteria:
  - id: C-RULE-RUNTIME-0001-A
    text:
      zh-CN: Rule runtime 必须根据当前输入评估 RuleIR 的 `when`。
      en: Rule runtime must evaluate RuleIR `when` against current inputs.
  - id: C-RULE-RUNTIME-0001-B
    text:
      zh-CN: active Rule 的 intent 必须按 Rule 声明顺序收集。
      en: Intent from active Rules must be collected in Rule declaration order.
  - id: C-RULE-RUNTIME-0001-C
    text:
      zh-CN: 当前 v0 默认 Plan 必须是 `style.tokens`，且不得被解释为宿主产物。
      en: The current v0 default Plan must be `style.tokens` and must not be interpreted as a host artifact.
  - id: C-RULE-RUNTIME-0001-D
    text:
      zh-CN: 默认执行路径不得直接写宿主 class、attribute、DOM、native view 或平台对象。
      en: The default execution path must not directly write host classes, attributes, DOM, native views, or platform objects.
  - id: C-RULE-RUNTIME-0001-E
    text:
      zh-CN: adapter 或扩展模块的优化路径必须与默认 Plan 语义等价。
      en: Adapter or extension optimization paths must be semantically equivalent to the default Plan.
