id: C-TEXT-CONTROL-0001
type: contract
title: Text Control projects one native multiline editing target
status: draft
since: 0.2.0-rc.7
summary: Text Control binds one declared native textarea to stable value ownership, portable property patches, normalized editing events, and a bounded host lease.
statement:
  zh-CN: >-
    Text Control 必须通过 prototype 的静态 declaration 在首次 render 前选择一个 adapter-owned 原生 textarea，并通过 portable patch、标准化 input/change/composition event 与有界 host lease 投影多行文本编辑协议。Controlled 与 uncontrolled ownership 在 logical instance 生命周期内保持稳定，Template v0 不获得原生 property 或 event channel。


  en: >-
    Text Control must select one adapter-owned native textarea before first render through a prototype static declaration and project the multiline editing protocol through portable patches, normalized input/change/composition events, and a bounded host lease. Controlled or uncontrolled ownership remains stable for the logical instance lifetime, and Template v0 gains no native property or event channel.


criteria:
  - id: C-TEXT-CONTROL-0001-A
    text:
      zh-CN: Static declaration 必须在首次 render 前选择一个原生 textarea target；该 physical target 属于 adapter infrastructure，不属于 Template children。
      en: A static declaration must select one native textarea target before first render; that physical target belongs to adapter infrastructure rather than Template children.
  - id: C-TEXT-CONTROL-0001-B
    text:
      zh-CN: Portable patch 必须投影 value、defaultValue、disabled、readOnly、required、name、placeholder、autoComplete、minLength、maxLength、rows 与 soft/hard wrap；原生 textarea.defaultValue 必须同步，而已编辑的 uncontrolled value 不得被后续 defaultValue 或其他 prop update 重置。
      en: The portable patch must project value, defaultValue, disabled, readOnly, required, name, placeholder, autoComplete, minLength, maxLength, rows, and soft/hard wrap; native textarea.defaultValue must stay synchronized without a later defaultValue or unrelated prop update resetting an edited uncontrolled value.
  - id: C-TEXT-CONTROL-0001-C
    text:
      zh-CN: input、change、compositionstart、compositionupdate 与 compositionend 必须按原生顺序标准化为 value、composing、data 与 inputType facts，不得把原生 Event object 作为 prototype event payload 泄漏。
      en: input, change, compositionstart, compositionupdate, and compositionend must normalize native-order value, composing, data, and inputType facts without leaking the native Event object as a prototype event payload.
  - id: C-TEXT-CONTROL-0001-D
    text:
      zh-CN: 首次同步确定 controlled 或 uncontrolled ownership 后，该模式必须保持稳定；controlled 编辑只构成 proposal，并在 callback boundary 后恢复 owner value。
      en: The first synchronization must establish stable controlled or uncontrolled ownership; a controlled edit is only a proposal, and the owner value must be restored after the callback boundary.
  - id: C-TEXT-CONTROL-0001-E
    text:
      zh-CN: Controlled composition 期间不得恢复旧 value 或破坏 IME candidate/cursor；composition boundary 完成后才可以恢复未被 owner 接纳的 proposal。
      en: Controlled composition must not restore an old value or disrupt the IME candidate or cursor; an unaccepted proposal may be restored only after the composition boundary completes.
  - id: C-TEXT-CONTROL-0001-F
    text:
      zh-CN: Target listener 与 host reference 必须受 mount lease 约束并在 detach/dispose 时撤销；Web Component inner textarea 的原生事件必须在 wrapper boundary 内停止传播，再通过标准化 prototype event 发出。
      en: Target listeners and host references must be bounded by a mount lease and revoked on detach or disposal; native events from a Web Component inner textarea must stop at the wrapper boundary and re-emerge only as normalized prototype events.
