id: C-ANATOMY-0006
type: contract
title: Anatomy profiles refine a family
status: draft
since: 0.1.0
summary: A profile is a named refinement inside one family, not inheritance, derivation, or arbitrary override.
statement:
  zh-CN: >-
    Anatomy profile 是同一 family 内的具名收紧规则集。Profile 可以收紧 family 基线、补充更严格的 relation 或新增 requirement；它不是新 family、不是继承或派生机制，也不得放宽、删除或覆盖 family 已有约束。若 profile 不足以表达差异，应定义新的 anatomy family。


  en: >-
    An anatomy profile is a named refinement inside one family. A profile may tighten the family baseline, add stricter relations, or add requirements; it is not a new family, an inheritance/derivation mechanism, or an arbitrary override, and it must not relax, remove, or override existing family constraints. If a profile is insufficient to express the difference, a new anatomy family should be defined.


criteria:
  - id: C-ANATOMY-0006-A
    text:
      zh-CN: Profile 必须建立在同一个 family 的基线 spec 之上。
      en: A profile must be built on the baseline spec of the same family.
  - id: C-ANATOMY-0006-B
    text:
      zh-CN: Profile 可以收紧 cardinality、增加 asHook requirement、增加更严格 relation。
      en: A profile may tighten cardinality, add asHook requirements, and add stricter relations.
  - id: C-ANATOMY-0006-C
    text:
      zh-CN: Profile 不得放宽 cardinality、删除 requirement、移除 relation 或覆盖 family 基线语义。
      en: A profile must not relax cardinality, delete requirements, remove relations, or override the family baseline semantics.
  - id: C-ANATOMY-0006-D
    text:
      zh-CN: Profile 不得被解释为 family 继承、family 派生或跨 family 多态。
      en: A profile must not be interpreted as family inheritance, family derivation, or cross-family polymorphism.
  - id: C-ANATOMY-0006-E
    text:
      zh-CN: 若需要新增一套无法由收紧表达的结构语义，应优先定义新的 family。
      en: If a structural semantic difference cannot be expressed as refinement, a new family should be defined.
