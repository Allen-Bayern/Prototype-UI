id: C-AS-HOOK-0004
type: contract
title: asHook applies once by default
status: draft
since: 0.1.0
summary: The default repeat policy for the same asHook identity on one caller prototype is once; later same-identity applications are skipped unless a more specific contract defines another policy.
statement:
  zh-CN: >-
    asHook 的默认重复应用策略是 once。同一个调用者 prototype setup 链路中，同一 asHook identity 默认只生效一次；后续同 identity 应用必须跳过且不应抛错。该规则用于避免继承式交互身份被重复安装并产生重复副作用。需要参数合并、latest-wins 或多次安装的 hook 必须由特权 asHook 或后续明确契约单独定义，不得作为 asHook 默认语义。


  en: >-
    The default repeat policy for asHook is once. Within one caller prototype setup chain, the same asHook identity applies only once by default; later applications of the same identity must be skipped and should not throw. This prevents inheritance-like interaction identity from being installed repeatedly and producing duplicate side effects. Hooks that need parameter merging, latest-wins behavior, or multiple installations must define that through privileged asHook contracts or future explicit contracts rather than treating it as default asHook semantics.


criteria:
  - id: C-AS-HOOK-0004-A
    text:
      zh-CN: 同一调用者 prototype 中，同一 asHook identity 默认只能安装一次。
      en: On the same caller prototype, the same asHook identity must install only once by default.
  - id: C-AS-HOOK-0004-B
    text:
      zh-CN: 默认策略下，后续同 identity 调用必须跳过且不应抛错。
      en: Under the default policy, later same-identity calls must be skipped and should not throw.
  - id: C-AS-HOOK-0004-C
    text:
      zh-CN: 默认 once 策略不得被解释为参数合并、latest-wins 或多次独立安装。
      en: The default once policy must not be interpreted as parameter merging, latest-wins, or multiple independent installation.
  - id: C-AS-HOOK-0004-D
    text:
      zh-CN: 如果某 asHook 需要非 once 策略，必须由其自身契约明确重复调用、配置合并与冲突诊断规则。
      en: If an asHook needs a non-once policy, its own contract must define repeated-call, configuration-merge, and conflict-diagnostic rules.
