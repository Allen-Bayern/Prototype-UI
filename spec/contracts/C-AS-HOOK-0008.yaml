id: C-AS-HOOK-0008
type: contract
title: asHook trace is readonly diagnostic metadata
status: draft
since: 0.1.0
summary: Applied asHooks must leave readonly trace metadata for diagnostics and capability checks without becoming writable author-facing state.
statement:
  zh-CN: >-
    调用者 prototype 必须保留已应用 asHook 的只读 trace metadata。该 trace 用于诊断、anatomy requirement 能力检查、工具展示与实现调试；它至少应包含 asHook identity、应用顺序、是否为特权 asHook，以及已稳定的重复策略信息。trace 不是原型作者可写状态，不得作为 runtime 行为通路使用。


  en: >-
    The caller prototype must retain readonly trace metadata for applied asHooks. This trace supports diagnostics, anatomy requirement capability checks, tooling display, and implementation debugging; it should include at least asHook identity, application order, whether the asHook is privileged, and any stable repeat-policy information. The trace is not writable prototype-author state and must not be used as a runtime behavior channel.


criteria:
  - id: C-AS-HOOK-0008-A
    text:
      zh-CN: 调用者 prototype 必须能提供已应用 asHook 的只读 trace。
      en: The caller prototype must provide readonly trace for applied asHooks.
  - id: C-AS-HOOK-0008-B
    text:
      zh-CN: trace 至少应包含 asHook identity、应用顺序与 privileged 标记。
      en: Trace should include at least asHook identity, application order, and privileged flag.
  - id: C-AS-HOOK-0008-C
    text:
      zh-CN: trace 不得可由原型作者写入或篡改。
      en: Trace must not be writable or mutable by prototype authors.
  - id: C-AS-HOOK-0008-D
    text:
      zh-CN: trace 可以被 anatomy requirement 等诊断系统读取，但不得注入行为。
      en: Trace may be read by diagnostic systems such as anatomy requirements, but must not inject behavior.
