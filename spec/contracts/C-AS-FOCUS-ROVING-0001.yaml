    - C-AS-FOCUSABLE-0001
verifies:
  tests:
    - T-FOCUS-ROVING-0001
revisions:
  - version: 0.1.0
    change: introduced
    summary: Captured asFocusRoving as the current sibling-local focus navigation API.
  - version: 0.1.1
    change: refined
    summary: Clarified that asFocusRoving is a no-arg caller and setup-time configuration goes through the returned roving handle.
  - version: 0.1.2
    change: refined
    summary: Clarified that Tab is sequential focus navigation, not roving next/previous movement, and that only the active/current item should participate in natural Tab order.
  - version: 0.1.3
    change: refined
    summary: Clarified via implementation and tests that navParticipation controls natural Tab order but not roving candidate membership.
  - version: 0.1.4
    change: refined
    summary: Added runtime strategy synchronization methods for orientation and loop updates after setup.
