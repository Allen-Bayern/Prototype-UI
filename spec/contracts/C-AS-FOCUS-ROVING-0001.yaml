id: C-AS-FOCUS-ROVING-0001
type: contract
title: asFocusRoving owns sibling-local focus navigation
status: draft
since: 0.1.0
summary: asFocusRoving is the author-facing privileged no-arg asHook for sibling-local roving navigation and replaces the old asFocusGroup concept.
statement:
  zh-CN: >-
    `asFocusRoving()` 是 focus domain 的特权 no-arg asHook，用于声明当前原型实例拥有同级集合的 roving focus navigation。它负责 first/last/next/prev/selected movement、orientation、loop、entry 与 selectOnFocus 等同级导航策略；setup 期配置必须通过返回的 roving handle 表达。旧 `asFocusGroup(...)` 概念已经被 `asFocusRoving()` 吸收；内部可以暂留兼容 alias，但作者 API 不应继续暴露独立的 focus group 概念。


  en: >-
    `asFocusRoving()` is the focus-domain privileged no-arg asHook for declaring that the current prototype instance owns sibling-set roving focus navigation. It owns first/last/next/prev/selected movement, orientation, loop, entry, selectOnFocus, and related sibling navigation policy; setup-time configuration must be expressed through the returned roving handle. The old `asFocusGroup(...)` concept is absorbed by `asFocusRoving()`; internals may temporarily keep compatibility aliases, but the author API should not continue exposing a separate focus group concept.


criteria:
  - id: C-AS-FOCUS-ROVING-0001-A
    text:
      zh-CN: '`asFocusRoving()` 必须是特权 no-arg asHook，并且同一 setup 内重复调用必须复用同一个 roving handle。'
      en: '`asFocusRoving()` must be a privileged no-arg asHook, and repeated calls in the same setup must reuse the same roving handle.'
  - id: C-AS-FOCUS-ROVING-0001-B
    text:
      zh-CN: roving handle 必须提供 `focusFirst`、`focusLast`、`focusNext`、`focusPrev` 与 `focusSelected`。
      en: The roving handle must provide `focusFirst`, `focusLast`, `focusNext`, `focusPrev`, and `focusSelected`.
  - id: C-AS-FOCUS-ROVING-0001-C
    text:
      zh-CN: '`asFocusRoving()` 必须可以通过 logical parent chain 收编未显式传入 `groupKey` 的 focusable child。'
      en: '`asFocusRoving()` must be able to own focusable children without explicit `groupKey` through the logical parent chain.'
  - id: C-AS-FOCUS-ROVING-0001-D
    text:
      zh-CN: '`asFocusGroup(...)` 不得作为当前作者 API 继续从 `@proto.ui/hooks` 暴露。'
      en: '`asFocusGroup(...)` must not continue to be exposed from `@proto.ui/hooks` as a current author API.'
  - id: C-AS-FOCUS-ROVING-0001-E
    text:
      zh-CN: 内部 `FocusGroup*` 名称只能作为兼容 alias 或迁移断口存在，新的实现命名应优先使用 `FocusRoving*`。
      en: Internal `FocusGroup*` names may only exist as compatibility aliases or migration fractures; new implementation naming should prefer `FocusRoving*`.
sources:
  - path: internal/contracts/focus/base-text/focus-roving.v0.md
  - path: internal/contracts/focus/base-text/focus-model.v0.md
