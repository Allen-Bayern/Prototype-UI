  - path: packages/runtime/test/contract/focus-roving.v0.contract.test.ts
dependsOn:
  contracts:
    - C-FOCUS-0001
    - C-FOCUS-0002
    - C-AS-HOOK-PRIVILEGED-0001
    - C-AS-FOCUSABLE-0001
verifies:
  tests:
    - T-FOCUS-ROVING-0001
revisions:
  - version: 0.1.0
    change: introduced
    summary: Captured asFocusRoving as the current sibling-local focus navigation API.
  - version: 0.1.1
    change: refined
    summary: Clarified that asFocusRoving is a no-arg caller and setup-time configuration goes through the returned roving handle.
