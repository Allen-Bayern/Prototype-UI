id: C-RULE-INTENT-FEEDBACK-STYLE-0001
type: contract
title: feedback.style is the stable v0 Rule intent
status: draft
since: 0.1.0
summary: '`i.feedback.style.use(...)` is the stable v0 Rule intent channel and produces feedback style token intent without widening feedback.style token semantics.'
statement:
  zh-CN: >-
    `i.feedback.style.use(...handles)` 是当前 v0 稳定的 Rule intent channel。它记录视觉反馈样式意图，输入仍必须遵守 `feedback.style` 的 token 与 handle 约束；Rule 不扩展 `feedback.style` token 语言。Runtime 必须按 Rule 声明顺序收集 active Rule 的 style token，并交给 feedback semantic merge；Rule 失效时，其 token 贡献必须在下一次评估中移除。


  en: >-
    `i.feedback.style.use(...handles)` is the stable v0 Rule intent channel. It records visual feedback style intent, and its inputs must still follow `feedback.style` token and handle constraints; Rule does not widen the `feedback.style` token language. Runtime must collect style tokens from active Rules in Rule declaration order and pass them through feedback semantic merge; when a Rule deactivates, its token contribution must be removed on the next evaluation.


criteria:
  - id: C-RULE-INTENT-FEEDBACK-STYLE-0001-A
    text:
      zh-CN: '`i.feedback.style.use(...handles)` 必须被识别为 v0 稳定 Rule intent channel。'
      en: '`i.feedback.style.use(...handles)` must be identified as the stable v0 Rule intent channel.'
  - id: C-RULE-INTENT-FEEDBACK-STYLE-0001-B
    text:
      zh-CN: Rule style intent 输入必须遵守 `feedback.style` 的 handle 与 token 约束。
      en: Rule style intent inputs must follow `feedback.style` handle and token constraints.
  - id: C-RULE-INTENT-FEEDBACK-STYLE-0001-C
    text:
      zh-CN: active Rule 的 style token 必须按 Rule 声明顺序收集。
      en: Style tokens from active Rules must be collected in Rule declaration order.
  - id: C-RULE-INTENT-FEEDBACK-STYLE-0001-D
    text:
      zh-CN: 收集后的 token 必须经过 feedback semantic merge，而不是简单 last-write-wins。
      en: Collected tokens must go through feedback semantic merge rather than simple last-write-wins.
  - id: C-RULE-INTENT-FEEDBACK-STYLE-0001-E
    text:
      zh-CN: Rule 失效时，其 style token 贡献必须在下一次评估中移除。
      en: When a Rule deactivates, its style token contribution must be removed on the next evaluation.
