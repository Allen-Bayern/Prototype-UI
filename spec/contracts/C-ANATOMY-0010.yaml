id: C-ANATOMY-0010
type: contract
title: Anatomy diagnostics separate family and profile failures
status: draft
since: 0.1.0
summary: Anatomy diagnostics distinguish broken family baselines from unmet profile refinements.
statement:
  zh-CN: >-
    Anatomy diagnostics 必须区分 family 基线失败与 profile 收紧失败。Family 级违规表示 anatomy family 的核心语义不成立，默认是 error；profile 级违规表示某个具名 refinement 的推荐或收紧结构未满足，默认是 warning，且不得降低 family 级错误的严重性。


  en: >-
    Anatomy diagnostics must distinguish family-baseline failures from profile-refinement failures. A family-level violation means the anatomy family's core semantics do not hold and defaults to error; a profile-level violation means a named refinement's recommended or tightened structure is unmet and defaults to warning, and must not downgrade family-level errors.


criteria:
  - id: C-ANATOMY-0010-A
    text:
      zh-CN: 非法 claim、缺失合法 domain、family cardinality 失败、family relation 失败与 family requirement 缺失必须属于 family 级问题。
      en: Invalid claims, missing valid domains, family cardinality failures, family relation failures, and missing family requirements must be family-level problems.
  - id: C-ANATOMY-0010-B
    text:
      zh-CN: Family 级问题默认应报告为 error。
      en: Family-level problems should default to error.
  - id: C-ANATOMY-0010-C
    text:
      zh-CN: Profile cardinality、profile relation 与 profile 额外 requirement 失败默认应报告为 warning。
      en: Profile cardinality, profile relation, and additional profile requirement failures should default to warning.
  - id: C-ANATOMY-0010-D
    text:
      zh-CN: 诊断不得把所有缺失 role 归为同一种问题，必须尊重 family required role 与 profile recommended/tightened role 的差异。
      en: Diagnostics must not classify all missing roles as the same problem; they must respect the difference between family required roles and profile recommended/tightened roles.
