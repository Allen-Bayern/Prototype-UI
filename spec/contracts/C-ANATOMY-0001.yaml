id: C-ANATOMY-0001
type: contract
title: Anatomy is structural semantics, not an information channel
status: draft
since: 0.1.0
summary: Anatomy describes structural roles and relations inside a compound prototype family without becoming an information channel, composer, assembler, or instance registry.
statement:
  zh-CN: >-
    Anatomy 不是 Proto UI 的信息通路。它是对 Context 的结构语义补全，用于描述复合原型 family 中各 part 的 role、relation、基础约束与同一 domain 内的受限观察；它不得被解释为通用数据传递机制、原型组合器、装配器、自动结构补全系统或实例注册表。


  en: >-
    Anatomy is not a Proto UI information channel. It is a structural-semantic complement to Context for describing roles, relations, baseline constraints, and limited same-domain observation inside a compound prototype family; it must not be interpreted as a general data channel, prototype composer, assembler, automatic materialization system, or instance registry.


criteria:
  - id: C-ANATOMY-0001-A
    text:
      zh-CN: Anatomy 必须被识别为结构语义系统，而不是 Props、Feedback、Event、Expose 或 Context 之外的新增信息通路。
      en: Anatomy must be identified as a structural-semantic system, not as an additional information channel beyond Props, Feedback, Event, Expose, or Context.
  - id: C-ANATOMY-0001-B
    text:
      zh-CN: Anatomy 不得创建 part、移动 part、补全缺失结构、改写 template 输出或改变真实宿主树结构。
      en: Anatomy must not create parts, move parts, materialize missing structure, rewrite template output, or mutate the concrete host tree.
  - id: C-ANATOMY-0001-C
    text:
      zh-CN: Anatomy 不得作为组件间任意数据通信机制；通用组件间通信仍属于 Context。
      en: Anatomy must not be used as an arbitrary inter-component data communication mechanism; ordinary inter-component communication remains Context.
  - id: C-ANATOMY-0001-D
    text:
      zh-CN: Anatomy 可以与 Expose 协同读取同 domain part 主动公开的能力，但这种能力读取不改变 Anatomy 的结构语义定位。
      en: Anatomy may cooperate with Expose to read capabilities explicitly exposed by same-domain parts, but that read capability does not change Anatomy's structural-semantic identity.
