id: C-ANATOMY-0003
type: contract
title: Setup family registration is not author-facing
status: draft
since: 0.1.0
summary: '`def.anatomy.family` is not part of the prototype-author API; anatomy family specs must be defined by static family tokens.'
statement:
  zh-CN: >-
    `def.anatomy.family(family, spec)` 不属于原型作者 API。Anatomy family spec 必须由 static-only 的 family token 携带；runtime/setup 期间只能 claim 已经带有 canonical spec 的 family，不能在每个 part setup 中重复注册 spec。


  en: >-
    `def.anatomy.family(family, spec)` is not part of the prototype-author API. Anatomy family specs must be carried by static-only family tokens; setup/runtime may only claim families that already carry canonical specs, and must not repeat spec registration in each part setup.


criteria:
  - id: C-ANATOMY-0003-A
    text:
      zh-CN: '`DefHandle.anatomy` 不得向原型作者暴露 `family(...)` 注册 API。'
      en: '`DefHandle.anatomy` must not expose a `family(...)` registration API to prototype authors.'
  - id: C-ANATOMY-0003-B
    text:
      zh-CN: Setup 期间不得通过 `register*Family(def)` helper 重复注册 family spec。
      en: Setup must not repeat family-spec registration through `register*Family(def)` helpers.
  - id: C-ANATOMY-0003-C
    text:
      zh-CN: Claim 逻辑必须从 family token 携带的 canonical spec 解析 role、profile、relation 与 requirement。
      en: Claim logic must resolve roles, profiles, relations, and requirements from the canonical spec carried by the family token.
  - id: C-ANATOMY-0003-D
    text:
      zh-CN: 动态或 setup-local family 不是 v0 原型作者能力；需要新设计时必须另起 API 与契约讨论。
      en: Dynamic or setup-local families are not a v0 prototype-author capability; adding them requires a separate API and contract discussion.
sources:
  - path: internal/contracts/anatomy/family-declaration.v0.impl-notes.md
    sections:
      - Role of def.anatomy.family(...)
      - Why register*Family(def) helpers are discouraged
relates:
  contracts:
    - C-ANATOMY-0002
    - C-ANATOMY-0004
revisions:
  - version: 0.1.0
    change: introduced
    summary: Positioned setup family registration as a secondary declaration path.
  - version: 0.1.0
    change: revised
    summary: Removed setup family registration from the prototype-author API in favor of static family tokens.
tags:
  - anatomy
  - family
  - setup
