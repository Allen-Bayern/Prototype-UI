id: C-AS-HOOK-0001
type: contract
title: asHook is a subjectless prototype form attached to the caller
status: draft
since: 0.1.0
summary: asHook is a special prototype form for inheriting interaction identity and reusable protocol behavior without creating an independent interaction subject.
statement:
  zh-CN: >-
    asHook 是失去独立交互主体的特殊原型形态。它用于让调用者 prototype 继承某种交互身份或行为协议能力；asHook 本身不是组件、不是子原型、不是信息通路，也不产生独立 runtime instance。asHook 只有附着到调用者 prototype 的 setup 期间才成立，其引入的效果必须归属于调用者 prototype。


  en: >-
    asHook is a special prototype form without an independent interaction subject. It lets the caller prototype inherit an interaction identity or behavioral protocol capability; asHook itself is not a component, sub-prototype, information channel, or independent runtime instance. An asHook only exists while attached during the caller prototype's setup, and its introduced effects must belong to the caller prototype.


criteria:
  - id: C-AS-HOOK-0001-A
    text:
      zh-CN: asHook 必须被识别为特殊原型形态，而不是普通函数封装或独立 prototype composition。
      en: asHook must be identified as a special prototype form, not as an ordinary function wrapper or independent prototype composition.
  - id: C-AS-HOOK-0001-B
    text:
      zh-CN: asHook 不得创建独立交互主体、独立组件实例或独立 runtime instance。
      en: asHook must not create an independent interaction subject, component instance, or runtime instance.
  - id: C-AS-HOOK-0001-C
    text:
      zh-CN: asHook 引入的语义效果必须附着到调用者 prototype。
      en: Semantic effects introduced by an asHook must attach to the caller prototype.
  - id: C-AS-HOOK-0001-D
    text:
      zh-CN: asHook 表达的是继承式交互身份或行为协议复用；普通组合式逻辑复用不应默认归入 asHook。
      en: asHook expresses inheritance-like interaction identity or behavioral-protocol reuse; ordinary compositional logic reuse should not be classified as asHook by default.
