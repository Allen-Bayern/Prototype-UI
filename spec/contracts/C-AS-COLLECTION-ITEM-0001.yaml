id: C-AS-COLLECTION-ITEM-0001
type: contract
title: asCollectionItem declares an explicit item in a Proto UI collection
status: draft
since: 0.1.0
summary: asCollectionItem is the privileged no-arg asHook for declaring that the current prototype instance participates as an item in an explicitly declared Proto UI collection.
statement:
  zh-CN: >-
    `asCollectionItem()` 是 collection domain 的特权 no-arg asHook，用于声明当前原型实例是某个显式 Collection 的 item。它必须能提供 index、total、first、last 与 item metadata 快照，并在顺序或 metadata 变化时保持读取结果稳定更新。


  en: >-
    `asCollectionItem()` is the collection-domain privileged no-arg asHook for declaring that the current prototype instance participates as an item in an explicit Collection. It must provide index, total, first, last, and item metadata snapshots, and keep reads stable as order or metadata changes.


criteria:
  - id: C-AS-COLLECTION-ITEM-0001-A
    text:
      zh-CN: '`asCollectionItem()` 必须是 no-arg privileged asHook，同一 setup 内重复调用必须复用同一个 item handle。'
      en: '`asCollectionItem()` must be a no-arg privileged asHook, and repeated calls in the same setup must reuse the same item handle.'
  - id: C-AS-COLLECTION-ITEM-0001-B
    text:
      zh-CN: Collection item 配置必须通过返回 handle 的 `configure(...)` 完成，不得通过 asHook 参数传入。
      en: Collection item configuration must be expressed through `configure(...)` on the returned handle and must not be passed as asHook arguments.
  - id: C-AS-COLLECTION-ITEM-0001-C
    text:
      zh-CN: Collection item 必须能暴露 `index`、`total`、`first`、`last` 与 metadata 快照。
      en: A Collection item must expose `index`, `total`, `first`, `last`, and metadata snapshots.
  - id: C-AS-COLLECTION-ITEM-0001-D
    text:
      zh-CN: Collection item 必须由原型显式声明，不得由 collection provider 隐式推断。
      en: A Collection item must be explicitly declared by the prototype and must not be implicitly inferred by the collection provider.
dependsOn:
  contracts:
    - C-AS-COLLECTION-0001
    - C-AS-HOOK-PRIVILEGED-0001
verifies:
  tests:
    - T-COLLECTION-0001
