id: C-CORE-SYNTAX-0007
type: contract
title: Setup-only removal remains setup-only
status: draft
since: 0.1.0
summary: A removal or undo function returned by a setup-only API must not become a runtime escape hatch unless a separate runtime API explicitly defines that behavior.
statement:
  zh-CN: >-
    如果 setup-only API 返回移除、撤销或取消函数，该函数默认也只能在 setup 阶段使用。它用于 setup-time composition 的调整，不得在未另行定义 runtime API 的情况下成为 runtime 逃生舱或 lifecycle disposer。


  en: >-
    If a setup-only API returns a removal, undo, or cancel function, that function is also setup-only by default. It exists for setup-time composition adjustment and must not become a runtime escape hatch or lifecycle disposer unless a separate runtime API explicitly defines that behavior.


criteria:
  - id: C-CORE-SYNTAX-0007-A
    text:
      zh-CN: setup-only API 返回的移除/撤销函数默认必须遵守 setup-only 阶段边界。
      en: Removal or undo functions returned by setup-only APIs must follow the setup-only phase boundary by default.
  - id: C-CORE-SYNTAX-0007-B
    text:
      zh-CN: 这类函数不得被解释为 runtime API、callback disposer 或 lifecycle cleanup 机制，除非另有显式 runtime 契约。
      en: Such functions must not be interpreted as runtime APIs, callback disposers, or lifecycle cleanup mechanisms unless an explicit runtime contract says so.
  - id: C-CORE-SYNTAX-0007-C
    text:
      zh-CN: 如果某能力确实需要 runtime 移除语义，必须单独定义 runtime API 形状、阶段边界与副作用语义。
      en: If a capability truly needs runtime removal semantics, it must define a separate runtime API shape, phase boundary, and side-effect semantics.
  - id: C-CORE-SYNTAX-0007-D
    text:
      zh-CN: 实现不得因为返回函数在 JavaScript 中可被闭包保存，就允许其绕过 setup/runtime API 边界。
      en: Implementations must not allow returned functions to bypass setup/runtime API boundaries merely because JavaScript closures can retain them.
