id: C-ANATOMY-0007
type: contract
title: Anatomy requirements check asHook capabilities
status: draft
since: 0.1.0
summary: The v0 anatomy requirement form checks declared asHook capabilities for role claims without injecting behavior.
statement:
  zh-CN: >-
    Anatomy v0 的 requirement 仅固化 asHook 能力检查。Claim 表达 role 身份认领，requirement 表达该 role 对 prototype 行为协议能力的诊断要求；requirement 不注入行为、不替代显式 asHook 调用，也不使 Anatomy 成为行为组合系统。


  en: >-
    Anatomy v0 requirements only stabilize asHook capability checks. A claim declares role identity, while a requirement expresses diagnostic expectations about the prototype's behavioral-protocol capabilities for that role; a requirement does not inject behavior, replace explicit asHook calls, or make Anatomy a behavior composition system.


criteria:
  - id: C-ANATOMY-0007-A
    text:
      zh-CN: v0 family/profile requirement 的稳定形式只包括 asHook 检查。
      en: The stable v0 family/profile requirement form includes only asHook checks.
  - id: C-ANATOMY-0007-B
    text:
      zh-CN: Requirement 检查的是 claim 了某个 role 的 prototype 是否具备被要求的 asHook 能力。
      en: A requirement checks whether the prototype claiming a role has the required asHook capability.
  - id: C-ANATOMY-0007-C
    text:
      zh-CN: Requirement 不得自动调用 asHook、注入行为或修改 prototype 的 runtime 能力。
      en: A requirement must not automatically call asHook, inject behavior, or mutate the prototype's runtime capabilities.
  - id: C-ANATOMY-0007-D
    text:
      zh-CN: Family 级 requirement 缺失必须被视为 family 级诊断错误。
      en: A missing family-level requirement must be treated as a family-level diagnostic error.
  - id: C-ANATOMY-0007-E
    text:
      zh-CN: Profile 级额外 requirement 缺失默认应被视为 profile 级 warning。
      en: A missing additional profile-level requirement should default to a profile-level warning.
sources:
