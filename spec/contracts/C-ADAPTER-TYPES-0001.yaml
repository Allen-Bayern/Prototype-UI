id: C-ADAPTER-TYPES-0001
type: contract
title: TypeScript adapters preserve the Prototype public surface
status: draft
since: 0.2.0-rc.1
summary: Official TypeScript adapter entrypoints preserve Prototype props, outward signals, and instance exposes instead of erasing generated host components to any.
statement:
  zh-CN: >-
    官方 TypeScript Adapter 将 Prototype 投射为宿主组件、构造器或实例 surface 时，必须保留 Prototype 声明的 props 与 exposes 类型。outward signal 应映射为宿主惯用的 listener 或 emit 类型；value、method 与 state 应映射为 App Maker 实际可取得的 adapter handle 类型。CLI facade 只引用该投影结果，不得复制一份组件类型，也不得将公共组件退化为 any。


  en: >-
    When an official TypeScript adapter projects a Prototype to a host component, constructor, or instance surface, it must preserve the Prototype's declared props and exposes. Outward signals map to host-idiomatic listener or emit types; values, methods, and states map to the adapter handle types actually available to App Makers. CLI facades reference that projected result without duplicating component types or degrading the public component to any.


criteria:
  - id: C-ADAPTER-TYPES-0001-A
    text:
      zh-CN: 官方 TypeScript Adapter 的适配入口必须保留完整 Prototype identity 泛型，使生成的宿主组件 props 不得退化为 any。
      en: Official TypeScript adapter entrypoints must preserve the complete Prototype identity generic so generated host component props do not degrade to any.
  - id: C-ADAPTER-TYPES-0001-B
    text:
      zh-CN: Prototype 声明的 outward signal 必须以宿主惯用 listener 或 emit 命名暴露，并保留 payload 类型；内部 event marker 不得被声明为可读取的 instance expose value。
      en: Prototype outward signals must be exposed with host-idiomatic listener or emit names and retain their payload types; internal event markers must not be declared as readable instance expose values.
  - id: C-ADAPTER-TYPES-0001-C
    text:
      zh-CN: Prototype expose value、method 与 state 必须分别投影为其 value、callable method 与只读 external state handle 类型。
      en: Prototype expose values, methods, and states must project to their value, callable method, and read-only external state handle types respectively.
  - id: C-ADAPTER-TYPES-0001-D
    text:
      zh-CN: Adapter 可以增加明确支持的宿主 props，但不得仅为扩大类型兼容面而声明运行时未转发或不支持的宿主原生 props。
      en: An adapter may add explicitly supported host props, but must not claim host-native props that its runtime does not forward or support merely to broaden type compatibility.
  - id: C-ADAPTER-TYPES-0001-E
    text:
      zh-CN: CLI 生成的 facade 与已打包声明文件必须保留同一类型投影；发布消费测试必须同时验证合法用法、非法值拒绝与 unknown prop 拒绝。
      en: CLI-generated facades and packed declarations must preserve the same type projection; release consumer tests must verify valid usage, invalid-value rejection, and unknown-prop rejection.
sources:
  - path: packages/adapters/base/src/public-types.ts
  - path: packages/adapters/react/src/types.ts
  - path: packages/adapters/vue/src/types.ts
  - path: packages/adapters/web-component/src/types.ts
  - path: scripts/release/consumer-smoke/adapter-types.tsx
dependsOn:
