id: C-LIFECYCLE-0006
type: contract
title: Proto instances own repeatable host-view mount epochs
status: draft
since: 0.1.0
summary: Instance lifetime is independent from repeatable host-view attachment while remaining owned by one lifecycle owner.
statement:
  zh-CN: >-
    每个 Proto instance 必须具有独立的 instance phase 与 mount phase。instance phase 按 setup/alive/disposing/disposed 单向推进；在 alive 期间，mount phase 可以在 detached/mounting/mounted/unmounting 之间经历多个有序 epoch。repeatable unmount 只释放或暂停 host-view-scoped 资源，必须保留 instance-scoped state、props、callback registry 与逻辑身份。


  en: >-
    Every Proto instance must have independent instance and mount phases. Instance phase advances monotonically through setup/alive/disposing/disposed; while alive, mount phase may pass through detached/mounting/mounted/unmounting over multiple ordered epochs. Repeatable unmount only releases or suspends host-view-scoped resources and must preserve instance-scoped state, props, callback registries, and logical identity.


criteria:
  - id: C-LIFECYCLE-0006-A
    text:
      zh-CN: instance phase 与 mount phase 必须是正交状态，不得再用单一 ProtoPhase 混合表达。
      en: Instance phase and mount phase must be orthogonal states and must not be conflated in one ProtoPhase.
  - id: C-LIFECYCLE-0006-B
    text:
      zh-CN: alive instance 可以处于 detached，且 detached 不得触发 terminal module disposal。
      en: An alive instance may be detached, and detached state must not trigger terminal module disposal.
  - id: C-LIFECYCLE-0006-C
    text:
      zh-CN: 每次新的 mount 必须递增 epoch；旧 epoch 的 host binding 与异步 completion 必须失效。
      en: Every new mount must increment the epoch; host bindings and async completions from older epochs must become invalid.
  - id: C-LIFECYCLE-0006-D
    text:
      zh-CN: remount 必须复用同一 instance 的 setup 结果、state 与 logical identity，但可以绑定新的 host view。
      en: Remount must reuse the same instance setup result, state, and logical identity while allowing a new host view binding.
dependsOn:
  contracts:
    - C-LIFECYCLE-0001
    - C-LIFECYCLE-0002
revisions:
  - version: 0.1.0
    change: introduced
    summary: Introduced orthogonal instance and repeatable mount lifecycle axes.
tags:
  - lifecycle
  - instance
  - mount
  - epoch
