id: C-RULE-EXTENSION-0001
type: contract
title: Rule extensions may add secondary when, intent, or execution paths
status: draft
since: 0.1.0
summary: Rule is intentionally extension-friendly; patch modules may add inputs, intents, or optimized execution paths without weakening core RuleIR serialization or semantics.
statement:
  zh-CN: >-
    Rule 很依赖其他 API，因此新增 `when` 输入、`intent` channel 或优化执行路径，通常可以作为 `module-rule` 的补丁模块存在。扩展模块可以 transform RuleIR、补充输入读取、调整 Plan 或 short-circuit 默认执行路径；但不得削弱 RuleIR 可序列化边界，不得把特定优化产物提升为 Rule core 语义。


  en: >-
    Rule depends heavily on other APIs, so adding a `when` input, `intent` channel, or optimized execution path may normally be packaged as a patch module around `module-rule`. Extensions may transform RuleIR, provide additional input reads, adjust Plans, or short-circuit the default execution path; but they must not weaken the serializable RuleIR boundary or elevate a specific optimization artifact into Rule core semantics.


criteria:
  - id: C-RULE-EXTENSION-0001-A
    text:
      zh-CN: 新增 `when` 输入可以由 rule 扩展模块提供。
      en: New `when` inputs may be provided by Rule extension modules.
  - id: C-RULE-EXTENSION-0001-B
    text:
      zh-CN: 新增 `intent` channel 可以由 rule 扩展模块提供，但必须定义自身语义。
      en: New `intent` channels may be provided by Rule extension modules, but must define their own semantics.
  - id: C-RULE-EXTENSION-0001-C
    text:
      zh-CN: 扩展模块可以 short-circuit 默认 Plan，但必须承担等价执行或显式委托责任。
      en: Extension modules may short-circuit the default Plan, but must assume responsibility for equivalent execution or explicit delegation.
  - id: C-RULE-EXTENSION-0001-D
    text:
      zh-CN: Web selector 优化属于 Rule 思路的下游成果，不得作为 Rule core 的设计约束。
      en: Web selector optimization is a downstream result of Rule's design idea and must not act as a design constraint for Rule core.
sources:
  - path: internal/contracts/rule/rule.v0.md
