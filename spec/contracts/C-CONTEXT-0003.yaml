id: C-CONTEXT-0003
type: contract
title: ContextKey identity is created by core
status: draft
since: 0.1.0
summary: ContextKey is the stable identity token for a context channel and should be created through a core factory with debug metadata.
statement:
  zh-CN: >-
    ContextKey 是 context channel 的身份 token。它必须按引用身份比较，而不是按 debugName、字符串名或结构内容比较。原型作者应通过 core 提供的工厂函数创建 ContextKey；debugName 只服务于诊断、错误信息与调试展示。


  en: >-
    ContextKey is the identity token for a context channel. It must be compared by reference identity, not by debugName, string name, or structural content. Prototype authors should create ContextKeys through a core-provided factory; debugName is only for diagnostics, error messages, and debugging display.


criteria:
  - id: C-CONTEXT-0003-A
    text:
      zh-CN: ContextKey identity 必须按引用比较。
      en: ContextKey identity must be compared by reference.
  - id: C-CONTEXT-0003-B
    text:
      zh-CN: '`debugName` 不得参与 identity、provider resolution 或 subscription matching。'
      en: '`debugName` must not participate in identity, provider resolution, or subscription matching.'
  - id: C-CONTEXT-0003-C
    text:
      zh-CN: core 必须提供创建 ContextKey 的工厂函数，例如 `createContextKey<T>(debugName)`。
      en: Core must provide a factory for creating ContextKeys, such as `createContextKey<T>(debugName)`.
  - id: C-CONTEXT-0003-D
    text:
      zh-CN: ContextKey 可以通过模块共享；共享同一引用即共享同一 context channel。
      en: ContextKeys may be shared through modules; sharing the same reference shares the same context channel.
openQuestions:
  - id: C-CONTEXT-0003-Q-FACTORY-IMPLEMENTATION
    question:
      zh-CN: 当前实现仍直接手写 branded object；需要补齐 core factory 并迁移现有原型与测试。
      en: The current implementation still hand-writes branded objects; core factory support and migration of existing prototypes/tests are required.
    context:
      zh-CN: 这是实现缺口，不是契约方向分歧。
      en: This is an implementation gap, not a contract-level disagreement.
    blocks:
      - context key factory implementation
