id: C-AS-HOOK-0009
type: contract
title: authored asHook may project a stable custom caller handle
status: draft
since: 0.1.0
summary: An ordinary authored asHook may project its captured AsHookResult into one custom caller handle without changing the prototype-compatible setup return channel.
statement:
  zh-CN: >-
    普通 authored asHook 可以通过可选的 `projectHandle(result)`，把 runtime 捕获并完成 Borrowed state 投射后的 `AsHookResult` 转换为面向原型作者的定制 caller handle。该能力不得改变 `setup` 只返回 render function 或 void 的 prototype-compatible 契约。once 安装中投射只执行一次，重复调用必须复用严格相同的 handle；runtime 内部的组合、child result 与诊断记录仍以捕获 artifacts 为真相。


  en: >-
    An ordinary authored asHook may use optional `projectHandle(result)` to transform the runtime-captured `AsHookResult`, after borrowed-state projection, into a custom prototype-author-facing caller handle. This capability must not change the prototype-compatible setup contract of returning only a render function or void. Projection runs once for the once installation and repeated calls must reuse the exact same handle; runtime composition, child results, and diagnostic recording continue to use the captured artifacts as their source of truth.


criteria:
  - id: C-AS-HOOK-0009-A
    text:
      zh-CN: '`projectHandle` 必须接收完成 capture 与 Borrowed state 投射后的 `AsHookResult`。'
      en: '`projectHandle` must receive the `AsHookResult` after capture and borrowed-state projection.'
  - id: C-AS-HOOK-0009-B
    text:
      zh-CN: 定制 handle 投射不得改变 asHook `setup` 的 render function 或 void 返回契约。
      en: Custom handle projection must not change the render-function-or-void return contract of asHook `setup`.
  - id: C-AS-HOOK-0009-C
    text:
      zh-CN: once 安装只可创建一个定制 handle，后续调用必须返回严格相同的引用。
      en: A once installation may create only one custom handle and later calls must return the exact same reference.
  - id: C-AS-HOOK-0009-D
    text:
      zh-CN: runtime 组合、child result 与诊断记录必须继续保留捕获 artifacts，不得被定制 handle 替代。
      en: Runtime composition, child results, and diagnostic recording must retain captured artifacts rather than replacing them with the custom handle.
