id: C-AS-HOOK-0009
type: contract
title: authored asHook may project a stable custom caller handle
status: draft
since: 0.1.0
summary: An ordinary authored asHook may project its captured AsHookResult into one custom caller handle without changing the prototype-compatible setup return channel.
statement:
  zh-CN: >-
    普通 authored asHook 可以通过可选的 `projectHandle(result)`，把 runtime 捕获并完成 Borrowed state 投射后的 `AsHookResult` 转换为面向原型作者的定制 caller handle。该能力不得改变 `setup` 只返回 render function 或 void 的 prototype-compatible 契约。once 安装中投射只执行一次，重复调用必须复用严格相同的 handle；runtime 内部的组合与诊断记录仍以捕获 artifacts 为真相。嵌套调用的 child entry 必须同时保留原始 `result` 与稳定投射后的 `handle`，供外层选择性重新导出。


  en: >-
    An ordinary authored asHook may use optional `projectHandle(result)` to transform the runtime-captured `AsHookResult`, after borrowed-state projection, into a custom prototype-author-facing caller handle. This capability must not change the prototype-compatible setup contract of returning only a render function or void. Projection runs once for the once installation and repeated calls must reuse the exact same handle; runtime composition and diagnostic recording continue to use the captured artifacts as their source of truth. A nested call's child entry must retain both the raw `result` and the stable projected `handle` so that an outer hook can selectively re-export it.


criteria:
  - id: C-AS-HOOK-0009-A
    text:
      zh-CN: '`projectHandle` 必须接收完成 capture 与 Borrowed state 投射后的 `AsHookResult`。'
      en: '`projectHandle` must receive the `AsHookResult` after capture and borrowed-state projection.'
  - id: C-AS-HOOK-0009-B
    text:
      zh-CN: 定制 handle 投射不得改变 asHook `setup` 的 render function 或 void 返回契约。
      en: Custom handle projection must not change the render-function-or-void return contract of asHook `setup`.
  - id: C-AS-HOOK-0009-C
    text:
      zh-CN: once 安装只可创建一个定制 handle，后续调用必须返回严格相同的引用。
      en: A once installation may create only one custom handle and later calls must return the exact same reference.
  - id: C-AS-HOOK-0009-D
    text:
      zh-CN: runtime 组合、child result 与诊断记录必须继续保留捕获 artifacts，不得被定制 handle 替代。
      en: Runtime composition, child results, and diagnostic recording must retain captured artifacts rather than replacing them with the custom handle.
  - id: C-AS-HOOK-0009-E
    text:
      zh-CN: 嵌套 child entry 必须同时保留原始 `result` 与稳定 `handle`；外层可显式投射选中的 child handle，但 runtime 不得自动摊平全部嵌套能力。
      en: A nested child entry must retain both its raw `result` and stable `handle`; an outer hook may explicitly project selected child handles, but the runtime must not automatically flatten every nested capability.
  - id: C-AS-HOOK-0009-F
    text:
      zh-CN: authored asHook contract 可以声明 `asHooks` child-handle map；对已声明 literal name 的 `getAsHookHandle(name)` 查询必须推导对应 handle 类型，同时不得改变 runtime 的选择性重新导出与非 flatten 边界。
      en: An authored asHook contract may declare an `asHooks` child-handle map; `getAsHookHandle(name)` lookups for declared literal names must infer the corresponding handle type without changing the runtime boundary of selective re-export and no automatic flattening.
