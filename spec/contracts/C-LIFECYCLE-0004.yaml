id: C-LIFECYCLE-0004
type: contract
title: Runtime and adapters emit epoch-aware lifecycle events
status: draft
since: 0.1.0
summary: Structured lifecycle events describe instance phases, repeatable mount epochs, update revisions, and terminal disposal.
statement:
  zh-CN: >-
    Proto UI runtime 与 adapter 必须使用结构化、带 mount epoch 与 update revision 的 lifecycle event 描述 canonical runtime order。event stream 必须分别表达 instance setup/created/dispose、repeatable mount/unmount 以及每个 mounted epoch 内的 update commit。旧 CP0-CP10 string checkpoint 模型无法表达重复 epoch 与 unmount/dispose 分离，契约上进入 deprecated 状态；实现可以提供有损兼容投射，但不得继续把 CP0-CP10 作为 lifecycle source of truth。


  en: >-
    Proto UI runtime and adapters must use structured lifecycle events carrying mount epochs and update revisions to describe canonical runtime order. The event stream must separately represent instance setup/created/disposal, repeatable mount/unmount, and update commits within each mounted epoch. The old CP0-CP10 string checkpoint model cannot represent repeated epochs or the unmount/dispose split and is deprecated by contract; implementations may provide a lossy compatibility projection, but CP0-CP10 must no longer be the lifecycle source of truth.


criteria:
  - id: C-LIFECYCLE-0004-A
    text:
      zh-CN: instance event 必须至少表达 setup exit、created、dispose begin 与 dispose done。
      en: Instance events must represent at least setup exit, created, dispose begin, and dispose done.
  - id: C-LIFECYCLE-0004-B
    text:
      zh-CN: 每个 mount epoch 必须具有单调递增的 epoch，并按 mount begin/render/commit done/mounted/unmount begin/unmount done 的有效子序列记录。
      en: Every mount epoch must have a monotonically increasing epoch and record a valid subsequence of mount begin/render/commit done/mounted/unmount begin/unmount done.
  - id: C-LIFECYCLE-0004-C
    text:
      zh-CN: update event 必须携带所属 mount epoch 与 revision，并按 render/commit done/updated 排序。
      en: Update events must carry their mount epoch and revision and be ordered as render/commit done/updated.
  - id: C-LIFECYCLE-0004-D
    text:
      zh-CN: 过期 epoch 或 revision 的异步 completion 不得推进当前 lifecycle 或调用 callback。
      en: Async completion from a stale epoch or revision must not advance the current lifecycle or invoke callbacks.
  - id: C-LIFECYCLE-0004-E
    text:
      zh-CN: lifecycle event 是 runtime/adapter diagnostics 与 conformance test 的 source of truth，但不得暴露为 prototype author API。
      en: Lifecycle events are the source of truth for runtime/adapter diagnostics and conformance tests but must not be exposed as prototype-author APIs.
  - id: C-LIFECYCLE-0004-F
    text:
      zh-CN: CP0-CP10 checkpoint API 与 canonical name 必须标记 deprecated；兼容投射必须明确为有损且不得参与新状态机校验。
      en: The CP0-CP10 checkpoint API and canonical names must be marked deprecated; compatibility projection must be documented as lossy and must not validate the new state machine.
dependsOn:
  contracts:
    - C-LIFECYCLE-0001
    - C-LIFECYCLE-0002
    - C-LIFECYCLE-0003
    - C-LIFECYCLE-0006
revisions:
  - version: 0.1.0
    change: introduced
    summary: Drafted the original CP0-CP10 runtime/adapter checkpoint model.
  - version: 0.1.0
    change: breaking
    summary: Replaced CP0-CP10 as source of truth with structured epoch-aware lifecycle events and deprecated the old checkpoint projection.
tags:
  - lifecycle
  - event
  - epoch
  - runtime
  - adapter
