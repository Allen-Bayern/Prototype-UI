id: C-FOCUS-0002
type: contract
title: Focus topology is resolved through host logical parent relationships first
status: draft
since: 0.1.0
summary: Focus membership and ownership should use the host logical parent chain as the primary topology source, with token/key membership only as compatibility or escape hatch.
statement:
  zh-CN: >-
    Proto UI 的 focus topology 必须优先通过宿主提供的 logical parent/child 关系解析。focus node、scope、roving owner 与 member 的默认关系应与 context、anatomy 所依赖的逻辑树同源，而不是以 DOM containment、宿主物理嵌套或手工 token 传递作为跨平台主模型。`scopeKey`、`groupKey` 等 token/key surface 可以作为兼容机制或 escape hatch 保留，但不应成为 focus topology 的主要表达方式。


  en: >-
    Proto UI focus topology must resolve through host-provided logical parent/child relationships first. The default relationship between focus nodes, scopes, roving owners, and members should share the logical-tree source used by context and anatomy, rather than treating DOM containment, physical host nesting, or manual token passing as the cross-platform primary model. Token/key surfaces such as `scopeKey` and `groupKey` may remain as compatibility mechanisms or escape hatches, but should not be the primary expression of focus topology.


criteria:
  - id: C-FOCUS-0002-A
    text:
      zh-CN: focus topology 的默认解析必须消费 host logical parent/child 信息，而不是直接依赖 DOM containment。
      en: Default focus topology resolution must consume host logical parent/child information rather than directly depending on DOM containment.
  - id: C-FOCUS-0002-B
    text:
      zh-CN: 没有显式 `groupKey` 的 focusable child 必须可以被最近的 logical roving owner 收编。
      en: A focusable child without an explicit `groupKey` must be able to belong to the nearest logical roving owner.
  - id: C-FOCUS-0002-C
    text:
      zh-CN: 当 token/key membership 与 logical parent chain 同时存在时，token/key 只能作为兼容过滤或 escape hatch，不得覆盖已证明的 logical ownership。
      en: When token/key membership and a logical parent chain both exist, token/key membership may only act as a compatibility filter or escape hatch and must not replace proven logical ownership.
  - id: C-FOCUS-0002-D
    text:
      zh-CN: host 无法提供 logical parent 信息时，runtime 可以保留兼容 fallback，但该 fallback 不得被定义为长期主模型。
      en: When the host cannot provide logical parent information, runtime may keep compatibility fallbacks, but those fallbacks must not be defined as the long-term primary model.
