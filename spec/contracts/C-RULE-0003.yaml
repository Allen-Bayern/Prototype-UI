id: C-RULE-0003
type: contract
title: RuleIR must be serializable
status: draft
since: 0.1.0
summary: Rule declarations must compile into fully serializable RuleIR rather than retaining functions, host references, runtime closures, or live handles.
statement:
  zh-CN: >-
    Rule 的中间产物必须是完全可序列化的 RuleIR，实践上可视为应能降为 string。RuleIR 不得携带函数、宿主对象、runtime closure、adapter 私有对象或 live runtime handle；如果实现为了执行需要保留 handle，必须将其放在 RuleIR 之外的实现侧表中，并让 RuleIR 只记录可序列化 identity。


  en: >-
    Rule's intermediate product must be fully serializable RuleIR, which in practice should be reducible to a string-serializable structure. RuleIR must not carry functions, host objects, runtime closures, adapter-private objects, or live runtime handles; if an implementation needs handles for execution, it must keep them in implementation-side tables outside RuleIR and let RuleIR record only serializable identities.


criteria:
  - id: C-RULE-0003-A
    text:
      zh-CN: RuleIR 必须由可序列化数据组成。
      en: RuleIR must be composed of serializable data.
  - id: C-RULE-0003-B
    text:
      zh-CN: RuleIR 不得包含函数、宿主对象、runtime closure 或 adapter 私有对象。
      en: RuleIR must not contain functions, host objects, runtime closures, or adapter-private objects.
  - id: C-RULE-0003-C
    text:
      zh-CN: RuleIR 不得直接保留 live runtime handle；需要执行侧 handle 时，必须通过 RuleIR 外部的实现侧表关联。
      en: RuleIR must not directly retain live runtime handles; when execution-side handles are needed, they must be associated through implementation-side tables outside RuleIR.
  - id: C-RULE-0003-D
    text:
      zh-CN: RuleIR 中用于指向 state、context、props 或其他输入/目标的内容必须是可序列化 identity 或 path，而不是不可序列化对象本身。
      en: RuleIR references to state, context, props, or other inputs/targets must be serializable identities or paths, not the non-serializable objects themselves.
openQuestions:
  - id: C-RULE-0003-Q-IMPLEMENTATION-GAP
    question:
      zh-CN: 当前实现中 RuleIR 仍可能携带 live handle 的路径，应如何迁移到 RuleIR 外部的 side table？
      en: How should current implementation paths that can still carry live handles inside RuleIR migrate to side tables outside RuleIR?
    context:
      zh-CN: 尤其是 deferred 的 `intent.state` 路径仍有 handle 保留问题。
      en: The deferred `intent.state` path is the main known handle-retention issue.
sources:
