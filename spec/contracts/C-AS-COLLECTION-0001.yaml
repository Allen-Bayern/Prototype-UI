id: C-AS-COLLECTION-0001
type: contract
title: asCollection declares an explicit ordered Proto UI item set
status: draft
since: 0.1.0
summary: asCollection is the privileged no-arg asHook for declaring that the current prototype instance provides an explicitly declared ordered collection of Proto UI items.
statement:
  zh-CN: >-
    `asCollection()` 是 collection domain 的特权 no-arg asHook，用于声明当前原型实例提供一组显式声明的 Proto UI item。它负责把 anatomy/logical order 投影为 collection item 快照，并提供 count 与 ordered item reads；它不拥有 selection、focus movement、keyboard policy 或 a11y pattern。


  en: >-
    `asCollection()` is the collection-domain privileged no-arg asHook for declaring that the current prototype instance provides an explicitly declared set of Proto UI items. It projects anatomy/logical order into collection item snapshots and provides count and ordered item reads; it does not own selection, focus movement, keyboard policy, or a11y pattern semantics.


criteria:
  - id: C-AS-COLLECTION-0001-A
    text:
      zh-CN: '`asCollection()` 必须是 no-arg privileged asHook，同一 setup 内重复调用必须复用同一个 collection handle。'
      en: '`asCollection()` must be a no-arg privileged asHook, and repeated calls in the same setup must reuse the same collection handle.'
  - id: C-AS-COLLECTION-0001-B
    text:
      zh-CN: Collection 配置必须通过返回 handle 的 `configure(...)` 完成，不得通过 asHook 参数传入。
      en: Collection configuration must be expressed through `configure(...)` on the returned handle and must not be passed as asHook arguments.
  - id: C-AS-COLLECTION-0001-C
    text:
      zh-CN: Collection provider 必须能暴露当前 item 数量与有序 item 快照。
      en: A Collection provider must expose the current item count and ordered item snapshots.
  - id: C-AS-COLLECTION-0001-D
    text:
      zh-CN: Collection item 顺序必须反映当前宿主可观察顺序，且必须能响应动态插入、移除和重排。
      en: Collection item order must reflect the current host-observable order and must respond to dynamic insertion, removal, and reordering.
  - id: C-AS-COLLECTION-0001-E
    text:
      zh-CN: Collection 不得隐式包含未通过 Proto UI collection item 声明的宿主后代。
      en: Collection must not implicitly include host descendants that were not declared as Proto UI collection items.
