id: C-AS-HOOK-0002
type: contract
title: asHook callers are setup-only
status: draft
since: 0.1.0
summary: asHook can only be applied during the caller prototype setup and must not be invoked from render or runtime callbacks.
statement:
  zh-CN: >-
    asHook caller 是 setup-only API。原型作者只能在调用者 prototype 的 setup 阶段应用 asHook；render、lifecycle callback、event callback、props watcher、context watcher 或其他 runtime 期间不得新增 asHook 应用。runtime 中需要的行为必须由 asHook 在 setup 期间提前声明并通过 callback、state、feedback、event、expose 等既有契约执行。


  en: >-
    An asHook caller is a setup-only API. Prototype authors may apply asHook only during the caller prototype's setup; render, lifecycle callbacks, event callbacks, props watchers, context watchers, or any other runtime period must not add asHook applications. Runtime behavior must be declared by the asHook during setup and later execute through existing callback, state, feedback, event, expose, or related contracts.


criteria:
  - id: C-AS-HOOK-0002-A
    text:
      zh-CN: asHook caller 必须只能在 setup 阶段调用。
      en: asHook callers must be callable only during setup.
  - id: C-AS-HOOK-0002-B
    text:
      zh-CN: render 阶段不得调用 asHook caller。
      en: Render must not call asHook callers.
  - id: C-AS-HOOK-0002-C
    text:
      zh-CN: runtime callback 阶段不得调用 asHook caller。
      en: Runtime callbacks must not call asHook callers.
  - id: C-AS-HOOK-0002-D
    text:
      zh-CN: runtime 行为必须由 setup 期 asHook 提前声明的既有能力承载，而不是通过 runtime 新增 asHook 实现。
      en: Runtime behavior must be carried by capabilities declared by the asHook during setup, not by adding new asHooks at runtime.
