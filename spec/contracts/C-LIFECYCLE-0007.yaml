id: C-LIFECYCLE-0007
type: contract
title: Every Proto instance has one terminal lifecycle owner
status: draft
since: 0.1.0
summary: A host component or explicit retained-session manager owns terminal Proto instance disposal.
statement:
  zh-CN: >-
    每个 Proto instance 必须恰好有一个 lifecycle owner。默认 owner 是创建它的 adapter host component instance；owner 可以让同一 Proto instance 经历多个 host view mount epoch，但 owner 的 terminal teardown 必须最终触发 Proto dispose。Proto instance 可以持有可撤销 host binding，但不得反向拥有、延长或复活 host component instance。


  en: >-
    Every Proto instance must have exactly one lifecycle owner. By default the owner is the adapter host component instance that created it; the owner may drive multiple host-view mount epochs for the same Proto instance, but terminal owner teardown must eventually dispose the Proto instance. A Proto instance may hold revocable host bindings but must not own, extend, or resurrect the host component instance.


criteria:
  - id: C-LIFECYCLE-0007-A
    text:
      zh-CN: 默认 Proto instance lifetime 必须包含于 owner host component lifetime。
      en: By default, Proto instance lifetime must be contained within its owner host component lifetime.
  - id: C-LIFECYCLE-0007-B
    text:
      zh-CN: adapter 内部条件渲染 host view 必须映射为 repeatable mount/unmount，而不是 owner teardown。
      en: Adapter-internal conditional host-view rendering must map to repeatable mount/unmount rather than owner teardown.
  - id: C-LIFECYCLE-0007-C
    text:
      zh-CN: host component terminal teardown 必须映射为 Proto dispose；默认不得跨 owner 复用 Proto instance。
      en: Terminal host-component teardown must map to Proto disposal; a Proto instance must not be reused across owners by default.
  - id: C-LIFECYCLE-0007-D
    text:
      zh-CN: 跨 owner 保留必须由显式 retained-session owner 管理，不得成为 adapter 隐式行为。
      en: Cross-owner retention must be managed by an explicit retained-session owner and must not be implicit adapter behavior.
dependsOn:
  contracts:
    - C-LIFECYCLE-0006
revisions:
  - version: 0.1.0
    change: introduced
    summary: Defined terminal lifecycle ownership and revocable host bindings.
tags:
  - lifecycle
  - ownership
  - adapter
  - disposal
