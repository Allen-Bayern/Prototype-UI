id: C-ANATOMY-0009
type: contract
title: Part views read explicit exposes
status: draft
since: 0.1.0
summary: Anatomy may read only capabilities explicitly exposed by same-domain parts through Expose.
statement:
  zh-CN: >-
    Anatomy PartView 只能通过 Expose 读取 same-domain part 主动公开的能力。Anatomy 因此在实现上依赖 Expose，但这种依赖是对 Expose 的使用，而不是继承 Expose 的通路身份；Anatomy 不新增独立输出系统，也不得推断、补造或访问未公开的内部能力。


  en: >-
    An Anatomy PartView may read only capabilities explicitly exposed by same-domain parts through Expose. Anatomy therefore depends on Expose in implementation, but this dependency is usage of Expose rather than inheritance of Expose's channel identity; Anatomy does not add an independent output system and must not infer, fabricate, or access unexposed internal capabilities.


criteria:
  - id: C-ANATOMY-0009-A
    text:
      zh-CN: PartView 可以提供 `hasExpose` 与 `getExpose` 一类受限读取能力。
      en: A PartView may provide limited read capabilities such as `hasExpose` and `getExpose`.
  - id: C-ANATOMY-0009-B
    text:
      zh-CN: Anatomy 只能读取目标 part 已经通过 Expose 主动公开的 key。
      en: Anatomy may read only keys the target part has explicitly exposed through Expose.
  - id: C-ANATOMY-0009-C
    text:
      zh-CN: 若目标 part 未 expose 某项能力，Anatomy 不得推断、补造或访问其内部替代能力。
      en: If the target part has not exposed a capability, Anatomy must not infer, fabricate, or access an internal substitute.
  - id: C-ANATOMY-0009-D
    text:
      zh-CN: Anatomy 对 Expose 的实现依赖必须在治理与模块依赖中被明确记录。
      en: Anatomy's implementation dependency on Expose must be explicitly recorded in governance and module dependencies.
sources:
  - path: internal/contracts/anatomy/base-text/01.terminology.v0.zh-CN.md
    sections:
      - Anatomy 与 Expose
  - path: internal/contracts/anatomy/base-text/04.runtime-access.v0.zh-CN.md
