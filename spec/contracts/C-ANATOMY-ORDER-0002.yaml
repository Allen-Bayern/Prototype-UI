id: C-ANATOMY-ORDER-0002
type: contract
title: Anatomy order exposes self position and version
status: draft
since: 0.1.0
summary: Anatomy order can expose ordered role projections, self adjacency, and an order signature version.
statement:
  zh-CN: >-
    Anatomy order 可以提供同 role part 的有序投影、当前 part 的有序位置、前后相邻 part 与 order version。Order version 只表达 order signature 的变化，不表达业务数据、Expose 值、State 值或 Feedback 结果变化。


  en: >-
    Anatomy order may expose ordered same-role projections, the current part's ordered position, adjacent previous/next parts, and an order version. The order version expresses only changes to the order signature, not changes to business data, Expose values, State values, or Feedback results.


criteria:
  - id: C-ANATOMY-ORDER-0002-A
    text:
      zh-CN: Order view 可以提供 `parts`、`partsOf`、`indexOfSelf`、`prevOfSelf` 与 `nextOfSelf`。
      en: The order view may provide `parts`, `partsOf`, `indexOfSelf`, `prevOfSelf`, and `nextOfSelf`.
  - id: C-ANATOMY-ORDER-0002-B
    text:
      zh-CN: '`indexOfSelf`、`prevOfSelf` 与 `nextOfSelf` 必须基于当前 part 在同 domain、同 role 有序投影中的位置。'
      en: "`indexOfSelf`, `prevOfSelf`, and `nextOfSelf` must be based on the current part's position in the same-domain, same-role ordered projection."
  - id: C-ANATOMY-ORDER-0002-C
    text:
      zh-CN: '`version` 必须只表达 order signature 的变化。'
      en: '`version` must express only changes to the order signature.'
  - id: C-ANATOMY-ORDER-0002-D
    text:
      zh-CN: '`version` 不得被解释为 part 业务数据、Expose、State、Feedback 或 Template 内容变化。'
      en: '`version` must not be interpreted as changes to part business data, Expose, State, Feedback, or Template content.'
sources:
  - path: apps/www/src/content/docs/zh-cn/wiki/anatomy.md
    sections:
      - anatomy.order 提供什么能力？
dependsOn:
  contracts:
    - C-ANATOMY-ORDER-0001
revisions:
  - version: 0.1.0
    change: introduced
    summary: Captured anatomy.order adjacency queries and order version semantics.
tags:
  - anatomy
  - order
  - version
