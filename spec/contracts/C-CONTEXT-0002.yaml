id: C-CONTEXT-0002
type: contract
title: Context providers establish communication scopes
status: draft
since: 0.1.0
summary: A context provider establishes a scoped context value, but successful updates may be initiated by either the provider or participants subscribed to that scope.
statement:
  zh-CN: >-
    Context provider 的职责是建立某个 ContextKey 的通信作用域与初始值，而不是限定 Context 只能从 provider 单向流向 consumer。处于同一 resolved context scope 内的组件可以读取、订阅，并在拥有相应 subscription intent 后通过 runtime API 发起更新。


  en: >-
    A Context provider establishes the communication scope and initial value for a ContextKey; it does not mean Context flows only one-way from provider to consumer. Components inside the same resolved context scope may read, subscribe, and initiate updates through runtime APIs after declaring the appropriate subscription intent.


criteria:
  - id: C-CONTEXT-0002-A
    text:
      zh-CN: provider 必须建立 ContextKey 对应的 scope 与初始 context value。
      en: Providers must establish the scope and initial context value for a ContextKey.
  - id: C-CONTEXT-0002-B
    text:
      zh-CN: provider 不得被解释为 context update 的唯一合法发起者。
      en: Providers must not be interpreted as the only legal initiators of context updates.
  - id: C-CONTEXT-0002-C
    text:
      zh-CN: 已订阅同一 resolved context scope 的组件可以通过 `run.context.update` 或 `tryUpdate` 更新该 context。
      en: Components subscribed to the same resolved context scope may update that context through `run.context.update` or `tryUpdate`.
  - id: C-CONTEXT-0002-D
    text:
      zh-CN: provider/consumer 术语只能描述 resolution 和参与角色，不得强行定义单向信息流。
      en: Provider/consumer terminology may describe resolution and participation roles, but must not impose one-way information flow.
sources:
  - path: internal/contracts/context/with-tree.v0.md
    sections:
      - Provide & update
  - path: packages/modules/context/src/impl.ts
    sections:
