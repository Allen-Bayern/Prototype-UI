id: C-CONTEXT-0009
type: contract
title: Context values are top-level JSON objects
status: draft
since: 0.1.0
summary: Context values must be JSON-compatible records, with top-level null reserved for optional absence rather than provided values.
statement:
  zh-CN: >-
    Context value 必须位于 JSON value 边界内，并且顶层必须是 JSON object，也就是 `Record<string, JsonValue>`。顶层 `null` 是 optional context absence 的返回语义，不是合法的 provided context value。context value 不得包含 function、state handle、host reference、PrototypeRef、class instance、循环引用或其他非 JSON 结构。


  en: >-
    Context values must stay inside the JSON value boundary, and the top level must be a JSON object, meaning `Record<string, JsonValue>`. Top-level `null` is the return semantics for optional context absence, not a legal provided context value. Context values must not contain functions, state handles, host references, PrototypeRefs, class instances, circular references, or other non-JSON structures.


criteria:
  - id: C-CONTEXT-0009-A
    text:
      zh-CN: provided context value 顶层必须是 JSON object。
      en: Provided context values must be top-level JSON objects.
  - id: C-CONTEXT-0009-B
    text:
      zh-CN: 顶层 `null` 不得作为合法 context value；它保留表示 optional absence。
      en: Top-level `null` must not be a legal context value; it is reserved for optional absence.
  - id: C-CONTEXT-0009-C
    text:
      zh-CN: context value 内部字段可以使用 JSON primitive、array、object 与字段级 `null`。
      en: Context value fields may use JSON primitives, arrays, objects, and field-level `null`.
  - id: C-CONTEXT-0009-D
    text:
      zh-CN: context value 不得包含 function、symbol、bigint、Date、Map、Set、DOM/host object、State handle、PrototypeRef 或循环引用。
      en: Context values must not contain functions, symbols, bigint, Date, Map, Set, DOM/host objects, State handles, PrototypeRefs, or circular references.
  - id: C-CONTEXT-0009-E
    text:
      zh-CN: invalid context value 必须失败，不得被静默清洗为其他值。
      en: Invalid context values must fail and must not be silently sanitized into other values.
sources:
  - path: internal/contracts/context/with-tree.v0.md
    sections:
