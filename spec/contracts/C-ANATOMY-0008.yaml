id: C-ANATOMY-0008
type: contract
title: Runtime queries return safe part views
status: draft
since: 0.1.0
summary: Anatomy runtime queries are runtime-only and may return only limited part views for actual same-domain parts.
statement:
  zh-CN: >-
    `run.anatomy.has`、`run.anatomy.parts` 与 `run.anatomy.partsOf` 是 runtime-only 的受限查询面。它们只能返回当前 anatomy domain 中实际存在的 same-family part view；返回值不得包含 prototype instance、host node、root target、adapter target 或任何 raw reference。


  en: >-
    `run.anatomy.has`, `run.anatomy.parts`, and `run.anatomy.partsOf` are runtime-only limited query surfaces. They may return only part views for actual same-family parts in the current anatomy domain; returned values must not contain prototype instances, host nodes, root targets, adapter targets, or any raw references.


criteria:
  - id: C-ANATOMY-0008-A
    text:
      zh-CN: Anatomy runtime query API 只能在 runtime 期间调用。
      en: Anatomy runtime query APIs may only be called during runtime.
  - id: C-ANATOMY-0008-B
    text:
      zh-CN: Query 只能返回当前 domain 中实际存在的 same-family part view，不得虚拟补全缺失 part。
      en: Queries may return only actually existing same-family part views in the current domain, and must not virtually materialize missing parts.
  - id: C-ANATOMY-0008-C
    text:
      zh-CN: Part view 不得向原型作者暴露 prototype instance、host node、root target、adapter target 或任何 raw reference。
      en: A part view must not expose prototype instances, host nodes, root targets, adapter targets, or any raw references to prototype authors.
  - id: C-ANATOMY-0008-D
    text:
      zh-CN: Renderer read view 可以提供 anatomy 的只读 query surface，但不得提供 setup/claim 或其他写入能力。
      en: The renderer read view may provide Anatomy's read-only query surface, but must not provide setup/claim or other write capabilities.
