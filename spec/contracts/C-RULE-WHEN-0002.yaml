id: C-RULE-WHEN-0002
type: contract
title: Rule when inputs are module-backed observable values
status: draft
since: 0.1.0
summary: Rule core does not create input sources; each `when` input surface must be backed by another module or extension and define its own dependency identity and read semantics.
statement:
  zh-CN: >-
    Rule core 不创造输入源。`when` 中可观察的 props、state、context 或其他输入，必须由对应模块或 rule 扩展模块提供，并为 RuleIR 定义可序列化的依赖 identity、读取语义、重评估触发边界与诊断边界。新增 `when` 语法可以作为 `module-rule` 的补丁模块存在。


  en: >-
    Rule core does not create input sources. Observable props, state, context, or other inputs in `when` must be provided by the corresponding module or a Rule extension module, and must define serializable dependency identity, read semantics, re-evaluation trigger boundaries, and diagnostic boundaries for RuleIR. New `when` syntax may exist as a patch module around `module-rule`.


criteria:
  - id: C-RULE-WHEN-0002-A
    text:
      zh-CN: Rule core 不得把输入来源伪装成 Rule 自身拥有的状态或通路。
      en: Rule core must not pretend that input sources are state or channels owned by Rule itself.
  - id: C-RULE-WHEN-0002-B
    text:
      zh-CN: 每个 `when` 输入 surface 必须定义 RuleIR 中的可序列化依赖 identity。
      en: Each `when` input surface must define serializable dependency identity in RuleIR.
  - id: C-RULE-WHEN-0002-C
    text:
      zh-CN: 每个 `when` 输入 surface 必须定义 runtime 求值时如何读取当前值。
      en: Each `when` input surface must define how the current value is read during runtime evaluation.
  - id: C-RULE-WHEN-0002-D
    text:
      zh-CN: 每个 `when` 输入 surface 必须定义依赖变化是否、何时以及如何触发 Rule 重评估。
      en: Each `when` input surface must define whether, when, and how dependency changes trigger Rule re-evaluation.
  - id: C-RULE-WHEN-0002-E
    text:
      zh-CN: host/environment 输入当前不得被视为稳定核心命名；`meta` 属于二级或待治理抽象。
      en: Host/environment inputs must not currently be treated as stable core naming; `meta` belongs to secondary or still-governed abstraction.
openQuestions:
  - id: C-RULE-WHEN-0002-Q-META
    question:
      zh-CN: host/environment 输入最终应继续称为 `meta`，还是引入更系统的环境配置抽象？
      en: Should host/environment inputs continue to be called `meta`, or should a more systematic environment/configuration abstraction be introduced?
    context:
      zh-CN: 当前 `module-rule-meta` 可用，但命名与抽象层级尚不稳定。
      en: Current `module-rule-meta` works, but its naming and abstraction level are not stable yet.
sources:
  - path: internal/contracts/rule/when.expr.v0.md
    sections:
      - Value Inputs
  - path: internal/contracts/_debt/rule.deferred-semantics.md
    sections:
