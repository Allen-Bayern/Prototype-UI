id: C-CONTEXT-0011
type: contract
title: Context rebinding and disconnection are resolved at read and update time
status: draft
since: 0.1.0
summary: Context scope changes may rebind participants to different providers; v0 exposes correctness through reads, updates, and callbacks rather than connection-change notifications.
statement:
  zh-CN: >-
    Context scope ancestry 变化可能让参与者重新绑定到不同的 provider，也可能让 context disconnected。v0 不提供显式 connected/disconnected notification API。required read/update 在 disconnected 时必须失败；optional tryRead/tryUpdate 必须以 `null` 或 `false` 表示 context 当前不可用。


  en: >-
    Changes in context scope ancestry may rebind participants to different providers or disconnect a context. v0 does not provide explicit connected/disconnected notification APIs. Required read/update must fail when disconnected; optional tryRead/tryUpdate must represent current unavailability with `null` or `false`.


criteria:
  - id: C-CONTEXT-0011-A
    text:
      zh-CN: scope ancestry 变化后，后续 read/update 必须按当前 resolution 执行。
      en: After scope ancestry changes, subsequent reads/updates must use current resolution.
  - id: C-CONTEXT-0011-B
    text:
      zh-CN: required read/update 在当前 provider disconnected 时必须失败。
      en: Required reads/updates must fail when the current provider is disconnected.
  - id: C-CONTEXT-0011-C
    text:
      zh-CN: optional tryRead 在 disconnected 时必须返回 `null`。
      en: Optional tryRead must return `null` when disconnected.
  - id: C-CONTEXT-0011-D
    text:
      zh-CN: optional tryUpdate 在 disconnected 时必须返回 `false` 并且不得更新任何 provider。
      en: Optional tryUpdate must return `false` when disconnected and must not update any provider.
  - id: C-CONTEXT-0011-E
    text:
      zh-CN: v0 不提供独立的 provider connected/disconnected callback。
      en: v0 does not provide separate provider connected/disconnected callbacks.
