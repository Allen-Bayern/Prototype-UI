id: C-ANATOMY-ORDER-0001
type: contract
title: Anatomy order is a host-ordered structural view
status: draft
since: 0.1.0
summary: '`run.anatomy.order` provides runtime-only host-ordered projections of same-domain parts without becoming collection semantics.'
statement:
  zh-CN: >-
    `run.anatomy.order` 是 Anatomy 的 runtime-only 有序结构视图。它回答当前 domain 中的 part 在宿主可观察顺序中如何排列；它不是新的 collection 语义，不负责业务元数据、selection、active item、roving focus 或键盘策略。


  en: >-
    `run.anatomy.order` is Anatomy's runtime-only ordered structural view. It answers how parts in the current domain appear in the host-observable order; it is not new collection semantics and is not responsible for business metadata, selection, active item, roving focus, or keyboard policy.


criteria:
  - id: C-ANATOMY-ORDER-0001-A
    text:
      zh-CN: '`run.anatomy.order` 只能在 runtime 期间读取。'
      en: '`run.anatomy.order` may only be read during runtime.'
  - id: C-ANATOMY-ORDER-0001-B
    text:
      zh-CN: Order view 必须以当前 domain 中实际存在的 part 为输入，不得创建或补全 part。
      en: The order view must take actually existing parts in the current domain as input and must not create or materialize parts.
  - id: C-ANATOMY-ORDER-0001-C
    text:
      zh-CN: Order view 可以使用宿主可提供的真实顺序；若宿主无法比较真实顺序，可以退回到宿主可提供的稳定顺序。
      en: The order view may use the real order provided by the host; if the host cannot compare real order, it may fall back to a stable order the host can provide.
  - id: C-ANATOMY-ORDER-0001-D
    text:
      zh-CN: Collection、selection、active item、roving focus 与键盘策略不得被归入 anatomy.order 的职责。
      en: Collection, selection, active item, roving focus, and keyboard policy must not be assigned to anatomy.order.
sources:
  - path: apps/www/src/content/docs/zh-cn/wiki/anatomy.md
    sections:
      - anatomy.order 是什么？
      - 它仍然不是 collection
  - path: internal/contracts/anatomy/query-policy.v0.impl-notes.md
dependsOn:
  contracts:
