openQuestions:
  - id: M-EXPOSE-0001-Q-HOST-PROJECTION-OWNER
    question:
      zh-CN: Adapter-facing complete exposes record 的 publication 应继续由 Expose State composition 拥有，还是由 core Expose 提供可经过 specialized projector 组合的 host-neutral sink？
      en: Should publication of the complete Adapter-facing exposes record remain owned by Expose State composition, or should core Expose provide a host-neutral sink composable with specialized projectors?
    context:
      zh-CN: 当前 `EXPOSE_STATE_SET_EXPOSES_CAP` 同时发布普通 value/method 与转换后的 state handle；core Expose 没有直接 host-cap。首轮保持事实并避免 raw State handle 泄漏，但该 ownership 命名与 layering 需要在 Expose State 编目时审查。
      en: Today `EXPOSE_STATE_SET_EXPOSES_CAP` publishes ordinary values and methods together with projected state handles, while core Expose has no direct host capability. This pass preserves that fact and avoids leaking raw State handles, but the ownership naming and layering require review during Expose State cataloging.
    blocks: [expose-host-projection-ownership]
  - id: M-EXPOSE-0001-Q-REQUIRED-MODULE-VALIDATION
    question:
      zh-CN: 未来可配置 module set 应由 schema、runtime graph 还是 Adapter conformance 在 setup 前拒绝缺失 Expose 及其 dependent Modules？
      en: Should a future configurable module set use schema validation, the runtime graph, or Adapter conformance to reject missing Expose and its dependent Modules before setup?
    context:
      zh-CN: 当前 Runtime 固定安装 ExposeModuleDef，三个 official Adapter 没有正常的缺失路径；required 属性仍需要未来通用 module selection 机制承接。
      en: The current Runtime installs ExposeModuleDef unconditionally and the three official Adapters have no normal missing path; a future generic module-selection mechanism still needs to enforce required status.
    blocks: [configurable-runtime-module-selection]
