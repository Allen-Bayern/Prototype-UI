id: HC-SCROLL-SURFACE-0001
type: host-cap
title: Host attaches and maintains a scroll surface session
status: draft
since: 0.2.0-rc.7
summary: The host resolves a logical scroll surface to its current target, attaches a bounded session, reports facts and support, applies requests, and projects system or composed chrome participation.
statement:
  zh-CN: >-
    Scroll Surface host capability 必须为 logical surface 解析当前宿主 target/controller，建立有界 session，报告 projection support 与 scroll facts，应用 scroll requests，并在 detach/dispose 时释放 observer、listener、gesture ownership 与其他宿主资源。它可以使用 Web overflow/observers、Flutter Scrollable/ScrollController 或其他平台机制，但不得向 prototype author 暴露这些对象。

  en: >-
    The Scroll Surface host capability must resolve the current host target or controller for a logical surface, attach a bounded session, report projection support and scroll facts, apply scroll requests, and release observers, listeners, gesture ownership, and other host resources on detach or disposal. It may use Web overflow and observers, Flutter Scrollable and ScrollController, or other platform mechanisms, but must not expose those objects to prototype authors.

criteria:
  - id: HC-SCROLL-SURFACE-0001-A
    text:
      zh-CN: Host-cap 必须报告 `system` 与 `composed` projection 支持，并返回最终 resolved projection 或明确拒绝原因。
      en: The host capability must report support for `system` and `composed` projection and return either the resolved projection or an explicit rejection reason.
  - id: HC-SCROLL-SURFACE-0001-B
    text:
      zh-CN: Host-cap 必须在 layout-ready 后报告初始 facts，并在 scroll activity 或 relevant geometry 改变时更新 facts。
      en: The host capability must report initial facts after layout readiness and update facts when scrolling activity or relevant geometry changes.
  - id: HC-SCROLL-SURFACE-0001-C
    text:
      zh-CN: Host-cap 必须应用经过验证的 scroll requests，并将 clamping、direction、physics 与 input integration 委托给宿主规则。
      en: The host capability must apply validated scroll requests while delegating clamping, direction, physics, and input integration to host rules.
  - id: HC-SCROLL-SURFACE-0001-D
    text:
      zh-CN: Session disposal 必须释放 observer、listener、pointer/gesture ownership 与 target references；迟到 callback 不得更新当前 logical facts。
      en: Session disposal must release observers, listeners, pointer or gesture ownership, and target references; late callbacks must not update current logical facts.
  - id: HC-SCROLL-SURFACE-0001-E
    text:
      zh-CN: Host-cap 必须把 scroll semantics 交给宿主 accessibility projection，并不得要求所有宿主支持相同原生结构。
      en: The host capability must hand scroll semantics to host accessibility projection without requiring every host to support the same native structure.
satisfies:
  contracts:
    - C-SCROLL-0001
relates:
  hostCaps:
    - HC-A11Y-0001
verifies:
  tests:
    - T-SCROLL-0001
