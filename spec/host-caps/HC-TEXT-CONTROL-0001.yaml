id: HC-TEXT-CONTROL-0001
type: host-cap
title: Host can lease one native multiline text control
status: draft
since: 0.2.0-rc.7
summary: The host can bind a portable Text Control connection to one adapter-owned native textarea and return an updateable, inspectable, disposable lease.
statement:
  zh-CN: >-
    Host 可以将 Text Control portable patch 投影到一个 adapter-owned 原生 textarea，标准化该 target 的 input/change/composition event，并返回可 update、snapshot 与 dispose 的 mount lease。


  en: >-
    The host can project a Text Control portable patch to one adapter-owned native textarea, normalize that target's input/change/composition events, and return a mount lease that can be updated, inspected, and disposed.


satisfies:
  contracts:
    - C-TEXT-CONTROL-0001
verifies:
  tests:
    - T-TEXT-CONTROL-0001
sources:
  - path: packages/modules/text-control/src/caps.ts
  - path: packages/modules/text-control/src/web.ts
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Cataloged the Text Control host lease for one native textarea.
tags:
  - text-control
  - textarea
  - host-capability
