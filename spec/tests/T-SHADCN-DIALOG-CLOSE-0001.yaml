    status: passing
    path: packages/web-conformance/test/shadcn-dialog.journey.test.ts
    required: true
    consumesCases: [T-SHADCN-DIALOG-CLOSE-0001-CASE-CURRENT-PROTOCOL]
    exercises: [P-SHADCN-DIALOG-CLOSE, P-BASE-DIALOG-CLOSE]
    notes:
      - The WC, React, and Vue matrix verifies that the non-surface Close host box cannot dismiss the Dialog while the nested Button still can.
