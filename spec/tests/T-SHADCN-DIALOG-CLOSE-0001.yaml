        P-SHADCN-DIALOG-CLOSE-COMPATIBILITY-SUBSET,
        P-SHADCN-DIALOG-CLOSE-AS-CHILD-OMISSION,
      ]
    expectation: shadcn-dialog-close-dismisses-only-through-its-current-trigger-group-surface
implementations:
  - id: prototypes-shadcn-dialog-close-contract
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/dialog.test.ts
    required: true
    consumesCases: [T-SHADCN-DIALOG-CLOSE-0001-CASE-CURRENT-PROTOCOL]
    exercises: [P-SHADCN-DIALOG-CLOSE, P-BASE-DIALOG-CLOSE]
