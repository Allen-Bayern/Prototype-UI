id: T-BASE-SWITCH-THUMB-0001
type: test
title: Base Switch Thumb indicator protocol contract tests
status: draft
since: 0.1.0
summary: Contract test coverage for the Base Switch Thumb prototype protocol, including thumb anatomy role membership, context-driven display state, and the absence of value, activation, focus, accessibility-control, form, and event semantics.
cases:
  - id: T-BASE-SWITCH-THUMB-0001-CASE-INDICATOR-ROLE
    title: Switch Thumb claims the same-domain thumb role and reflects Switch root checked state as an indicator
    covers:
      - P-BASE-SWITCH-THUMB-ROLE-INDICATOR
      - P-BASE-SWITCH-THUMB-PROTOCOL-DEPENDENCY
      - P-BASE-SWITCH-THUMB-CLAIM-ROLE
      - P-BASE-SWITCH-THUMB-SAME-DOMAIN
    expectation: switch-thumb-claims-thumb-role-and-reflects-root-state
  - id: T-BASE-SWITCH-THUMB-0001-CASE-CONTEXT-CONSUMPTION
    title: Switch Thumb consumes required Switch context and derives checked and disabled display state
    covers:
      - P-BASE-SWITCH-THUMB-CONTEXT-SUBSCRIBE
      - P-BASE-SWITCH-THUMB-CONTEXT-REQUIRED
      - P-BASE-SWITCH-THUMB-DERIVED-CHECKED
      - P-BASE-SWITCH-THUMB-DERIVED-DISABLED
    expectation: switch-thumb-derives-display-state-from-switch-context
  - id: T-BASE-SWITCH-THUMB-0001-CASE-NO-INTERACTION-SURFACES
    title: Switch Thumb does not own value, emit events, process activation, or receive focus
    covers:
      - P-BASE-SWITCH-THUMB-NO-VALUE-OWNER
      - P-BASE-SWITCH-THUMB-NO-EVENT-TARGET
      - P-BASE-SWITCH-THUMB-NO-FOCUS-TARGET
    expectation: switch-thumb-has-no-value-event-activation-or-focus-surface
  - id: T-BASE-SWITCH-THUMB-0001-CASE-AUTHORING-PRESENTATION-AND-DEFERRED-SURFACES
    title: Switch Thumb authoring entries stay presentational and keep form and visual surfaces outside core
    covers:
      - P-BASE-SWITCH-THUMB-AUTHORING-ENTRIES
      - P-BASE-SWITCH-THUMB-PRESENTATIONAL-A11Y
      - P-BASE-SWITCH-THUMB-NO-FORM-INTEGRATION
      - P-BASE-SWITCH-THUMB-NO-VISUAL-VARIANT-CORE
    expectation: switch-thumb-authoring-presentation-and-deferred-surfaces-remain-explicit
implementations:
  - id: prototypes-base-switch-thumb-current-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/switch.test.ts
    required: true
    consumesCases:
      - T-BASE-SWITCH-THUMB-0001-CASE-INDICATOR-ROLE
    exercises:
      - P-BASE-SWITCH-THUMB
    notes:
      - Covers current executable thumb behavior through the base-switch-thumb web component path.
      - Current implementation still reads root checked through anatomy part view and Expose.
  - id: prototypes-base-switch-thumb-context-contract
    kind: module-test
    status: planned
    path: packages/prototypes/base/test/switch.test.ts
    required: true
    consumesCases:
      - T-BASE-SWITCH-THUMB-0001-CASE-CONTEXT-CONSUMPTION
      - T-BASE-SWITCH-THUMB-0001-CASE-NO-INTERACTION-SURFACES
    exercises:
      - P-BASE-SWITCH-THUMB
    notes:
      - Planned for the implementation pass that changes Switch Thumb from anatomy/expose reads to required Switch context consumption.
verifies:
  prototypes:
    - id: P-BASE-SWITCH-THUMB
      anchors:
        - P-BASE-SWITCH-THUMB-ROLE-INDICATOR
        - P-BASE-SWITCH-THUMB-CONTEXT-SUBSCRIBE
        - P-BASE-SWITCH-THUMB-NO-EVENT-TARGET
        - P-BASE-SWITCH-THUMB-PRESENTATIONAL-A11Y
exercises:
  prototypes:
    - P-BASE-SWITCH-THUMB
revisions:
  - version: 0.1.0
    change: introduced
    summary: Introduced Base Switch Thumb indicator protocol test entity aligned to P-BASE-SWITCH-THUMB criteria.
tags:
  - prototype
  - base
  - switch
  - switch-thumb
  - test
