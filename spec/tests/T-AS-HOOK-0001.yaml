id: T-AS-HOOK-0001
type: test
title: asHook definition, setup, repeat, and trace tests
status: draft
since: 0.1.0
summary: Runtime contract tests for subjectless asHook attachment, setup-only invocation, prototype-compatible setup return, once-by-default repeat policy, and readonly trace metadata.
cases:
  - id: T-AS-HOOK-0001-CASE-SUBJECTLESS
    title: asHook attaches behavior to the caller prototype without creating an independent subject
    covers:
      - C-AS-HOOK-0001-A
      - C-AS-HOOK-0001-B
      - C-AS-HOOK-0001-C
      - C-AS-HOOK-0001-D
    expectation: subjectless-caller-attached-as-hook
  - id: T-AS-HOOK-0001-CASE-SETUP-ONLY
    title: asHook callers are setup-only and cannot be invoked from runtime callbacks
    covers:
      - C-AS-HOOK-0002-A
      - C-AS-HOOK-0002-B
      - C-AS-HOOK-0002-C
      - C-AS-HOOK-0002-D
    expectation: setup-only-as-hook-caller
  - id: T-AS-HOOK-0001-CASE-PROTOTYPE-COMPATIBLE
    title: defineAsHook accepts prototype-compatible specs and setup returns render function or void
    covers:
      - C-AS-HOOK-0003-A
      - C-AS-HOOK-0003-B
      - C-AS-HOOK-0003-C
      - C-AS-HOOK-0003-D
    expectation: prototype-compatible-as-hook-definition
  - id: T-AS-HOOK-0001-CASE-ONCE-DEFAULT
    title: same asHook identity applies once by default
    covers:
      - C-AS-HOOK-0004-A
      - C-AS-HOOK-0004-B
      - C-AS-HOOK-0004-C
      - C-AS-HOOK-0004-D
    expectation: once-by-default-repeat-policy
  - id: T-AS-HOOK-0001-CASE-TRACE
    title: applied asHooks leave readonly diagnostic trace metadata
    covers:
      - C-AS-HOOK-0008-A
      - C-AS-HOOK-0008-B
      - C-AS-HOOK-0008-C
      - C-AS-HOOK-0008-D
    expectation: readonly-as-hook-trace
implementations:
  - id: runtime-as-hook-core-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/as-hook.v0.contract.test.ts
    required: true
    consumesCases:
      - T-AS-HOOK-0001-CASE-SUBJECTLESS
      - T-AS-HOOK-0001-CASE-SETUP-ONLY
      - T-AS-HOOK-0001-CASE-PROTOTYPE-COMPATIBLE
      - T-AS-HOOK-0001-CASE-ONCE-DEFAULT
      - T-AS-HOOK-0001-CASE-TRACE
