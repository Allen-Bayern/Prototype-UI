id: T-BASE-DROPDOWN-MENU-CONTENT-0001
type: test
title: Base Dropdown Menu Content protocol tests
status: draft
since: 0.2.0-rc.0
summary: Covers menu semantics, Transition-bound Overlay presence, positioned Portal ownership, focus navigation, typeahead, and dismissal.
cases:
  - id: T-BASE-DROPDOWN-MENU-CONTENT-0001-CASE-A11Y-FOCUS
    title: Open Content projects menu semantics and retains scroll-preserving deferred item entry focus
    covers: [P-BASE-DROPDOWN-MENU-CONTENT-AUTHORING-ENTRIES, P-BASE-DROPDOWN-MENU-CONTENT-A11Y]
    expectation: dropdown-content-is-vertical-menu-with-scroll-preserving-policy-driven-focus-entry
  - id: T-BASE-DROPDOWN-MENU-CONTENT-0001-CASE-PRESENCE-POSITION
    title: Content retains leave view and portals a stable collision-aware anchored surface
    covers:
      [
        P-BASE-DROPDOWN-MENU-CONTENT-OVERLAY,
        P-BASE-DROPDOWN-MENU-CONTENT-PRESENCE,
        P-BASE-DROPDOWN-MENU-CONTENT-POSITION,
        P-BASE-DROPDOWN-MENU-CONTENT-ANCHOR-PORTAL,
      ]
    expectation: dropdown-content-animates-without-interpolating-position-from-inside-trigger-anchor
  - id: T-BASE-DROPDOWN-MENU-CONTENT-0001-CASE-KEYBOARD
    title: Content supports menu navigation, boundaries, runtime-delayed typeahead, and focusable disabled items
    covers: [P-BASE-DROPDOWN-MENU-CONTENT-KEYBOARD]
    expectation: menu-keyboard-navigation-includes-disabled-without-activation
  - id: T-BASE-DROPDOWN-MENU-CONTENT-0001-CASE-DISMISS
    title: Escape, Item action, Tab, and genuine outside press close while Trigger activation toggles once
    covers: [P-BASE-DROPDOWN-MENU-CONTENT-DISMISS]
    expectation: dropdown-dismiss-paths-request-owner-close-with-single-trigger-toggle-and-host-tab-navigation
implementations:
  - id: prototypes-base-dropdown-content-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/dropdown.test.ts
    required: true
    consumesCases:
      [
        T-BASE-DROPDOWN-MENU-CONTENT-0001-CASE-A11Y-FOCUS,
        T-BASE-DROPDOWN-MENU-CONTENT-0001-CASE-PRESENCE-POSITION,
        T-BASE-DROPDOWN-MENU-CONTENT-0001-CASE-KEYBOARD,
        T-BASE-DROPDOWN-MENU-CONTENT-0001-CASE-DISMISS,
      ]
    exercises: [P-BASE-DROPDOWN-MENU-CONTENT]
  - id: prototypes-shadcn-dropdown-content-composition
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/dropdown.test.ts
    required: true
    consumesCases:
      [
        T-BASE-DROPDOWN-MENU-CONTENT-0001-CASE-PRESENCE-POSITION,
        T-BASE-DROPDOWN-MENU-CONTENT-0001-CASE-KEYBOARD,
      ]
    exercises: [P-BASE-DROPDOWN-MENU-CONTENT]
verifies:
  prototypes:
    - id: P-BASE-DROPDOWN-MENU-CONTENT
      anchors:
        [
          P-BASE-DROPDOWN-MENU-CONTENT-A11Y,
          P-BASE-DROPDOWN-MENU-CONTENT-OVERLAY,
          P-BASE-DROPDOWN-MENU-CONTENT-PRESENCE,
          P-BASE-DROPDOWN-MENU-CONTENT-POSITION,
          P-BASE-DROPDOWN-MENU-CONTENT-ANCHOR-PORTAL,
          P-BASE-DROPDOWN-MENU-CONTENT-KEYBOARD,
          P-BASE-DROPDOWN-MENU-CONTENT-DISMISS,
        ]
exercises: { prototypes: [P-BASE-DROPDOWN-MENU-CONTENT] }
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Added Content a11y, focus, Transition, positioning, Portal, keyboard, and dismissal coverage.
  - version: 0.2.0-rc.0
    change: refined
    summary: Added runtime delay-policy coverage for typeahead buffer expiry.
  - version: 0.2.0-rc.0
    change: refined
    summary: Added structure-first entry focus coverage across retained adapter view epochs.
  - version: 0.2.0-rc.0
    change: refined
    summary: Mapped deferred Focus-owned entry readiness and completed Overlay and positioning anchor coverage.
  - version: 0.2.0-rc.0
    change: refined
    summary: Added coverage for preserving focus established synchronously by a composed Item action.
  - version: 0.2.0-rc.0
    change: refined
    summary: Added mounted-checkpoint replay coverage for entry intent established while the Content view was detached.
  - version: 0.2.0-rc.0
    change: refined
    summary: Added entry-focus host scroll preservation coverage before portal positioning settles.
  - version: 0.2.0-rc.0
    change: refined
    summary: Added stable animation geometry and Trigger-anchor inside-boundary regression coverage.
tags: [prototype, base, dropdown-menu, content, overlay, transition, positioning, test]
