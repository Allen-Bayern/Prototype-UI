id: T-BASE-SWITCH-0001
type: test
title: Base Switch root protocol contract tests
status: draft
since: 0.1.0
summary: Contract test coverage for the Base Switch root prototype protocol, including root-owned on/off value behavior, Switch anatomy family ownership, context obligations, activation, accessibility, and deferred extension surfaces.
cases:
  - id: T-BASE-SWITCH-0001-CASE-ANATOMY-FAMILY
    title: Switch root owns the base-switch anatomy family and defines thumb as an optional repeatable indicator
    covers:
      - P-BASE-SWITCH-ANATOMY-FAMILY
      - P-BASE-SWITCH-FAMILY-ROLES
      - P-BASE-SWITCH-ROOT-DOMAIN-ANCHOR
      - P-BASE-SWITCH-ROOT-CARDINALITY
      - P-BASE-SWITCH-THUMB-INDICATOR
      - P-BASE-SWITCH-THUMB-CARDINALITY
      - P-BASE-SWITCH-ROOT-CONTAINS-THUMB
      - P-BASE-SWITCH-THUMB-NOT-TARGET
      - P-BASE-SWITCH-TRACK-DEFERRED
    expectation: switch-root-owns-base-switch-anatomy-family
  - id: T-BASE-SWITCH-0001-CASE-AUTHORING-ENTRIES
    title: base-switch-root and asSwitchRoot remain authoring entries of one independent Switch protocol
    covers:
      - P-BASE-SWITCH-AUTHORING-ENTRIES
      - P-BASE-SWITCH-PROTOCOL-INDEPENDENCE
      - P-BASE-SWITCH-ROOT-SEMANTIC-OWNER
    expectation: base-switch-root-and-as-switch-root-share-protocol-surface
  - id: T-BASE-SWITCH-0001-CASE-UNCONTROLLED-CHECKED-CHANGE
    title: uncontrolled Switch initializes checked state, flips on activation, and emits checkedChange
    covers:
      - P-BASE-SWITCH-ROLE-ON-OFF-VALUE
      - P-BASE-SWITCH-DISPLAY-AND-INPUT
      - P-BASE-SWITCH-PROP-DEFAULT-CHECKED
      - P-BASE-SWITCH-CHECKED-EXPOSE
      - P-BASE-SWITCH-NO-MIXED-STATE
      - P-BASE-SWITCH-TRIGGER-SEMANTICS
      - P-BASE-SWITCH-ACTIVATION-FLIPS-CHECKED
      - P-BASE-SWITCH-UNCONTROLLED-UPDATES-CHECKED
      - P-BASE-SWITCH-CHECKED-CHANGE-SIGNAL
      - P-BASE-SWITCH-CHECKED-CHANGE-PROTOCOL-NAME
      - P-BASE-SWITCH-CLICK-DEFERRED
    expectation: uncontrolled-switch-flips-checked-and-emits-checked-change
  - id: T-BASE-SWITCH-0001-CASE-CONTROLLED-CHECKED
    title: controlled Switch mirrors checked props and emits next checked without claiming final state ownership
    covers:
      - P-BASE-SWITCH-PROP-CHECKED
      - P-BASE-SWITCH-CONTROLLED-CHECKED
      - P-BASE-SWITCH-CONTROLLED-EMITS-NEXT
      - P-BASE-SWITCH-PROP-NO-EVENT-CALLBACK
    expectation: controlled-switch-emits-next-checked-without-mutating-source-of-truth
  - id: T-BASE-SWITCH-0001-CASE-DISABLED-GATING
    title: disabled Switch exposes disabled state and suppresses activation-driven checked changes
    covers:
      - P-BASE-SWITCH-PROP-DISABLED
      - P-BASE-SWITCH-DISABLED-EXPOSE
      - P-BASE-SWITCH-DISABLED-SUPPRESS-ACTIVATION
      - P-BASE-SWITCH-DISABLED-CLEAR-TRANSIENT
    expectation: disabled-switch-suppresses-checked-change-and-clears-transient-state
  - id: T-BASE-SWITCH-0001-CASE-INTERACTION-FOCUS-KEYBOARD
    title: Switch root exposes pointer, focus, press, and keyboard activation behavior
    covers:
      - P-BASE-SWITCH-POINTER-HOVER
      - P-BASE-SWITCH-FOCUSABLE
      - P-BASE-SWITCH-REQUEST-FOCUS
      - P-BASE-SWITCH-DISABLED-REJECT-FOCUS
      - P-BASE-SWITCH-PRESS-LIFECYCLE
      - P-BASE-SWITCH-KEYBOARD-SPACE-ACTIVATION
      - P-BASE-SWITCH-KEYBOARD-ENTER-OPTIONAL
      - P-BASE-SWITCH-KEYBOARD-SPACE-PREVENT-DEFAULT
    expectation: switch-root-exposes-interaction-focus-and-keyboard-behavior
  - id: T-BASE-SWITCH-0001-CASE-CONTEXT
    title: Switch root provides and synchronizes Switch context for same-domain indicator parts
    covers:
      - P-BASE-SWITCH-CONTEXT-KEY
      - P-BASE-SWITCH-CONTEXT-PROVIDE
      - P-BASE-SWITCH-CONTEXT-VALUE
      - P-BASE-SWITCH-CONTEXT-SYNC
      - P-BASE-SWITCH-PART-CONTEXT-CONSUME
    expectation: switch-root-provides-json-object-context-for-parts
  - id: T-BASE-SWITCH-0001-CASE-A11Y-AND-DEFERRED-SURFACES
    title: Switch accessibility and deferred form, label, and visual surfaces remain catalog-visible
    covers:
      - P-BASE-SWITCH-ACCESSIBLE-ROLE
      - P-BASE-SWITCH-ACCESSIBLE-NAME
      - P-BASE-SWITCH-STABLE-LABEL
      - P-BASE-SWITCH-A11Y-CHECKED
      - P-BASE-SWITCH-A11Y-NO-MIXED
      - P-BASE-SWITCH-INDICATOR-PRESENTATIONAL-A11Y
      - P-BASE-SWITCH-PROP-LABEL-DEFERRED
      - P-BASE-SWITCH-FORM-INTEGRATION-DEFERRED
      - P-BASE-SWITCH-NO-VISUAL-VARIANT-CORE
    expectation: switch-a11y-and-deferred-surfaces-remain-explicit
implementations:
  - id: prototypes-base-switch-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/switch.test.ts
    required: true
    consumesCases:
      - T-BASE-SWITCH-0001-CASE-ANATOMY-FAMILY
      - T-BASE-SWITCH-0001-CASE-AUTHORING-ENTRIES
      - T-BASE-SWITCH-0001-CASE-UNCONTROLLED-CHECKED-CHANGE
      - T-BASE-SWITCH-0001-CASE-CONTROLLED-CHECKED
      - T-BASE-SWITCH-0001-CASE-DISABLED-GATING
      - T-BASE-SWITCH-0001-CASE-INTERACTION-FOCUS-KEYBOARD
      - T-BASE-SWITCH-0001-CASE-CONTEXT
      - T-BASE-SWITCH-0001-CASE-A11Y-AND-DEFERRED-SURFACES
    exercises:
      - P-BASE-SWITCH
    notes:
      - Covers current executable Switch root behavior through the base-switch-root web component path and focused runtime-host asHook checks.
      - Deferred label, form, track, and visual surfaces are covered as absence/declaration checks rather than positive integration behavior.
verifies:
  prototypes:
    - id: P-BASE-SWITCH
      anchors:
        - P-BASE-SWITCH-ROLE-ON-OFF-VALUE
        - P-BASE-SWITCH-DISPLAY-AND-INPUT
        - P-BASE-SWITCH-AUTHORING-ENTRIES
        - P-BASE-SWITCH-ROOT-SEMANTIC-OWNER
        - P-BASE-SWITCH-CHECKED-CHANGE-SIGNAL
        - P-BASE-SWITCH-CONTEXT-VALUE
exercises:
  prototypes:
    - P-BASE-SWITCH
revisions:
  - version: 0.1.0
    change: introduced
    summary: Introduced Base Switch root protocol test entity aligned to P-BASE-SWITCH criteria.
tags:
  - prototype
  - base
  - switch
  - test
