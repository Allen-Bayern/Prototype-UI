id: T-ANATOMY-ORDER-0001
type: test
title: Anatomy order view tests
status: draft
since: 0.1.0
summary: Module and runtime tests for host-ordered part projections, self adjacency, order version, and privileged missing query policy.
cases:
  - id: T-ANATOMY-ORDER-0001-CASE-HOST-ORDER
    title: Anatomy order reflects the host-observable order of same-domain parts
    covers:
      - C-ANATOMY-ORDER-0001-A
      - C-ANATOMY-ORDER-0001-B
      - C-ANATOMY-ORDER-0001-C
      - C-ANATOMY-ORDER-0001-D
    expectation: host-ordered-structural-view
  - id: T-ANATOMY-ORDER-0001-CASE-SELF-ADJACENCY
    title: Anatomy order exposes same-role self index and adjacent parts
    covers:
      - C-ANATOMY-ORDER-0002-A
      - C-ANATOMY-ORDER-0002-B
    expectation: self-index-prev-next
  - id: T-ANATOMY-ORDER-0001-CASE-VERSION
    title: Anatomy order version changes only when the order signature changes
    covers:
      - C-ANATOMY-ORDER-0002-C
      - C-ANATOMY-ORDER-0002-D
    expectation: order-signature-version
  - id: T-ANATOMY-ORDER-0001-CASE-MISSING-POLICY
    title: Missing query policy is exercised through privileged/internal query surfaces
    covers:
      - C-ANATOMY-0005-D
      - C-ANATOMY-ORDER-0001-B
    expectation: privileged-missing-domain-policy
implementations:
  - id: module-anatomy-impl-spec
    kind: module-test
    status: passing
    path: packages/modules/anatomy/test/impl-spec.test.ts
    required: true
    consumesCases:
      - T-ANATOMY-ORDER-0001-CASE-HOST-ORDER
      - T-ANATOMY-ORDER-0001-CASE-SELF-ADJACENCY
      - T-ANATOMY-ORDER-0001-CASE-MISSING-POLICY
  - id: module-anatomy-order-contract
    kind: module-test
    status: passing
    path: packages/modules/anatomy/test/contract/anatomy-order.v0.contract.test.ts
    required: true
    consumesCases:
      - T-ANATOMY-ORDER-0001-CASE-VERSION
      - T-ANATOMY-ORDER-0001-CASE-MISSING-POLICY
  - id: runtime-anatomy-order-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/anatomy.order.v0.contract.test.ts
    required: true
    consumesCases:
      - T-ANATOMY-ORDER-0001-CASE-HOST-ORDER
      - T-ANATOMY-ORDER-0001-CASE-SELF-ADJACENCY
      - T-ANATOMY-ORDER-0001-CASE-VERSION
      - T-ANATOMY-ORDER-0001-CASE-MISSING-POLICY
verifies:
  contracts:
    - id: C-ANATOMY-ORDER-0001
      anchors:
        - C-ANATOMY-ORDER-0001-A
        - C-ANATOMY-ORDER-0001-B
        - C-ANATOMY-ORDER-0001-C
        - C-ANATOMY-ORDER-0001-D
    - id: C-ANATOMY-ORDER-0002
      anchors:
        - C-ANATOMY-ORDER-0002-A
        - C-ANATOMY-ORDER-0002-B
        - C-ANATOMY-ORDER-0002-C
        - C-ANATOMY-ORDER-0002-D
exercises:
  contracts:
    - id: C-ANATOMY-0005
      anchors:
        - C-ANATOMY-0005-D
      role: test-surface
      coverageImpact: exercises-test-surface
      note: Exercises strict missing-domain behavior together with the privileged query-policy fallback used by order projections.
revisions:
  - version: 0.1.0
    change: introduced
    summary: Added anatomy.order host-order, self-adjacency, version, and missing-policy test mapping.
tags:
  - anatomy
  - order
  - contract-test
