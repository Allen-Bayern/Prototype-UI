id: T-AS-HOOK-0002
type: test
title: asHook result, captured effects, and state projection tests
status: draft
since: 0.1.0
summary: Runtime tests for caller-owned captured effects, setup-only disposers, artifacts, render fragments, expose captures, rule captures, and borrowed state projection.
cases:
  - id: T-AS-HOOK-0002-CASE-CALLER-EFFECTS
    title: asHook setup effects attach to the caller prototype and follow module-owned semantics
    covers:
      - C-AS-HOOK-0005-A
      - C-AS-HOOK-0005-B
      - C-AS-HOOK-0005-C
      - C-AS-HOOK-0005-D
    expectation: caller-owned-captured-effects
  - id: T-AS-HOOK-0002-CASE-RESULT-ARTIFACTS
    title: AsHookResult exposes handles, artifacts, methods, event keys, and render fragments
    covers:
      - C-AS-HOOK-0006-A
      - C-AS-HOOK-0006-E
    expectation: as-hook-result-artifacts
  - id: T-AS-HOOK-0002-CASE-SETUP-DISPOSERS
    title: Captured setup-effect disposers are exposed but remain setup-only
    covers:
      - C-AS-HOOK-0006-B
      - C-AS-HOOK-0006-C
      - C-AS-HOOK-0006-D
    expectation: setup-only-captured-disposers
  - id: T-AS-HOOK-0002-CASE-BORROWED-STATE
    title: State handles exposed by asHook are borrowed views and can drive rule evaluation
    covers:
      - C-AS-HOOK-0007-A
      - C-AS-HOOK-0007-B
      - C-AS-HOOK-0007-C
      - C-AS-HOOK-0007-D
    expectation: borrowed-state-projection
implementations:
  - id: runtime-as-hook-result-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/as-hook.v0.contract.test.ts
    required: true
    consumesCases:
      - T-AS-HOOK-0002-CASE-CALLER-EFFECTS
      - T-AS-HOOK-0002-CASE-RESULT-ARTIFACTS
      - T-AS-HOOK-0002-CASE-SETUP-DISPOSERS
      - T-AS-HOOK-0002-CASE-BORROWED-STATE
