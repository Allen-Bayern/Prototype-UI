id: T-AS-TRIGGER-0001
type: test
title: asTrigger nested event route contract tests
status: draft
since: 0.1.0
summary: Runtime contract tests for asTrigger ownership marking, continuous nested trigger route merging, and non-trigger parent stop behavior.
cases:
  - id: T-AS-TRIGGER-0001-CASE-CONFIRM-OWNER
    title: asTrigger marks the current host target as trigger confirmation owner
    covers:
      - C-AS-TRIGGER-0001-A
      - C-AS-TRIGGER-0001-B
      - C-AS-TRIGGER-0001-C
    expectation: trigger-confirm-owner-mark
  - id: T-AS-TRIGGER-0001-CASE-PARENT-REDIRECT
    title: A trigger directly nested inside a trigger redirects the event root to the parent trigger
    covers:
      - C-AS-TRIGGER-0001-D
    expectation: direct-parent-trigger-route-merge
  - id: T-AS-TRIGGER-0001-CASE-OUTERMOST-REDIRECT
    title: A continuous multi-level trigger chain redirects the event root to the outermost trigger
    covers:
      - C-AS-TRIGGER-0001-D
    expectation: outermost-continuous-trigger-route-merge
  - id: T-AS-TRIGGER-0001-CASE-NON-TRIGGER-STOP
    title: A non-trigger parent stops route merging and the current trigger keeps its own route owner
    covers:
      - C-AS-TRIGGER-0001-E
      - C-AS-TRIGGER-0001-F
    expectation: non-trigger-parent-stops-route-merge
  - id: T-AS-TRIGGER-0001-CASE-LOGICAL-TARGET-SEPARATION
    title: Logical trigger identities remain distinct from physical event targets
    covers:
      - C-AS-TRIGGER-0001-C
      - C-AS-TRIGGER-0001-G
    expectation: logical-owner-resolves-through-host-event-target-projection
  - id: T-AS-TRIGGER-0001-CASE-REPEATABLE-VIEW-TARGET
    title: Nested trigger event registrations follow late and replacement owner views
    covers:
      - C-AS-TRIGGER-0001-H
    expectation: nested-trigger-route-follows-current-owner-view-target
  - id: T-AS-TRIGGER-0001-CASE-ADAPTER-NESTING
    title: Framework adapters render and activate directly nested triggers through one outer route
    covers:
      - C-AS-TRIGGER-0001-D
      - C-AS-TRIGGER-0001-G
      - C-AS-TRIGGER-0001-H
    expectation: nested-adapter-triggers-mount-and-activate-once-without-event-target-errors
implementations:
  - id: runtime-as-trigger-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/as-trigger.v0.contract.test.ts
    required: true
    consumesCases:
      - T-AS-TRIGGER-0001-CASE-CONFIRM-OWNER
      - T-AS-TRIGGER-0001-CASE-PARENT-REDIRECT
      - T-AS-TRIGGER-0001-CASE-OUTERMOST-REDIRECT
      - T-AS-TRIGGER-0001-CASE-NON-TRIGGER-STOP
      - T-AS-TRIGGER-0001-CASE-LOGICAL-TARGET-SEPARATION
  - id: adapter-base-as-trigger-route-projection
    kind: adapter-test
    status: passing
    path: packages/adapters/base/test/instance-tree.test.ts
    required: true
    consumesCases:
      - T-AS-TRIGGER-0001-CASE-LOGICAL-TARGET-SEPARATION
      - T-AS-TRIGGER-0001-CASE-REPEATABLE-VIEW-TARGET
  - id: adapter-react-nested-trigger-integration
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/nested-trigger.integration.test.ts
    required: true
    consumesCases: [T-AS-TRIGGER-0001-CASE-ADAPTER-NESTING]
  - id: adapter-vue-nested-trigger-integration
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/nested-trigger.integration.test.ts
    required: true
    consumesCases: [T-AS-TRIGGER-0001-CASE-ADAPTER-NESTING]
  - id: adapter-web-component-nested-trigger-integration
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/dialog-overlay.test.ts
    required: true
    consumesCases: [T-AS-TRIGGER-0001-CASE-ADAPTER-NESTING]
verifies:
  contracts:
    - id: C-AS-TRIGGER-0001
      anchors:
        - C-AS-TRIGGER-0001-A
        - C-AS-TRIGGER-0001-B
        - C-AS-TRIGGER-0001-C
        - C-AS-TRIGGER-0001-D
        - C-AS-TRIGGER-0001-E
        - C-AS-TRIGGER-0001-F
        - C-AS-TRIGGER-0001-G
        - C-AS-TRIGGER-0001-H
revisions:
  - version: 0.1.0
    change: introduced
    summary: Mapped existing runtime asTrigger contract tests to the asTrigger core contract.
  - version: 0.2.0-rc.2
    change: implemented
    summary: Added logical-target separation, repeatable view projection, and real React, Vue, and Web Component nested-trigger coverage.
tags:
  - as-trigger
  - as-hook
  - privileged
  - event
  - contract-test
