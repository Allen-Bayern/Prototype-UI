id: T-AS-TRIGGER-0001
type: test
title: asTrigger group merge and interaction-surface contract tests
status: draft
since: 0.1.0
summary: Covers trigger-group membership, outer anchor and inner surface roles, shared semantic activation, host-local events, repeatable view projection, and rejection of non-surface pointer hits.
cases:
  - id: T-AS-TRIGGER-0001-CASE-MEMBERSHIP
    title: asTrigger marks the current logical instance as a trigger-group member
    covers: [C-AS-TRIGGER-0001-A, C-AS-TRIGGER-0001-B]
    expectation: trigger-group-member-mark
  - id: T-AS-TRIGGER-0001-CASE-PARENT-MERGE
    title: Directly nested triggers merge into one group with distinct behavior participants
    covers: [C-AS-TRIGGER-0001-C, C-AS-TRIGGER-0001-D, C-AS-TRIGGER-0001-F]
    expectation: direct-parent-trigger-group-merge
  - id: T-AS-TRIGGER-0001-CASE-MULTILEVEL-MERGE
    title: A continuous multi-level trigger chain uses the outermost anchor and innermost surface
    covers: [C-AS-TRIGGER-0001-C, C-AS-TRIGGER-0001-D]
    expectation: continuous-trigger-group-anchor-and-surface
  - id: T-AS-TRIGGER-0001-CASE-NON-TRIGGER-STOP
    title: A non-trigger parent stops merging and the current trigger forms its own group
    covers: [C-AS-TRIGGER-0001-E, C-AS-TRIGGER-0001-K]
    expectation: non-trigger-parent-stops-trigger-group-merge
  - id: T-AS-TRIGGER-0001-CASE-LOGICAL-TARGET-SEPARATION
    title: Logical instance and group identities remain distinct from physical semantic targets
    covers: [C-AS-TRIGGER-0001-C, C-AS-TRIGGER-0001-G]
    expectation: opaque-trigger-group-resolves-through-host-semantic-target-projection
  - id: T-AS-TRIGGER-0001-CASE-REPEATABLE-SURFACE
    title: Group registrations follow late and replacement surface views
    covers: [C-AS-TRIGGER-0001-H]
    expectation: trigger-group-registrations-follow-current-surface-view
  - id: T-AS-TRIGGER-0001-CASE-DOMAIN-ROLES
    title: Anchor, members, and surface are independently consumable host roles
    covers: [C-AS-TRIGGER-0001-I]
    expectation: domain-neutral-trigger-group-role-projection
  - id: T-AS-TRIGGER-0001-CASE-SURFACE-HIT
    title: Pointer input on a non-surface member host box does not activate the group
    covers: [C-AS-TRIGGER-0001-F, C-AS-TRIGGER-0001-J]
    expectation: trigger-group-accepts-only-current-surface-hit-origin
  - id: T-AS-TRIGGER-0001-CASE-ADAPTER-GROUP
    title: Web adapters merge nested trigger behavior on one inner surface without expanding its hit range
    covers:
      - C-AS-TRIGGER-0001-C
      - C-AS-TRIGGER-0001-D
      - C-AS-TRIGGER-0001-F
      - C-AS-TRIGGER-0001-G
      - C-AS-TRIGGER-0001-H
      - C-AS-TRIGGER-0001-I
      - C-AS-TRIGGER-0001-J
    expectation: nested-adapter-trigger-group-activates-once-only-from-inner-surface
implementations:
  - id: runtime-as-trigger-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/as-trigger.v0.contract.test.ts
    required: true
    consumesCases:
      - T-AS-TRIGGER-0001-CASE-MEMBERSHIP
      - T-AS-TRIGGER-0001-CASE-PARENT-MERGE
      - T-AS-TRIGGER-0001-CASE-MULTILEVEL-MERGE
      - T-AS-TRIGGER-0001-CASE-NON-TRIGGER-STOP
      - T-AS-TRIGGER-0001-CASE-LOGICAL-TARGET-SEPARATION
  - id: adapter-base-trigger-group-projection
    kind: adapter-test
    status: passing
    path: packages/adapters/base/test/instance-tree.test.ts
    required: true
    consumesCases:
      - T-AS-TRIGGER-0001-CASE-LOGICAL-TARGET-SEPARATION
      - T-AS-TRIGGER-0001-CASE-REPEATABLE-SURFACE
      - T-AS-TRIGGER-0001-CASE-DOMAIN-ROLES
      - T-AS-TRIGGER-0001-CASE-SURFACE-HIT
  - id: adapter-web-event-surface-admission
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/contract/event.router.mapping.v0.contract.test.ts
    required: true
    consumesCases: [T-AS-TRIGGER-0001-CASE-SURFACE-HIT]
  - id: adapter-react-trigger-group-integration
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/nested-trigger.integration.test.ts
    required: true
    consumesCases: [T-AS-TRIGGER-0001-CASE-ADAPTER-GROUP]
  - id: adapter-vue-trigger-group-integration
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/nested-trigger.integration.test.ts
    required: true
    consumesCases: [T-AS-TRIGGER-0001-CASE-ADAPTER-GROUP]
  - id: adapter-web-component-trigger-group-integration
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/dialog-overlay.test.ts
    required: true
    consumesCases: [T-AS-TRIGGER-0001-CASE-ADAPTER-GROUP]
  - id: web-conformance-shadcn-dialog-close-hit-surface
    kind: adapter-test
    status: passing
    path: packages/web-conformance/test/shadcn-dialog.journey.test.ts
    required: true
    consumesCases: [T-AS-TRIGGER-0001-CASE-ADAPTER-GROUP, T-AS-TRIGGER-0001-CASE-SURFACE-HIT]
verifies:
  contracts:
    - id: C-AS-TRIGGER-0001
      anchors:
        - C-AS-TRIGGER-0001-A
        - C-AS-TRIGGER-0001-B
        - C-AS-TRIGGER-0001-C
        - C-AS-TRIGGER-0001-D
        - C-AS-TRIGGER-0001-E
