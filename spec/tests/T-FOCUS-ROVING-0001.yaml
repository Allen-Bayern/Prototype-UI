id: T-FOCUS-ROVING-0001
type: test
title: Focus roving runtime contract tests
status: draft
since: 0.1.0
summary: Runtime contract tests for asFocusRoving singleton behavior, scope getRoving integration, logical-parent roving membership without groupKey, and the boundary between roving movement and sequential Tab navigation.
cases:
  - id: T-FOCUS-ROVING-0001-CASE-ROVING-ONCE
    title: Repeated asFocusRoving calls reuse one handle and configure through the returned handle
    covers:
      - C-AS-FOCUS-ROVING-0001-A
      - C-AS-FOCUS-ROVING-0001-B
    expectation: focus-roving-singleton-config
  - id: T-FOCUS-ROVING-0001-CASE-SCOPE-GET-ROVING
    title: asFocusScope exposes and declares its internal roving handle
    covers:
      - C-AS-FOCUS-SCOPE-0001-E
      - C-AS-FOCUS-ROVING-0001-B
    expectation: focus-scope-internal-roving-handle
  - id: T-FOCUS-ROVING-0001-CASE-LOGICAL-MEMBERSHIP
    title: A logical roving owner owns child focusables without groupKey
    covers:
      - C-FOCUS-0002-A
      - C-FOCUS-0002-B
      - C-AS-FOCUS-ROVING-0001-C
    expectation: logical-parent-roving-membership
  - id: T-FOCUS-ROVING-0001-CASE-TAB-SEQUENTIAL
    title: Tab leaves the roving set instead of acting like next/previous roving movement
    covers:
      - C-AS-FOCUS-ROVING-0001-F
      - C-AS-FOCUS-ROVING-0001-G
    expectation: tab-is-sequential-navigation-not-roving-movement
  - id: T-FOCUS-ROVING-0001-CASE-DEFAULT-ACTION-CONTROL
    title: Roving arrow-key movement requests default-action cancellation through event host capability
    covers:
      - C-AS-FOCUS-ROVING-0001-F
      - D-DEFAULT-ACTION-CONTROL-0001-C
      - D-DEFAULT-ACTION-CONTROL-0001-D
      - HC-DEFAULT-ACTION-0001-A
    expectation: roving-keyboard-default-action-cancel-request
  - id: T-FOCUS-ROVING-0001-CASE-NAV-PARTICIPATION
    title: Roving movement can target enabled members that are excluded from natural Tab participation
    covers:
      - C-AS-FOCUS-ROVING-0001-G
      - D-FOCUS-ROVING-NAVIGATION-OWNERSHIP-0001-D
    expectation: roving-candidates-are-independent-from-natural-tab-participation
  - id: T-FOCUS-ROVING-0001-CASE-RUNTIME-STRATEGY
    title: Roving runtime strategy updates can change orientation after setup
    covers:
      - C-AS-FOCUS-ROVING-0001-H
    expectation: roving-runtime-strategy-updates-change-key-interpretation
  - id: T-FOCUS-ROVING-0001-CASE-MEMBER-STATUS
    title: focusSelected and unfocused movement consume semantic member status
    covers:
      - C-AS-FOCUS-ROVING-0001-I
    expectation: roving-selected-and-active-status-drive-semantic-focus-requests
  - id: T-FOCUS-ROVING-0001-CASE-MULTI-INSTANCE-ISOLATION
    title: Shared global arrow events only move the roving instance that contains actual focus
    covers:
      - C-AS-FOCUS-ROVING-0001-J
    expectation: unfocused-roving-instances-ignore-shared-global-key-events
implementations:
  - id: runtime-focus-roving-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/focus-roving.v0.contract.test.ts
    required: true
    consumesCases:
      - T-FOCUS-ROVING-0001-CASE-ROVING-ONCE
      - T-FOCUS-ROVING-0001-CASE-SCOPE-GET-ROVING
      - T-FOCUS-ROVING-0001-CASE-LOGICAL-MEMBERSHIP
      - T-FOCUS-ROVING-0001-CASE-DEFAULT-ACTION-CONTROL
      - T-FOCUS-ROVING-0001-CASE-NAV-PARTICIPATION
      - T-FOCUS-ROVING-0001-CASE-RUNTIME-STRATEGY
      - T-FOCUS-ROVING-0001-CASE-MEMBER-STATUS
      - T-FOCUS-ROVING-0001-CASE-MULTI-INSTANCE-ISOLATION
  - id: prototypes-base-tabs-roving-tab-boundary
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/tabs.test.ts
    required: true
    consumesCases:
      - T-FOCUS-ROVING-0001-CASE-TAB-SEQUENTIAL
verifies:
  contracts:
    - id: C-FOCUS-0002
      anchors:
        - C-FOCUS-0002-A
        - C-FOCUS-0002-B
    - id: C-AS-FOCUS-SCOPE-0001
      anchors:
        - C-AS-FOCUS-SCOPE-0001-E
    - id: C-AS-FOCUS-ROVING-0001
      anchors:
        - C-AS-FOCUS-ROVING-0001-A
        - C-AS-FOCUS-ROVING-0001-B
        - C-AS-FOCUS-ROVING-0001-C
        - C-AS-FOCUS-ROVING-0001-F
        - C-AS-FOCUS-ROVING-0001-G
        - C-AS-FOCUS-ROVING-0001-H
        - C-AS-FOCUS-ROVING-0001-I
        - C-AS-FOCUS-ROVING-0001-J
  decisions:
    - id: D-FOCUS-ROVING-NAVIGATION-OWNERSHIP-0001
      anchors:
        - D-FOCUS-ROVING-NAVIGATION-OWNERSHIP-0001-D
    - id: D-DEFAULT-ACTION-CONTROL-0001
      anchors:
        - D-DEFAULT-ACTION-CONTROL-0001-C
        - D-DEFAULT-ACTION-CONTROL-0001-D
  hostCaps:
    - id: HC-DEFAULT-ACTION-0001
      anchors:
        - HC-DEFAULT-ACTION-0001-A
revisions:
  - version: 0.1.0
    change: introduced
    summary: Mapped focus-roving runtime tests to logical-topology and asFocusRoving contracts.
  - version: 0.1.1
    change: refined
    summary: Added coverage for Tab as sequential navigation rather than roving movement.
  - version: 0.1.2
    change: refined
    summary: Added coverage for roving keyboard movement requesting default-action cancellation.
  - version: 0.1.3
    change: refined
    summary: Added coverage that navParticipation does not remove enabled focusables from roving candidates.
  - version: 0.1.4
    change: refined
    summary: Added coverage for runtime roving strategy updates after setup.
  - version: 0.1.5
    change: refined
    summary: Added semantic selected and active member status coverage.
  - version: 0.1.6
    change: refined
    summary: Added multi-instance isolation coverage for shared global roving key events.
tags:
  - focus
  - focus-roving
  - logical-tree
