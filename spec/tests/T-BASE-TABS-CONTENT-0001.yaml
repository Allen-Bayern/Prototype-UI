      anchors:
        - P-BASE-TABS-CONTENT-CURRENT-DERIVED
        - P-BASE-TABS-CONTENT-HIDDEN-WHEN-INACTIVE
        - P-BASE-TABS-CONTENT-A11Y-LABELLEDBY-TARGET
        - P-BASE-TABS-CONTENT-FOCUS-ENTRY
