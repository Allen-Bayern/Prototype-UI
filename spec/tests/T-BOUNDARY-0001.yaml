id: T-BOUNDARY-0001
type: test
title: Boundary observation, classification, stacking, and cleanup tests
status: draft
since: 0.1.0
summary: Runtime tests for multi-region ternary classification, Event-transported observation, shared outside notification, weak stacking, Hit Participation independence, and lifecycle cleanup.
cases:
  - id: T-BOUNDARY-0001-CASE-NO-ARG-ONCE
    title: repeated no-argument asBoundary calls reuse one configurable handle
    covers:
      - C-BOUNDARY-0001-G
    expectation: no-argument-once-boundary-handle
  - id: T-BOUNDARY-0001-CASE-CLASSIFICATION
    title: disjoint regions preserve ternary classification
    covers:
      - C-BOUNDARY-0001-A
    expectation: multi-region-ternary-boundary
  - id: T-BOUNDARY-0001-CASE-OBSERVATION
    title: pointer observation is setup-only, idempotent, and Event-transported
    covers:
      - C-BOUNDARY-0001-B
    expectation: event-transported-boundary-sample
  - id: T-BOUNDARY-0001-CASE-OUTSIDE
    title: one Boundary classification publishes the outside-derived signal
    covers:
      - C-BOUNDARY-0001-C
    expectation: shared-outside-classification
  - id: T-BOUNDARY-0001-CASE-STACK
    title: only the top-most active Boundary publishes outside
    covers:
      - C-BOUNDARY-0001-D
    expectation: top-most-outside-only
  - id: T-BOUNDARY-0001-CASE-HIT
    title: Hit Participation remains independent from Boundary
    covers:
      - C-BOUNDARY-0001-E
    expectation: independent-hit-participation
  - id: T-BOUNDARY-0001-CASE-CLEANUP
    title: detached and terminal lifecycle phases suspend and clean Boundary state
    covers:
      - C-BOUNDARY-0001-F
    expectation: lifecycle-safe-boundary-resources
implementations:
  - id: runtime-boundary-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/boundary.v0.contract.test.ts
    required: true
    consumesCases:
      - T-BOUNDARY-0001-CASE-NO-ARG-ONCE
      - T-BOUNDARY-0001-CASE-CLASSIFICATION
      - T-BOUNDARY-0001-CASE-OBSERVATION
      - T-BOUNDARY-0001-CASE-OUTSIDE
      - T-BOUNDARY-0001-CASE-STACK
      - T-BOUNDARY-0001-CASE-CLEANUP
  - id: runtime-hit-participation-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/hit-participation.v0.contract.test.ts
    required: true
    consumesCases:
      - T-BOUNDARY-0001-CASE-HIT
verifies:
  contracts:
    - id: C-BOUNDARY-0001
      anchors:
        - C-BOUNDARY-0001-A
        - C-BOUNDARY-0001-B
        - C-BOUNDARY-0001-C
        - C-BOUNDARY-0001-D
        - C-BOUNDARY-0001-E
        - C-BOUNDARY-0001-F
        - C-BOUNDARY-0001-G
revisions:
  - version: 0.1.0
    change: introduced
    summary: Added executable coverage for Boundary observation and classification ownership.
  - version: 0.1.1
    change: refined
    summary: Added no-argument once-caller and returned configuration-handle coverage.
tags:
  - boundary
  - event
  - contract-test
