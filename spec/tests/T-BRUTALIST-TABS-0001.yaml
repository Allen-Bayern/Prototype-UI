id: T-BRUTALIST-TABS-0001
type: test
title: Brutalist Tabs visual contract and public API tests
status: draft
since: 0.2.0-rc.7
summary: >-
  Covers the Brutalist Tabs public API (root+list entry/square strip, trigger selected pair and non-selected hover lift, content hidden-state collapse) against P-BRUTALIST-TABS family criteria.


cases:
  - id: T-BRUTALIST-TABS-0001-CASE-1
    title: Root and List entry, Base inheritance, and square ruled strip
    covers:
      - P-BRUTALIST-TABS-ENTRY
      - P-BRUTALIST-TABS-BASE-INHERITANCE
      - P-BRUTALIST-TABS-VISUAL-GRAMMAR
      - P-BRUTALIST-TABS-LIST-ENTRY
      - P-BRUTALIST-TABS-LIST-BASE-INHERITANCE
      - P-BRUTALIST-TABS-LIST-VISUAL-GRAMMAR
    expectation: p-brutalist-tabs-list-root-entry
  - id: T-BRUTALIST-TABS-0001-CASE-2
    title: Trigger entry and selected fill pair with black border and hard shadow
    covers:
      - P-BRUTALIST-TABS-TRIGGER-ENTRY
      - P-BRUTALIST-TABS-TRIGGER-BASE-INHERITANCE
      - P-BRUTALIST-TABS-TRIGGER-SELECTED-PAIR-INVARIANT
    expectation: p-brutalist-tabs-trigger-selected-pair
  - id: T-BRUTALIST-TABS-0001-CASE-3
    title: Trigger non-selected hover lift, press, focus-visible, disabled, and visual grammar
    covers:
      - P-BRUTALIST-TABS-TRIGGER-INTERACTION
      - P-BRUTALIST-TABS-TRIGGER-VISUAL-GRAMMAR
      - P-BRUTALIST-TABS-TRIGGER-BASE-INHERITANCE
    expectation: p-brutalist-tabs-trigger-interaction
  - id: T-BRUTALIST-TABS-0001-CASE-4
    title: Content entry, Base inheritance, hidden-state collapse, and square panel
    covers:
      - P-BRUTALIST-TABS-CONTENT-ENTRY
      - P-BRUTALIST-TABS-CONTENT-BASE-INHERITANCE
      - P-BRUTALIST-TABS-CONTENT-HIDDEN-STATE
      - P-BRUTALIST-TABS-CONTENT-VISUAL-GRAMMAR
    expectation: p-brutalist-tabs-content-hidden
implementations:
  - id: prototypes-brutalist-tabs-contract
    kind: module-test
    status: passing
    path: packages/prototypes/brutalist/test/tabs.test.ts
    required: true
    consumesCases:
      - T-BRUTALIST-TABS-0001-CASE-1
      - T-BRUTALIST-TABS-0001-CASE-2
      - T-BRUTALIST-TABS-0001-CASE-3
      - T-BRUTALIST-TABS-0001-CASE-4
    exercises:
      - P-BASE-TABS
      - P-BASE-TABS-LIST
      - P-BASE-TABS-CONTENT
      - P-BASE-TABS-TRIGGER
      - P-BRUTALIST-TABS
      - P-BRUTALIST-TABS-LIST
      - P-BRUTALIST-TABS-TRIGGER
      - P-BRUTALIST-TABS-CONTENT
verifies:
  prototypes:
    - id: P-BRUTALIST-TABS
    - id: P-BRUTALIST-TABS-LIST
    - id: P-BRUTALIST-TABS-TRIGGER
    - id: P-BRUTALIST-TABS-CONTENT
exercises:
  prototypes:
    - P-BASE-TABS
    - P-BASE-TABS-LIST
    - P-BASE-TABS-CONTENT
    - P-BASE-TABS-TRIGGER
    - P-BRUTALIST-TABS
