id: T-CLI-SHADCN-PRESET-CLOSURE-0001
type: test
title: CLI Shadcn preset source-closure tests
status: draft
since: 0.2.0-rc.1
summary: Generator, CLI init, and packed-consumer checks keep the shipped Shadcn preset synchronized with official prototype style tokens and retain Dialog motion CSS.
cases:
  - id: T-CLI-SHADCN-PRESET-CLOSURE-0001-CASE-GENERATED-MANIFEST
    title: generated preset manifest remains current with official Shadcn prototype sources
    covers: [D-CLI-SHADCN-PRESET-CLOSURE-0001-A]
    expectation: generated-shadcn-preset-manifest-is-current
  - id: T-CLI-SHADCN-PRESET-CLOSURE-0001-CASE-INIT-PARITY
    title: init token CSS exactly matches official Shadcn source-scanner output
    covers: [D-CLI-SHADCN-PRESET-CLOSURE-0001-B]
    expectation: cli-init-token-css-equals-official-shadcn-source-scan
  - id: T-CLI-SHADCN-PRESET-CLOSURE-0001-CASE-DIALOG-MOTION
    title: source and packed init output contain complete Dialog motion CSS
    covers: [D-CLI-SHADCN-PRESET-CLOSURE-0001-C]
    expectation: cli-init-retains-dialog-animation-utilities-and-keyframes
implementations:
  - id: cli-shadcn-preset-manifest-check
    kind: workspace-check
    status: passing
    path: scripts/styles/generate-shadcn-style-tokens.ts
    required: true
    consumesCases: [T-CLI-SHADCN-PRESET-CLOSURE-0001-CASE-GENERATED-MANIFEST]
  - id: cli-init-shadcn-preset-parity-test
    kind: module-test
    status: passing
    path: packages/cli/test/cli.test.ts
    required: true
    consumesCases:
      [
        T-CLI-SHADCN-PRESET-CLOSURE-0001-CASE-INIT-PARITY,
        T-CLI-SHADCN-PRESET-CLOSURE-0001-CASE-DIALOG-MOTION,
      ]
  - id: release-packed-cli-dialog-motion-smoke
    kind: workspace-check
    status: passing
    path: scripts/release/consumer-smoke-cli.mjs
    required: true
    consumesCases: [T-CLI-SHADCN-PRESET-CLOSURE-0001-CASE-DIALOG-MOTION]
verifies:
  decisions:
    - id: D-CLI-SHADCN-PRESET-CLOSURE-0001
      anchors:
        [
          D-CLI-SHADCN-PRESET-CLOSURE-0001-A,
          D-CLI-SHADCN-PRESET-CLOSURE-0001-B,
          D-CLI-SHADCN-PRESET-CLOSURE-0001-C,
        ]
exercises:
  prototypes: [P-SHADCN-DIALOG-CONTENT, P-SHADCN-DIALOG-MASK]
revisions:
  - version: 0.2.0-rc.1
    change: introduced
    summary: Added generated-manifest freshness, init parity, and packed Dialog motion checks.
tags: [cli, shadcn, style, preset, tokens, dialog, release-smoke, test]
