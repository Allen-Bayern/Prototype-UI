id: T-COLLECTION-0001
type: test
title: Collection runtime contract tests
status: draft
since: 0.1.0
summary: Runtime and prototype tests for no-arg asCollection/asCollectionItem behavior, ordered item snapshots, item position facts, dynamic reorder, and compatibility wrappers.
cases:
  - id: T-COLLECTION-0001-CASE-NO-ARG-HOOKS
    title: asCollection and asCollectionItem are no-arg privileged hooks configured through returned handles
    covers:
      - C-AS-COLLECTION-0001-A
      - C-AS-COLLECTION-0001-B
      - C-AS-COLLECTION-ITEM-0001-A
      - C-AS-COLLECTION-ITEM-0001-B
    expectation: no-arg-privileged-collection-hooks
  - id: T-COLLECTION-0001-CASE-ORDERED-SNAPSHOTS
    title: Collection provider exposes ordered item snapshots and count
    covers:
      - C-AS-COLLECTION-0001-C
      - C-AS-COLLECTION-0001-D
      - C-AS-COLLECTION-ITEM-0001-C
    expectation: ordered-collection-snapshots
  - id: T-COLLECTION-0001-CASE-EXPLICIT-ITEMS
    title: Collection only includes explicitly declared collection items
    covers:
      - C-AS-COLLECTION-0001-E
      - C-AS-COLLECTION-ITEM-0001-D
      - D-COLLECTION-FOCUS-ROVING-RELATIONSHIP-0001-A
    expectation: explicit-item-membership
implementations:
  - id: prototypes-base-collection-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/use-collection.test.ts
    required: true
    consumesCases:
      - T-COLLECTION-0001-CASE-NO-ARG-HOOKS
      - T-COLLECTION-0001-CASE-ORDERED-SNAPSHOTS
      - T-COLLECTION-0001-CASE-EXPLICIT-ITEMS
verifies:
  contracts:
    - id: C-AS-COLLECTION-0001
      anchors:
        - C-AS-COLLECTION-0001-A
        - C-AS-COLLECTION-0001-B
        - C-AS-COLLECTION-0001-C
        - C-AS-COLLECTION-0001-D
        - C-AS-COLLECTION-0001-E
    - id: C-AS-COLLECTION-ITEM-0001
      anchors:
        - C-AS-COLLECTION-ITEM-0001-A
        - C-AS-COLLECTION-ITEM-0001-B
        - C-AS-COLLECTION-ITEM-0001-C
        - C-AS-COLLECTION-ITEM-0001-D
  decisions:
    - id: D-COLLECTION-FOCUS-ROVING-RELATIONSHIP-0001
      anchors:
        - D-COLLECTION-FOCUS-ROVING-RELATIONSHIP-0001-A
revisions:
  - version: 0.1.0
    change: introduced
    summary: Mapped collection runtime tests for asCollection/asCollectionItem migration.
tags:
  - collection
  - contract-test
