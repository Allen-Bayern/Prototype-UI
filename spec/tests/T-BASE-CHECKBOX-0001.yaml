id: T-BASE-CHECKBOX-0001
type: test
title: Base Checkbox root protocol contract tests
status: draft
since: 0.1.0
summary: Contract test coverage for the Base Checkbox root prototype protocol, including checked input value behavior, secondary indeterminate display state, anatomy family ownership, context obligations, activation, accessibility, and deferred form/visual surfaces.
cases:
  - id: T-BASE-CHECKBOX-0001-CASE-ANATOMY-FAMILY
    title: Checkbox root owns the base-checkbox anatomy family and defines indicator as optional repeatable display structure
    covers:
      - P-BASE-CHECKBOX-ANATOMY-FAMILY
      - P-BASE-CHECKBOX-FAMILY-ROLES
      - P-BASE-CHECKBOX-ROOT-DOMAIN-ANCHOR
      - P-BASE-CHECKBOX-ROOT-CARDINALITY
      - P-BASE-CHECKBOX-INDICATOR-ROLE
      - P-BASE-CHECKBOX-INDICATOR-CARDINALITY
      - P-BASE-CHECKBOX-ROOT-CONTAINS-INDICATOR
    expectation: checkbox-root-owns-base-checkbox-anatomy-family
  - id: T-BASE-CHECKBOX-0001-CASE-AUTHORING-ENTRIES
    title: base-checkbox-root and asCheckboxRoot remain authoring entries of one independent Checkbox protocol
    covers:
      - P-BASE-CHECKBOX-AUTHORING-ENTRIES
      - P-BASE-CHECKBOX-PROTOCOL-INDEPENDENCE
      - P-BASE-CHECKBOX-ROOT-SEMANTIC-OWNER
    expectation: base-checkbox-root-and-as-checkbox-root-share-protocol-surface
  - id: T-BASE-CHECKBOX-0001-CASE-UNCONTROLLED-CHECKED-CHANGE
    title: uncontrolled Checkbox initializes checked state, flips on activation, and emits checkedChange
    covers:
      - P-BASE-CHECKBOX-ROLE-CHECKED-INPUT
      - P-BASE-CHECKBOX-DISPLAY-AND-INPUT
      - P-BASE-CHECKBOX-PROP-DEFAULT-CHECKED
      - P-BASE-CHECKBOX-CHECKED-EXPOSE
      - P-BASE-CHECKBOX-TRIGGER-SEMANTICS
      - P-BASE-CHECKBOX-ACTIVATION-FLIPS-CHECKED
      - P-BASE-CHECKBOX-UNCONTROLLED-UPDATES-CHECKED
      - P-BASE-CHECKBOX-CHECKED-CHANGE-SIGNAL
      - P-BASE-CHECKBOX-CHECKED-CHANGE-PROTOCOL-NAME
    expectation: uncontrolled-checkbox-flips-checked-and-emits-checked-change
  - id: T-BASE-CHECKBOX-0001-CASE-CONTROLLED-CHECKED
    title: controlled Checkbox mirrors checked props and emits next checked without claiming final state ownership
    covers:
      - P-BASE-CHECKBOX-PROP-CHECKED
      - P-BASE-CHECKBOX-CONTROLLED-CHECKED
      - P-BASE-CHECKBOX-CONTROLLED-EMITS-NEXT
      - P-BASE-CHECKBOX-PROP-NO-EVENT-CALLBACK
    expectation: controlled-checkbox-emits-next-checked-without-mutating-source-of-truth
  - id: T-BASE-CHECKBOX-0001-CASE-INDETERMINATE
    title: Checkbox exposes indeterminate as a secondary author-controlled mixed display state and clears it on activation
    covers:
      - P-BASE-CHECKBOX-INDETERMINATE-STATE
      - P-BASE-CHECKBOX-INDETERMINATE-NOT-USER-VALUE
      - P-BASE-CHECKBOX-INDETERMINATE-AUTHOR-CAPABILITY
      - P-BASE-CHECKBOX-INDETERMINATE-PROP-DEFERRED
      - P-BASE-CHECKBOX-ACTIVATION-CLEARS-INDETERMINATE
      - P-BASE-CHECKBOX-INDETERMINATE-CHANGE-DEFERRED
    expectation: checkbox-indeterminate-is-secondary-display-state-cleared-by-user-activation
  - id: T-BASE-CHECKBOX-0001-CASE-DISABLED-GATING
    title: disabled Checkbox exposes disabled state and suppresses activation-driven checked and indeterminate changes
    covers:
      - P-BASE-CHECKBOX-PROP-DISABLED
      - P-BASE-CHECKBOX-DISABLED-EXPOSE
      - P-BASE-CHECKBOX-DISABLED-SUPPRESS-ACTIVATION
      - P-BASE-CHECKBOX-DISABLED-CLEAR-TRANSIENT
    expectation: disabled-checkbox-suppresses-value-change-and-clears-transient-state
  - id: T-BASE-CHECKBOX-0001-CASE-INTERACTION-FOCUS-KEYBOARD
    title: Checkbox root exposes pointer, focus, press, and Space-only keyboard activation behavior
    covers:
      - P-BASE-CHECKBOX-POINTER-HOVER
      - P-BASE-CHECKBOX-FOCUSABLE
      - P-BASE-CHECKBOX-REQUEST-FOCUS
      - P-BASE-CHECKBOX-DISABLED-REJECT-FOCUS
      - P-BASE-CHECKBOX-PRESS-LIFECYCLE
      - P-BASE-CHECKBOX-KEYBOARD-SPACE-ACTIVATION
      - P-BASE-CHECKBOX-KEYBOARD-ENTER-NOT-ACTIVATION
      - P-BASE-CHECKBOX-KEYBOARD-SPACE-PREVENT-DEFAULT
    expectation: checkbox-root-exposes-interaction-focus-and-keyboard-behavior
  - id: T-BASE-CHECKBOX-0001-CASE-CONTEXT
    title: Checkbox root provides and synchronizes Checkbox context for same-domain indicator parts
    covers:
      - P-BASE-CHECKBOX-CONTEXT-KEY
      - P-BASE-CHECKBOX-CONTEXT-VALUE
      - P-BASE-CHECKBOX-CONTEXT-SYNC
      - P-BASE-CHECKBOX-PART-CONTEXT-CONSUME
    expectation: checkbox-root-provides-json-object-context-for-parts
  - id: T-BASE-CHECKBOX-0001-CASE-A11Y-AND-DEFERRED-SURFACES
    title: Checkbox accessibility and deferred label, form, aggregate, and visual surfaces remain catalog-visible
    covers:
      - P-BASE-CHECKBOX-ACCESSIBLE-ROLE
      - P-BASE-CHECKBOX-ACCESSIBLE-NAME
      - P-BASE-CHECKBOX-A11Y-CHECKED
      - P-BASE-CHECKBOX-A11Y-MIXED
      - P-BASE-CHECKBOX-PROP-LABEL-DEFERRED
      - P-BASE-CHECKBOX-FORM-INTEGRATION-DEFERRED
      - P-BASE-CHECKBOX-NO-VISUAL-VARIANT-CORE
    expectation: checkbox-a11y-and-deferred-surfaces-remain-explicit
implementations:
  - id: prototypes-base-checkbox-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/checkbox.test.ts
    required: true
    consumesCases:
      - T-BASE-CHECKBOX-0001-CASE-ANATOMY-FAMILY
      - T-BASE-CHECKBOX-0001-CASE-AUTHORING-ENTRIES
      - T-BASE-CHECKBOX-0001-CASE-UNCONTROLLED-CHECKED-CHANGE
      - T-BASE-CHECKBOX-0001-CASE-CONTROLLED-CHECKED
      - T-BASE-CHECKBOX-0001-CASE-INDETERMINATE
      - T-BASE-CHECKBOX-0001-CASE-DISABLED-GATING
      - T-BASE-CHECKBOX-0001-CASE-INTERACTION-FOCUS-KEYBOARD
      - T-BASE-CHECKBOX-0001-CASE-CONTEXT
      - T-BASE-CHECKBOX-0001-CASE-A11Y-AND-DEFERRED-SURFACES
    exercises:
      - P-BASE-CHECKBOX
    notes:
      - Covers current executable Checkbox root behavior through the base-checkbox-root web component path and focused runtime-host asHook checks.
      - Deferred indeterminate props, label, form, aggregate, and visual surfaces are covered as absence/declaration checks rather than final integration behavior.
verifies:
  prototypes:
    - id: P-BASE-CHECKBOX
      anchors:
        - P-BASE-CHECKBOX-ROLE-CHECKED-INPUT
        - P-BASE-CHECKBOX-INDETERMINATE-STATE
        - P-BASE-CHECKBOX-ACTIVATION-CLEARS-INDETERMINATE
        - P-BASE-CHECKBOX-CONTEXT-VALUE
        - P-BASE-CHECKBOX-A11Y-MIXED
exercises:
  prototypes:
    - P-BASE-CHECKBOX
revisions:
  - version: 0.1.0
    change: introduced
    summary: Introduced Base Checkbox root protocol test entity aligned to P-BASE-CHECKBOX criteria.
tags:
  - prototype
  - base
  - checkbox
  - test
