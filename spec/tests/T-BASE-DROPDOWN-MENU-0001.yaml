id: T-BASE-DROPDOWN-MENU-0001
type: test
title: Base Dropdown Menu Root and compound protocol tests
status: draft
since: 0.2.0-rc.0
summary: Covers Root ownership, controlled requests, collection, transient active state, anatomy, authoring independence, and the current extension boundary.
cases:
  - id: T-BASE-DROPDOWN-MENU-0001-CASE-ROOT-OWNERSHIP
    title: Root owns visibility, policies, collection, and context
    covers:
      [
        P-BASE-DROPDOWN-MENU-ROLE-ACTION-MENU,
        P-BASE-DROPDOWN-MENU-ROOT-OWNER,
        P-BASE-DROPDOWN-MENU-PROPS,
        P-BASE-DROPDOWN-MENU-CONTEXT,
        P-BASE-DROPDOWN-MENU-ANATOMY,
      ]
    expectation: dropdown-root-owns-open-policies-ordered-collection-and-context
  - id: T-BASE-DROPDOWN-MENU-0001-CASE-REQUESTS
    title: Every visibility path enters the Root-owned request method without a versioned Context envelope
    covers: [P-BASE-DROPDOWN-MENU-REQUESTS, P-BASE-DROPDOWN-MENU-CONTROLLED-OWNER]
    expectation: controlled-and-uncontrolled-dropdown-requests-preserve-owner-fact
  - id: T-BASE-DROPDOWN-MENU-0001-CASE-TRANSIENT-ACTIVE
    title: Active navigation resets across close and reopen
    covers: [P-BASE-DROPDOWN-MENU-TRANSIENT-ACTIVE]
    expectation: dropdown-active-state-never-becomes-selection
  - id: T-BASE-DROPDOWN-MENU-0001-CASE-AUTHORING-BOUNDARY
    title: Authoring entries share an independent core with explicit deferred variants
    covers:
      [
        P-BASE-DROPDOWN-MENU-AUTHORING-ENTRIES,
        P-BASE-DROPDOWN-MENU-PROTOCOL-INDEPENDENCE,
        P-BASE-DROPDOWN-MENU-DEFERRED-EXTENSIONS,
      ]
    expectation: dropdown-authoring-entries-share-independent-single-layer-protocol
implementations:
  - id: prototypes-base-dropdown-root-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/dropdown.test.ts
    required: true
    consumesCases:
      [
        T-BASE-DROPDOWN-MENU-0001-CASE-ROOT-OWNERSHIP,
        T-BASE-DROPDOWN-MENU-0001-CASE-REQUESTS,
        T-BASE-DROPDOWN-MENU-0001-CASE-TRANSIENT-ACTIVE,
        T-BASE-DROPDOWN-MENU-0001-CASE-AUTHORING-BOUNDARY,
      ]
    exercises: [P-BASE-DROPDOWN-MENU]
  - id: runtime-dropdown-menu-v0-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/dropdown-menu.v0.contract.test.ts
    required: true
    consumesCases:
      [
        T-BASE-DROPDOWN-MENU-0001-CASE-ROOT-OWNERSHIP,
        T-BASE-DROPDOWN-MENU-0001-CASE-TRANSIENT-ACTIVE,
      ]
    exercises: [P-BASE-DROPDOWN-MENU]
verifies:
  prototypes:
    - id: P-BASE-DROPDOWN-MENU
      anchors:
        [
          P-BASE-DROPDOWN-MENU-ROOT-OWNER,
          P-BASE-DROPDOWN-MENU-REQUESTS,
          P-BASE-DROPDOWN-MENU-CONTROLLED-OWNER,
          P-BASE-DROPDOWN-MENU-TRANSIENT-ACTIVE,
        ]
exercises: { prototypes: [P-BASE-DROPDOWN-MENU] }
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Added Root ownership, request, collection, active-reset, and protocol-boundary coverage.
  - version: 0.2.0-rc.0
    change: refined
    summary: Refined request coverage around the target-bound Root request entry and fact-oriented Context.
tags: [prototype, base, dropdown-menu, test]
