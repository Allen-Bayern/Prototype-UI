id: T-BASE-SELECT-VALUE-0001
type: test
title: Base Select Value value-class protocol tests
status: draft
since: 0.2.0
summary: Covers context-derived display, placeholder fallback, renderer refresh, displayValue exposure, and non-interactive value-class boundaries.
cases:
  - id: T-BASE-SELECT-VALUE-0001-CASE-CONTEXT-FALLBACK
    title: Value derives selected text and raw value before placeholder
    covers:
      [
        P-BASE-SELECT-VALUE-ROLE,
        P-BASE-SELECT-VALUE-AUTHORING-ENTRIES,
        P-BASE-SELECT-VALUE-CONTEXT,
        P-BASE-SELECT-VALUE-FALLBACK,
      ]
    expectation: select-value-follows-committed-context-with-deterministic-fallback
  - id: T-BASE-SELECT-VALUE-0001-CASE-RENDER-EXPOSE
    title: Value refreshes renderer children and exposes the same displayValue
    covers: [P-BASE-SELECT-VALUE-RENDER-REFRESH, P-BASE-SELECT-VALUE-DERIVED-EXPOSE]
    expectation: select-value-render-and-expose-stay-identical-after-live-text-update
  - id: T-BASE-SELECT-VALUE-0001-CASE-BOUNDARY
    title: Value establishes display ownership without interaction or input ownership
    covers: [P-BASE-SELECT-VALUE-NO-INTERACTION, P-BASE-SELECT-VALUE-VALUE-CLASS-PRECEDENT]
    expectation: select-value-is-render-consumer-not-control-or-value-owner
implementations:
  - id: prototypes-base-select-value-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/select.test.ts
    required: true
    consumesCases:
      [
        T-BASE-SELECT-VALUE-0001-CASE-CONTEXT-FALLBACK,
        T-BASE-SELECT-VALUE-0001-CASE-RENDER-EXPOSE,
        T-BASE-SELECT-VALUE-0001-CASE-BOUNDARY,
      ]
    exercises: [P-BASE-SELECT-VALUE]
verifies:
  prototypes:
    - id: P-BASE-SELECT-VALUE
      anchors:
        [
          P-BASE-SELECT-VALUE-CONTEXT,
          P-BASE-SELECT-VALUE-FALLBACK,
          P-BASE-SELECT-VALUE-RENDER-REFRESH,
          P-BASE-SELECT-VALUE-NO-INTERACTION,
        ]
exercises: { prototypes: [P-BASE-SELECT-VALUE] }
revisions:
  - version: 0.2.0
    change: introduced
    summary: Added the first value-class display, refresh, expose, and non-interaction coverage.
tags: [prototype, base, select, value, value-class, test]
