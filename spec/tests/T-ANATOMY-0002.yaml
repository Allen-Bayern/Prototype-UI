id: T-ANATOMY-0002
type: test
title: Anatomy domain and runtime part view tests
status: draft
since: 0.1.0
summary: Runtime and adapter tests for root-scoped domains, same-domain part queries, expose reads, render read access, and PartView safety.
cases:
  - id: T-ANATOMY-0002-CASE-DOMAIN-RESOLUTION
    title: Runtime queries resolve to the current root-scoped anatomy domain
    covers:
      - C-ANATOMY-0005-A
      - C-ANATOMY-0005-B
      - C-ANATOMY-0005-C
      - C-ANATOMY-0005-D
    expectation: nearest-root-domain-query
  - id: T-ANATOMY-0002-CASE-RUNTIME-PART-QUERY
    title: Runtime queries return actual same-domain part views without materializing missing parts
    covers:
      - C-ANATOMY-0008-A
      - C-ANATOMY-0008-B
      - C-ANATOMY-0008-D
    expectation: runtime-same-domain-part-views
  - id: T-ANATOMY-0002-CASE-PARTVIEW-SAFETY
    title: PartView exposes role and explicit exposes without leaking raw host targets
    covers:
      - C-ANATOMY-0008-C
      - C-ANATOMY-0009-A
      - C-ANATOMY-0009-B
      - C-ANATOMY-0009-C
      - C-ANATOMY-0009-D
    expectation: safe-part-view-expose-read
  - id: T-ANATOMY-0002-CASE-PARTVIEW-METHOD-BINDING
    title: PartView exposed methods run in the target part callback scope
    covers:
      - C-ANATOMY-0009-E
    expectation: target-bound-part-view-method-invocation
implementations:
  - id: module-anatomy-impl-spec
    kind: module-test
    status: passing
    path: packages/modules/anatomy/test/impl-spec.test.ts
    required: true
    consumesCases:
      - T-ANATOMY-0002-CASE-DOMAIN-RESOLUTION
      - T-ANATOMY-0002-CASE-RUNTIME-PART-QUERY
      - T-ANATOMY-0002-CASE-PARTVIEW-SAFETY
      - T-ANATOMY-0002-CASE-PARTVIEW-METHOD-BINDING
  - id: adapter-web-component-anatomy-runtime-access
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/contract/anatomy.runtime-access.v0.contract.test.ts
    required: true
    consumesCases:
      - T-ANATOMY-0002-CASE-RUNTIME-PART-QUERY
      - T-ANATOMY-0002-CASE-PARTVIEW-SAFETY
  - id: runtime-prototype-render-syntax-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/prototype.render-syntax.v0.contract.test.ts
    required: true
    consumesCases:
      - T-ANATOMY-0002-CASE-RUNTIME-PART-QUERY
verifies:
  contracts:
    - id: C-ANATOMY-0005
      anchors:
        - C-ANATOMY-0005-A
        - C-ANATOMY-0005-B
        - C-ANATOMY-0005-C
        - C-ANATOMY-0005-D
    - id: C-ANATOMY-0008
      anchors:
        - C-ANATOMY-0008-A
        - C-ANATOMY-0008-B
        - C-ANATOMY-0008-C
        - C-ANATOMY-0008-D
    - id: C-ANATOMY-0009
      anchors:
        - C-ANATOMY-0009-A
        - C-ANATOMY-0009-B
        - C-ANATOMY-0009-C
        - C-ANATOMY-0009-D
        - C-ANATOMY-0009-E
revisions:
  - version: 0.1.0
    change: introduced
    summary: Added anatomy domain, runtime query, expose-read, and PartView safety test mapping.
  - version: 0.1.1
    change: refined
    summary: Added target callback binding coverage for exposed PartView methods.
tags:
