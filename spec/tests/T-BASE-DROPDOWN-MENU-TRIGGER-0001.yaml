id: T-BASE-DROPDOWN-MENU-TRIGGER-0001
type: test
title: Base Dropdown Menu Trigger protocol tests
status: draft
since: 0.2.0-rc.0
summary: Covers Trigger command state, accessible relationships, disabled behavior, and pointer and keyboard entry requests.
cases:
  - id: T-BASE-DROPDOWN-MENU-TRIGGER-0001-CASE-COMMAND-A11Y
    title: Trigger is an independent accessible menu-button command
    covers:
      [
        P-BASE-DROPDOWN-MENU-TRIGGER-AUTHORING-ENTRIES,
        P-BASE-DROPDOWN-MENU-TRIGGER-COMMAND,
        P-BASE-DROPDOWN-MENU-TRIGGER-A11Y,
      ]
    expectation: dropdown-trigger-projects-button-menu-popup-relations-without-base-button
  - id: T-BASE-DROPDOWN-MENU-TRIGGER-0001-CASE-KEYBOARD
    title: Trigger keyboard paths request the required entry item exactly once
    covers: [P-BASE-DROPDOWN-MENU-TRIGGER-REQUEST]
    expectation: trigger-enter-space-down-up-open-with-first-or-last-entry-once
  - id: T-BASE-DROPDOWN-MENU-TRIGGER-0001-CASE-DISABLED
    title: Local and Root disabled state suppress request and focus participation
    covers: [P-BASE-DROPDOWN-MENU-TRIGGER-DISABLED]
    expectation: disabled-dropdown-trigger-never-opens
implementations:
  - id: prototypes-base-dropdown-trigger-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/dropdown.test.ts
    required: true
    consumesCases:
      [
        T-BASE-DROPDOWN-MENU-TRIGGER-0001-CASE-COMMAND-A11Y,
        T-BASE-DROPDOWN-MENU-TRIGGER-0001-CASE-KEYBOARD,
        T-BASE-DROPDOWN-MENU-TRIGGER-0001-CASE-DISABLED,
      ]
    exercises: [P-BASE-DROPDOWN-MENU-TRIGGER]
verifies:
  prototypes:
    - id: P-BASE-DROPDOWN-MENU-TRIGGER
      anchors:
        [
          P-BASE-DROPDOWN-MENU-TRIGGER-COMMAND,
          P-BASE-DROPDOWN-MENU-TRIGGER-A11Y,
          P-BASE-DROPDOWN-MENU-TRIGGER-REQUEST,
          P-BASE-DROPDOWN-MENU-TRIGGER-DISABLED,
        ]
exercises: { prototypes: [P-BASE-DROPDOWN-MENU-TRIGGER] }
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Added Trigger command, a11y, keyboard, and disabled coverage.
tags: [prototype, base, dropdown-menu, trigger, keyboard, test]
