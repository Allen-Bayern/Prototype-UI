id: T-A11Y-0001
type: test
title: A11y semantic object contract tests
status: draft
since: 0.1.0
summary: Contract tests for a11y semantic object IR, Button consumption, identity/relation projection, and Web adapter projection.
cases:
  - id: T-A11Y-0001-CASE-DYNAMIC-ROLE
    title: A semantic role may follow a state-backed fact
    covers:
      - C-A11Y-0001-C
      - C-A11Y-0001-J
    expectation: state-backed-role-projection
  - id: T-A11Y-0001-CASE-IR
    title: A prototype can declare identity, role, name, state, action, and relation into a stable a11y IR
    covers:
      - C-A11Y-0001-A
      - C-A11Y-0001-B
      - C-A11Y-0001-C
      - C-A11Y-0001-D
      - C-A11Y-0001-E
      - C-A11Y-0001-F
      - C-A11Y-0001-H
      - C-A11Y-0001-I
    expectation: semantic-object-ir
  - id: T-A11Y-0001-CASE-BUTTON
    title: Base Button declares button role, content-derived name policy, disabled state, and activate action
    covers:
      - C-A11Y-0001-B
      - C-A11Y-0001-C
      - C-A11Y-0001-D
      - C-A11Y-0001-E
      - C-A11Y-0001-F
    expectation: base-button-a11y-consumption
  - id: T-A11Y-0001-CASE-WEB-PROJECTION
    title: Web adapter projects supported a11y IR identity and relation facts to host attributes
    covers:
      - C-A11Y-0001-G
      - C-A11Y-0001-H
      - C-A11Y-0001-I
      - HC-A11Y-0001-A
      - HC-A11Y-0001-B
    expectation: web-a11y-projection
  - id: T-A11Y-0001-CASE-ADDITIVE-RELATION
    title: Additive Web relation projection preserves host-authored IDREF targets
    covers:
      - C-A11Y-0001-K
      - HC-A11Y-0001-B
    expectation: additive-web-relation-projection
implementations:
  - id: runtime-a11y-contract
    kind: runtime-test
    status: passing
    path: packages/runtime/test/contract/a11y.v0.contract.test.ts
    required: true
    consumesCases:
      - T-A11Y-0001-CASE-DYNAMIC-ROLE
      - T-A11Y-0001-CASE-IR
  - id: base-button-a11y-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/as-button.test.ts
    required: true
    consumesCases:
      - T-A11Y-0001-CASE-BUTTON
  - id: web-component-a11y-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/contract/a11y.v0.contract.test.ts
    required: true
    consumesCases:
      - T-A11Y-0001-CASE-WEB-PROJECTION
      - T-A11Y-0001-CASE-ADDITIVE-RELATION
verifies:
  contracts:
    - id: C-A11Y-0001
      anchors:
        - C-A11Y-0001-A
        - C-A11Y-0001-B
        - C-A11Y-0001-C
        - C-A11Y-0001-D
        - C-A11Y-0001-E
        - C-A11Y-0001-F
        - C-A11Y-0001-G
        - C-A11Y-0001-H
        - C-A11Y-0001-I
        - C-A11Y-0001-J
        - C-A11Y-0001-K
  hostCaps:
    - id: HC-A11Y-0001
      anchors:
        - HC-A11Y-0001-A
        - HC-A11Y-0001-B
revisions:
  - version: 0.1.0
    change: introduced
    summary: Added the first a11y semantic object test mapping.
  - version: 0.1.1
    change: refined
    summary: Added coverage for dynamic a11y name projection from state-backed text facts.
  - version: 0.1.2
    change: refined
    summary: Added runtime coverage for state-backed semantic role projection.
  - version: 0.2.0-rc.7
    change: refined
    summary: Added runtime and Web adapter coverage for additive relation ownership.
tags:
  - a11y
  - accessibility
  - contract-test
