id: T-BASE-SELECT-0001
type: test
title: Base Select Root and compound protocol tests
status: draft
since: 0.2.0-rc.0
summary: Covers Root ownership, controlled open and value requests, selection invariants, text derivation, anatomy, and extension boundaries.
cases:
  - id: T-BASE-SELECT-0001-CASE-ROOT-OWNERSHIP
    title: Root owns open, value, selected text, policies, collection, context, and anatomy
    covers:
      [
        P-BASE-SELECT-ROLE-SELECT-ONLY,
        P-BASE-SELECT-ROOT-OWNER,
        P-BASE-SELECT-PROPS,
        P-BASE-SELECT-CONTEXT,
        P-BASE-SELECT-ANATOMY,
      ]
    expectation: select-root-owns-single-selection-and-open-facts
  - id: T-BASE-SELECT-0001-CASE-REQUESTS
    title: Open and value paths enter Root request methods and preserve controlled owner facts
    covers: [P-BASE-SELECT-AUTHORING-ENTRIES, P-BASE-SELECT-REQUESTS]
    expectation: select-controlled-and-uncontrolled-requests-arbitrate-independently
  - id: T-BASE-SELECT-0001-CASE-SELECTION-TEXT
    title: Navigation stays transient while committed item text remains live
    covers: [P-BASE-SELECT-SELECTION-INVARIANT, P-BASE-SELECT-TEXT-DERIVATION]
    expectation: select-navigation-never-commits-and-selected-text-updates-live
  - id: T-BASE-SELECT-0001-CASE-BOUNDARY
    title: Current authoring entries do not claim deferred select extensions
    covers: [P-BASE-SELECT-DEFERRED-EXTENSIONS]
    expectation: select-current-scope-excludes-form-groups-search-and-virtualization
implementations:
  - id: prototypes-base-select-root-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/select.test.ts
    required: true
    consumesCases:
      [
        T-BASE-SELECT-0001-CASE-ROOT-OWNERSHIP,
        T-BASE-SELECT-0001-CASE-REQUESTS,
        T-BASE-SELECT-0001-CASE-SELECTION-TEXT,
        T-BASE-SELECT-0001-CASE-BOUNDARY,
      ]
    exercises: [P-BASE-SELECT]
  - id: adapter-web-component-select-contract
    kind: adapter-test
    status: passing
    path: packages/prototypes/base/test/select.test.ts
    required: true
    consumesCases:
      [
        T-BASE-SELECT-0001-CASE-ROOT-OWNERSHIP,
        T-BASE-SELECT-0001-CASE-REQUESTS,
        T-BASE-SELECT-0001-CASE-SELECTION-TEXT,
      ]
    exercises:
      [
        P-BASE-SELECT,
        P-BASE-SELECT-TRIGGER,
        P-BASE-SELECT-VALUE,
        P-BASE-SELECT-CONTENT,
        P-BASE-SELECT-ITEM,
      ]
  - id: adapter-react-select-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/select.test.ts
    required: true
    consumesCases: [T-BASE-SELECT-0001-CASE-ROOT-OWNERSHIP, T-BASE-SELECT-0001-CASE-SELECTION-TEXT]
    exercises: [P-BASE-SELECT, P-BASE-SELECT-TRIGGER, P-BASE-SELECT-CONTENT, P-BASE-SELECT-ITEM]
  - id: adapter-vue-select-contract
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/select.test.ts
    required: true
    consumesCases: [T-BASE-SELECT-0001-CASE-ROOT-OWNERSHIP, T-BASE-SELECT-0001-CASE-SELECTION-TEXT]
    exercises:
      [
        P-BASE-SELECT,
        P-BASE-SELECT-TRIGGER,
        P-BASE-SELECT-VALUE,
        P-BASE-SELECT-CONTENT,
        P-BASE-SELECT-ITEM,
      ]
verifies:
  prototypes:
    - id: P-BASE-SELECT
      anchors:
        [
          P-BASE-SELECT-ROOT-OWNER,
          P-BASE-SELECT-REQUESTS,
          P-BASE-SELECT-SELECTION-INVARIANT,
          P-BASE-SELECT-TEXT-DERIVATION,
        ]
exercises: { prototypes: [P-BASE-SELECT] }
revisions:
