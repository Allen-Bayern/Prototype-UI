id: T-SHADCN-DIALOG-LAYOUT-0001
type: test
title: Shadcn Dialog layout and default CloseIcon tests
status: draft
since: 0.2.0-rc.3
summary: Covers Header/Footer anatomy, the independent CloseIcon boundary, and generated Content preset materialization.
cases:
  - id: T-SHADCN-DIALOG-LAYOUT-0001-CASE-LAYOUT
    title: Header and Footer remain optional layout-only Content parts
    covers:
      [
        P-SHADCN-DIALOG-HEADER-ANATOMY,
        P-SHADCN-DIALOG-HEADER-LAYOUT-ONLY,
        P-SHADCN-DIALOG-FOOTER-ANATOMY,
        P-SHADCN-DIALOG-FOOTER-NO-ACTION-SEMANTICS,
      ]
    expectation: dialog-layout-parts-claim-anatomy-without-owning-actions
  - id: T-SHADCN-DIALOG-LAYOUT-0001-CASE-CLOSE-ICON
    title: CloseIcon remains an accessible independent close-command prototype
    covers: [P-SHADCN-DIALOG-CLOSE-ICON-BASE-INHERITANCE, P-SHADCN-DIALOG-CLOSE-ICON-SURFACE]
    expectation: dialog-close-icon-renders-and-closes-through-base-command
  - id: T-SHADCN-DIALOG-LAYOUT-0001-CASE-PRESET
    title: generated Content facades materialize a replaceable default CloseIcon
    covers: [P-SHADCN-DIALOG-CLOSE-ICON-PRESET]
    expectation: dialog-content-preset-supports-default-replacement-and-omission
implementations:
  - id: prototypes-shadcn-dialog-layout
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/dialog.test.ts
    required: true
    consumesCases:
      [T-SHADCN-DIALOG-LAYOUT-0001-CASE-LAYOUT, T-SHADCN-DIALOG-LAYOUT-0001-CASE-CLOSE-ICON]
    exercises: [P-SHADCN-DIALOG-HEADER, P-SHADCN-DIALOG-FOOTER, P-SHADCN-DIALOG-CLOSE-ICON]
  - id: cli-shadcn-dialog-content-preset
    kind: module-test
    status: passing
    path: packages/cli/test/cli.test.ts
    required: true
    consumesCases: [T-SHADCN-DIALOG-LAYOUT-0001-CASE-PRESET]
    exercises: [P-SHADCN-DIALOG-CLOSE-ICON]
verifies:
  prototypes:
    - id: P-SHADCN-DIALOG-HEADER
      anchors: [P-SHADCN-DIALOG-HEADER-ANATOMY, P-SHADCN-DIALOG-HEADER-LAYOUT-ONLY]
    - id: P-SHADCN-DIALOG-FOOTER
      anchors: [P-SHADCN-DIALOG-FOOTER-ANATOMY, P-SHADCN-DIALOG-FOOTER-NO-ACTION-SEMANTICS]
    - id: P-SHADCN-DIALOG-CLOSE-ICON
      anchors:
        [
          P-SHADCN-DIALOG-CLOSE-ICON-BASE-INHERITANCE,
          P-SHADCN-DIALOG-CLOSE-ICON-SURFACE,
          P-SHADCN-DIALOG-CLOSE-ICON-PRESET,
        ]
exercises:
  prototypes: [P-SHADCN-DIALOG-HEADER, P-SHADCN-DIALOG-FOOTER, P-SHADCN-DIALOG-CLOSE-ICON]
revisions:
  - version: 0.2.0-rc.3
    change: introduced
    summary: Added layout-part, CloseIcon, and generated Content preset coverage.
tags: [test, shadcn, dialog, anatomy, close-icon, preset]
