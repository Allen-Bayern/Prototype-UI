id: T-RULE-0001
type: test
title: Rule declaration and IR boundary tests
status: draft
since: 0.1.0
summary: Contract tests for setup-only rule declarations, analyzable RuleSpec recording, serializable RuleIR boundaries, and setup-only removal handles.
cases:
  - id: T-RULE-0001-CASE-SETUP-ONLY
    title: def.rule is only available during setup
    covers:
      - C-RULE-0004-A
      - C-RULE-0004-B
    expectation: setup-only-rule-declaration
  - id: T-RULE-0001-CASE-SPEC-RECORDING
    title: RuleSpec records when and intent without setup-time side effects
    covers:
      - C-RULE-0004-C
      - C-RULE-0004-D
      - C-RULE-INTENT-0001-A
    expectation: analyzable-rule-spec-recorded
  - id: T-RULE-0001-CASE-SERIALIZABLE-IR
    title: RuleIR contains serializable identities instead of functions, host objects, closures, or live handles
    covers:
      - C-RULE-0003-A
      - C-RULE-0003-B
      - C-RULE-0003-C
      - C-RULE-0003-D
    expectation: serializable-rule-ir-boundary
  - id: T-RULE-0001-CASE-SETUP-ONLY-REMOVAL
    title: Rule declaration removal remains setup-only and cannot become a runtime disposer
    covers:
      - C-CORE-SYNTAX-0007-A
      - C-CORE-SYNTAX-0007-B
      - C-CORE-SYNTAX-0007-C
      - C-CORE-SYNTAX-0007-D
    expectation: setup-only-rule-removal
implementations:
  - id: runtime-rule-declaration-contract
    kind: runtime-test
    status: planned
    path: packages/runtime/test/contract/rule.declaration.v0.contract.test.ts
    required: true
    consumesCases:
      - T-RULE-0001-CASE-SETUP-ONLY
      - T-RULE-0001-CASE-SPEC-RECORDING
      - T-RULE-0001-CASE-SETUP-ONLY-REMOVAL
  - id: module-rule-ir-contract
    kind: module-test
    status: planned
    path: packages/modules/rule/test/contract/rule-ir.v0.contract.test.ts
    required: true
    consumesCases:
      - T-RULE-0001-CASE-SPEC-RECORDING
      - T-RULE-0001-CASE-SERIALIZABLE-IR
verifies:
  contracts:
    - id: C-RULE-0003
      anchors:
        - C-RULE-0003-A
        - C-RULE-0003-B
        - C-RULE-0003-C
        - C-RULE-0003-D
    - id: C-RULE-0004
      anchors:
        - C-RULE-0004-A
        - C-RULE-0004-B
        - C-RULE-0004-C
        - C-RULE-0004-D
    - id: C-CORE-SYNTAX-0007
      anchors:
        - C-CORE-SYNTAX-0007-A
        - C-CORE-SYNTAX-0007-B
        - C-CORE-SYNTAX-0007-C
        - C-CORE-SYNTAX-0007-D
exercises:
  decisions:
    - id: D-RULE-HANDLE-DISPOSE-0001
      role: diagnostic-policy
      coverageImpact: review-test-surface
      note: Captures the known gap that setup-time Rule removal must not remain callable as a runtime disposer.
    - id: D-RULE-IR-SERIALIZABLE-0001
      role: diagnostic-policy
      coverageImpact: review-test-surface
      note: Captures the known RuleIR side-table migration needed for any live execution handles.
revisions:
  - version: 0.1.0
    change: introduced
    summary: Added rule declaration and serializable IR boundary test mapping.
tags:
  - rule
  - ir
  - setup
  - contract-test
