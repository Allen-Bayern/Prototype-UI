id: D-USE-FOCUS-ROVING-DEPRECATION-0001
type: decision
title: useFocusRoving was removed after the asFocusRoving migration
status: deprecated
since: 0.1.0
deprecatedSince: 0.2.0
summary: useFocusRoving was removed in 0.2 after Dropdown Menu and Select assigned sibling-local movement and default-action control to asFocusRoving.
statement:
  zh-CN: >-
    `useFocusRoving` 是早期 anatomy/expose 型 focus movement helper。Dropdown Menu 与 Select 已在 0.2 完成迁移，因此其实现与公开导出已经删除。Sibling-local keyboard navigation、orientation、loop、Home/End 与 default-action control 由 `asFocusRoving()` / focus module 长期拥有；具体组件只保留 activation、selection request、disabled gating 与组件状态同步。新实现不得恢复或重新消费 `useFocusRoving`。


  en: >-
    `useFocusRoving` was an early anatomy/expose-based focus movement helper. Dropdown Menu and Select completed their migration in 0.2, so its implementation and public exports have been removed. `asFocusRoving()` and the focus module now permanently own sibling-local keyboard navigation, orientation, loop, Home/End, and default-action control; concrete components retain activation, selection requests, disabled gating, and component-state synchronization. New implementations must not restore or consume `useFocusRoving`.


criteria:
  - id: D-USE-FOCUS-ROVING-DEPRECATION-0001-A
    text:
      zh-CN: 原型实现与 behaviors 公开入口中不得存在 `useFocusRoving` 实现、导出或消费。
      en: Prototype implementations and public behavior entrypoints must not contain a `useFocusRoving` implementation, export, or consumer.
  - id: D-USE-FOCUS-ROVING-DEPRECATION-0001-B
    text:
      zh-CN: Dropdown Menu 与 Select 必须消费 `asFocusRoving()`，并由其拥有 sibling movement 与 default-action control。
      en: Dropdown Menu and Select must consume `asFocusRoving()` as the owner of sibling movement and default-action control.
  - id: D-USE-FOCUS-ROVING-DEPRECATION-0001-C
    text:
      zh-CN: 历史名称仅可出现在迁移记录或治理决策中，不得作为可用 API 出现在原型文档中。
      en: The historical name may remain only in migration records or governance decisions, not in prototype documentation as an available API.
sources:
