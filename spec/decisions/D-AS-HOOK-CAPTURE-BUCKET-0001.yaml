id: D-AS-HOOK-CAPTURE-BUCKET-0001
type: decision
title: asHook capture buckets are implementation detail
status: draft
since: 0.1.0
summary: Current runtime capture buckets do not map one-to-one to semantic modules, so contracts should describe captured effects, artifacts, and disposers rather than internal bucket names.
statement:
  zh-CN: >-
    当前 asHook runtime 使用有限的 capture bucket 收集 setup effects，部分语义例如 rule 或 expose method 可能落入并不完全对应其语义模块的内部 bucket。该结构是实现折中，不应成为公开契约。asHook 契约应描述“捕获了哪些 setup effects、暴露哪些 artifacts/disposers/handles、如何归属调用者 prototype”，而不是固化内部 bucket 名称。


  en: >-
    The current asHook runtime uses a limited set of capture buckets for setup effects, and some semantics such as rule or expose method may fall into internal buckets that do not map exactly to their semantic modules. This structure is an implementation compromise and should not become public contract. asHook contracts should describe which setup effects are captured, which artifacts/disposers/handles are exposed, and how they attach to the caller prototype, rather than stabilizing internal bucket names.


explains:
  contracts:
    - C-AS-HOOK-0005
sources:
  - path: packages/runtime/src/kernel/as-hook.ts
    sections:
