id: D-RULE-STATE-INTENT-0001
type: decision
title: Rule state intent remains implementation debt
status: draft
since: 0.1.0
summary: '`intent.state` is a planned Rule intent channel, but its layer stack, rollback, baseline, and reason semantics are not implemented as v0 guarantees.'
statement:
  zh-CN: >-
    `intent.state` 暂时保留为 Rule 的计划能力与实现债务。旧契约中描述的可写视图限制、layer stack、rule 失效回滚、非 rule baseline、每次评估每个 state 最多 set 一次与 reason 语义，尚未成为当前 runtime 的 v0 保证。

  en: >-
    `intent.state` remains a planned Rule capability and implementation debt. The writable-view constraints, layer stack, deactivation rollback, non-rule baseline, at-most-once-per-state set per evaluation, and reason semantics described in older drafts are not current v0 runtime guarantees.

explains:
  contracts:
    - C-RULE-INTENT-0001
sources:
