id: D-RULE-META-NAMING-0001
type: decision
title: Rule host-environment input naming remains unsettled
status: draft
since: 0.1.0
summary: The current `meta` Rule input is treated as secondary scope because host/environment configuration may need a more systematic abstraction.
statement:
  zh-CN: >-
    当前 `module-rule-meta` 提供的 `w.meta(key)` 暂不进入 Rule core 命名。它表达的是宿主环境或配置类输入，但这类输入未来可能需要比 “meta” 更系统的抽象。

  en: >-
    The current `w.meta(key)` provided by `module-rule-meta` is not stabilized as Rule core naming. It represents host environment or configuration-like inputs, but that area may need a more systematic abstraction than "meta" in the future.

