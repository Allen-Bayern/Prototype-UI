id: D-AS-HOOK-DISPOSER-PHASE-0001
type: decision
title: asHook setup-effect disposers are setup-only
status: draft
since: 0.1.0
summary: asHook should expose disposers for setup-introduced effects where possible, but those disposers must not become runtime cleanup or lifecycle disposer APIs.
statement:
  zh-CN: >-
    asHook result 暴露 disposer 的目的是让调用者在 setup 期间撤销 asHook 引入的 setup effects，而不是提供 runtime cleanup。Proto UI 中 setup 期间引入的副作用，其 disposer 默认只能在 setup 期间调用；这与 `C-CORE-SYNTAX-0007` 保持一致。当前已有测试或实现若允许 setup 后调用 asHook disposer，应视为实现/测试待校准点。


  en: >-
    Disposers exposed through an asHook result let the caller undo setup effects introduced by the asHook during setup; they are not runtime cleanup APIs. In Proto UI, disposers for side effects introduced during setup are setup-only by default, consistent with `C-CORE-SYNTAX-0007`. Existing tests or implementation paths that allow calling asHook disposers after setup should be treated as implementation/test alignment gaps.


explains:
  contracts:
    - C-AS-HOOK-0006
    - C-CORE-SYNTAX-0007
sources:
  - path: packages/runtime/test/contract/as-hook.v0.contract.test.ts
    sections:
