id: D-AS-HOOK-DEFINE-HOOK-0001
type: decision
title: defineHook and useHook remain unresolved authoring API design
status: draft
since: 0.1.0
summary: The project has an implemented defineHook API, but whether Proto UI should stabilize a separate useHook/defineUseHook concept instead of ordinary user functions remains undecided.
statement:
  zh-CN: >-
    当前实现存在 `defineHook`，并且一些官方原型已经用它表达更接近组合式逻辑复用的能力。但如果 use-style hook 只是普通函数封装，原型作者完全可以自行定义函数；只有当它需要 trace、capture、setup guard、artifacts、disposers 或未来冲突诊断时，才值得成为受治理 API。因此 `defineHook`、`defineUseHook` 或普通函数之间的关系暂不进入 asHook 核心契约，需要后续单独讨论。


  en: >-
    The current implementation has `defineHook`, and some official prototypes use it for logic reuse closer to composition. But if a use-style hook is only an ordinary function wrapper, prototype authors can write their own functions; it deserves a governed API only when it needs trace, capture, setup guards, artifacts, disposers, or future conflict diagnostics. Therefore the relationship between `defineHook`, `defineUseHook`, and ordinary functions is not part of the core asHook contract yet and needs separate discussion.


