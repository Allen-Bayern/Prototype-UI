id: D-GLOBAL-RELEASE-VERSION-0001
type: decision
title: Global exact release versions
status: active
since: 0.2.0-rc.0
summary: Public Proto UI packages and spec releases use one exact ecosystem version.
statement:
  en: During v0, a numeric Proto UI version identifies one ecosystem release. Every public @proto.ui package, the repository VERSION projection, and the released spec snapshot must use that version exactly; package-local patch autonomy is not allowed.
  zh-CN: 在 v0 阶段，数字形式的 Proto UI 版本标识一次生态发行。全部公开 @proto.ui package、仓库 VERSION 投射与已发布 spec snapshot 必须精确使用该版本；不允许 package 局部自治 patch。
criteria:
  - id: D-GLOBAL-RELEASE-VERSION-0001-EXACT
    text:
      en: A release check fails when any public @proto.ui package version differs from the repository release version, including patch or prerelease differences.
      zh-CN: 任一公开 @proto.ui package 与仓库 release version 存在差异时，release check 必须失败，包括 patch 或 prerelease 差异。
  - id: D-GLOBAL-RELEASE-VERSION-0001-V-ENTITY
    text:
      en: Every supported release version is declared by a V entity; arbitrary entity revision numbers do not create releases.
      zh-CN: 每个受支持的发行版本均由 V 实体声明；任意实体 revision 数字不能自行创造 release。
  - id: D-GLOBAL-RELEASE-VERSION-0001-ATOMIC
    text:
      en: A package-local fix waits in the current release train and is published as part of the next ecosystem release.
      zh-CN: package 局部修复进入当前 release train，并作为下一次生态发行的一部分发布。
  - id: D-GLOBAL-RELEASE-VERSION-0001-EXTERNAL
    text:
      en: Equal release versions are a necessary compatibility precondition, while full Prototype and Adapter compatibility still requires conformance evidence.
      zh-CN: 相同 release version 是兼容性的必要前提；Prototype 与 Adapter 的完全兼容仍需 conformance 证据。
openQuestions: []
sources:
  - path: internal/governance/versioning-policy.zh-CN.md
  - path: internal/governance/release-workflow.zh-CN.md
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Replaced minor-lockstep patch autonomy with global exact release versions.
tags:
  - release
  - versioning
  - lockstep
