id: D-FOCUS-ROVING-NAVIGATION-OWNERSHIP-0001
type: decision
title: Focus Roving owns sibling-local navigation while triggers own activation
status: draft
since: 0.1.0
summary: Sibling-local keyboard navigation belongs to Focus Roving, while concrete triggers and items should keep ownership of activation, selection requests, and component-specific state synchronization.
statement:
  zh-CN: >-
    Proto UI 应把同一 roving set 内的方向键、Home、End 导航解释与 default-action control 归属给 Focus Roving，而不是让每个 trigger 或 item 原型重复监听并转发键盘事件。Trigger / item 原型仍拥有 activation、selection request、disabled gating 与组件特定状态同步。`navParticipation` 只表示自然 Tab 顺序参与，不应剥夺 enabled focusable 作为 roving candidate 的资格。


  en: >-
    Proto UI should assign arrow-key, Home, End navigation interpretation and default-action control inside a roving set to Focus Roving, rather than making every trigger or item prototype repeat keyboard event forwarding. Trigger and item prototypes still own activation, selection requests, disabled gating, and component-specific state synchronization. `navParticipation` only describes natural Tab-order participation and must not remove an enabled focusable from roving candidate eligibility.


criteria:
  - id: D-FOCUS-ROVING-NAVIGATION-OWNERSHIP-0001-A
    text:
      zh-CN: Focus Roving 必须拥有同一 roving set 内的方向键、Home、End 导航解释。
      en: Focus Roving must own arrow-key, Home, and End navigation interpretation inside one roving set.
  - id: D-FOCUS-ROVING-NAVIGATION-OWNERSHIP-0001-B
    text:
      zh-CN: roving navigation 的 default-action control 必须由 Focus Roving 或其基础模块请求，不应由每个 trigger/item 原型重复实现。
      en: Default-action control for roving navigation must be requested by Focus Roving or its foundation module and should not be repeated by every trigger/item prototype.
  - id: D-FOCUS-ROVING-NAVIGATION-OWNERSHIP-0001-C
    text:
      zh-CN: Trigger / item 原型应保留 activation、selection request、disabled gating 与组件特定状态同步职责。
      en: Trigger/item prototypes should retain activation, selection request, disabled gating, and component-specific state synchronization responsibilities.
  - id: D-FOCUS-ROVING-NAVIGATION-OWNERSHIP-0001-D
    text:
      zh-CN: '`navParticipation: "none"` 不得把 enabled focusable 从 roving candidates 中排除；它只影响自然 Tab 顺序参与。'
      en: '`navParticipation: "none"` must not exclude an enabled focusable from roving candidates; it only affects natural Tab-order participation.'
