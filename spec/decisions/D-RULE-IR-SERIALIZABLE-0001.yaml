id: D-RULE-IR-SERIALIZABLE-0001
type: decision
title: RuleIR serialization requires implementation cleanup
status: draft
since: 0.1.0
summary: RuleIR is required to be serializable, but current implementation paths may still retain live handles and need migration to serializable identities plus side tables.
statement:
  zh-CN: >-
    RuleIR 已被约束为必须完全可序列化，但当前实现中仍可能存在携带 live handle 的路径。后续需要将执行所需 handle 迁移到 RuleIR 外部 side table，并让 RuleIR 只保留可序列化 identity。

  en: >-
    RuleIR is now constrained to be fully serializable, but current implementation paths may still carry live handles. Future work needs to migrate execution-time handles into side tables outside RuleIR and keep only serializable identities in RuleIR.

explains:
  contracts:
