id: D-AS-HOOK-NO-ARG-ONCE-0001
type: decision
title: Authored asHook callers are no-arg and once-only in v0
status: draft
since: 0.1.0
summary: Ordinary authored asHooks defined through defineAsHook have no caller parameters and use first-call-wins semantics; configuration must be exposed through returned handles or future governed APIs.
statement:
  zh-CN: >-
    v0 中，普通 authored asHook 的 caller 必须是无参数形式。`defineAsHook(...)` 不再承诺 `setup(def, options, api)`、`mode`、`configure` 或多次独立安装；同一调用者 prototype setup 链路中，同名 authored asHook 仅第一次调用生效，后续调用复用第一次返回值且不重新安装。需要配置能力时，应优先通过首次调用返回的 handle/API 提供 setup 期配置入口，或由特权 asHook / 后续明确契约单独定义。


  en: >-
    In v0, ordinary authored asHook callers must be no-arg. `defineAsHook(...)` no longer promises `setup(def, options, api)`, `mode`, `configure`, or multiple independent installation; within one caller prototype setup chain, the first same-name authored asHook call applies, and later calls reuse the first result without reinstalling. Configuration capability should be exposed through handles/APIs returned by the first call, or be defined separately by privileged asHooks or future explicit contracts.


