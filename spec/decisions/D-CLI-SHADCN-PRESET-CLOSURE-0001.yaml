id: D-CLI-SHADCN-PRESET-CLOSURE-0001
type: decision
title: CLI Shadcn preset is a generated closure of official prototype style tokens
status: draft
since: 0.2.0-rc.1
summary: The CLI keeps an install-time Shadcn token preset for first-run and offline use, but generates that manifest deterministically from official Shadcn prototype sources instead of maintaining an independent token list.
statement:
  zh-CN: >-
    `proto-ui init` 必须能够在目标项目尚未安装 prototype package 时生成首份可用 CSS，因此 CLI package 继续携带静态 Shadcn preset manifest；但该 manifest 必须由官方 `packages/prototypes/shadcn/src` 经同一 token scanner 确定性生成，不得再由人工维护一份独立 token 清单。初始化产生的 token CSS 必须与对该官方源码执行 `proto-ui tokens` 的结果一致，从而让 prototype 新增、删除或修改的视觉 intent 能进入首次消费产物。


  en: >-
    `proto-ui init` must produce usable initial CSS before the target project has necessarily installed a prototype package, so the CLI package continues to carry a static Shadcn preset manifest. That manifest must be generated deterministically from official `packages/prototypes/shadcn/src` through the same token scanner rather than maintained as an independent manual list. Token CSS produced by init must equal the result of running `proto-ui tokens` over those official sources, so visual intents added, removed, or changed by prototypes reach first-consumer output.


criteria:
  - id: D-CLI-SHADCN-PRESET-CLOSURE-0001-A
    text:
      zh-CN: CLI 携带的 Shadcn preset manifest 必须由官方 Shadcn prototype 源码经共享 scanner 确定性生成，并提供可执行的 stale check。
      en: The Shadcn preset manifest carried by the CLI must be generated deterministically from official Shadcn prototype sources through the shared scanner and provide an executable stale check.
  - id: D-CLI-SHADCN-PRESET-CLOSURE-0001-B
    text:
      zh-CN: '`proto-ui init` 产生的 token CSS 必须与扫描同一版本官方 Shadcn prototype 源码所得 CSS 完全一致。'
      en: Token CSS produced by `proto-ui init` must exactly equal CSS produced by scanning the same-version official Shadcn prototype sources.
  - id: D-CLI-SHADCN-PRESET-CLOSURE-0001-C
    text:
      zh-CN: 官方 Dialog 的 animate、fade、zoom token 与 enter/exit keyframes 必须存在于 init 产物以及打包后的 CLI consumer smoke 产物中。
      en: Official Dialog animate, fade, and zoom tokens and enter and exit keyframes must be present in init output and in packed-CLI consumer smoke output.
