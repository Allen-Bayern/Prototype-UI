id: D-AS-HOOK-CONFIGURABLE-AUTHORED-0001
type: decision
title: Configurable authored asHook remains governed design space
status: draft
since: 0.1.0
summary: Ordinary configurable authored asHook remains future design space; current defineAsHook v0 exposes no options, mode, or configure API.
statement:
  zh-CN: >-
    普通 authored configurable asHook 会引入参数是否参与 identity、重复调用如何合并、冲突如何诊断、返回值是否复用、configure 能获得哪些能力等治理问题。v0 核心 asHook 契约先稳定无参数 caller 与 once 默认语义；`defineAsHook(...)` 当前不暴露 options、mode 或 configure。普通 authored configurable asHook 暂作为待治理设计空间，特权 asHook 可由自身契约定义参数和合并规则。


  en: >-
    Ordinary configurable authored asHooks raise governance questions around whether options participate in identity, how repeated calls merge, how conflicts are diagnosed, whether results are reused, and which capabilities configure may receive. v0 core asHook contracts stabilize no-arg callers and once-by-default semantics first; `defineAsHook(...)` currently exposes no options, mode, or configure API. Ordinary configurable authored asHook remains governed design space, while privileged asHooks may define parameters and merge rules in their own contracts.


explains:
  contracts:
    - C-AS-HOOK-0004
relates:
  decisions:
    - D-AS-HOOK-NO-ARG-ONCE-0001
