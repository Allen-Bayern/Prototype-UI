revisions:
  - version: 0.1.0
    change: introduced
    summary: Accepted lazy initial materialization and inactive L1 detach as the target Base Tabs Content default.
  - version: 0.1.1
    change: implemented
    summary: Tabs Content now uses run.lifecycle.setPresent, defaults to inactive L1 detach, and exposes keepMounted as its only retention option.
