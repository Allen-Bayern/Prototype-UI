id: D-BASE-TABS-L1-MATERIALIZATION-0001
type: decision
title: Base Tabs Content defaults to lazy L1 materialization
status: active
since: 0.1.0
summary: Inactive Base Tabs Content will default to no view, detach on exit, and preserve its Proto instance; keepMounted remains the explicit full-view retention option.
statement:
  zh-CN: >-
    Base Tabs Content 的默认行为必须从 eager hidden 改为 initial lazy 加 inactive detach：只有 current content 的 view 被物化，离开 current 状态时执行 L1 repeatable unmount，但 Tabs Content 的宿主 owner 与 Proto instance 继续存活。`keepMounted` 是唯一显式保留完整 view 的 API，默认 false。该默认行为与 Base UI `Tabs.Panel keepMounted=false` 及 Radix UI inactive `Tabs.Content` 默认 unmount 的方向一致；`lazyMount` 与 `unmountOnExit` boolean surface 被移除，以避免含糊或矛盾的组合。


  en: >-
    Base Tabs Content's default behavior must change from eager hidden to initial lazy plus inactive detach: only the current content view is materialized, and leaving current performs an L1 repeatable unmount while the Tabs Content host owner and Proto instance remain alive. `keepMounted`, defaulting to false, is the only explicit API for retaining the complete view. This default aligns with Base UI `Tabs.Panel keepMounted=false` and Radix UI's default unmounting of inactive `Tabs.Content`; the `lazyMount` and `unmountOnExit` boolean surface is removed to avoid ambiguous or contradictory combinations.


relates:
  contracts:
    - C-LIFECYCLE-0008
  prototypes:
    - P-BASE-TABS
    - P-BASE-TABS-CONTENT
sources:
