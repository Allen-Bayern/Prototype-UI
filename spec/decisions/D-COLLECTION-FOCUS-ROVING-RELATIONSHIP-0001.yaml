id: D-COLLECTION-FOCUS-ROVING-RELATIONSHIP-0001
type: decision
title: Collection and focus roving share ordered member projection but are not the same abstraction
status: draft
since: 0.1.0
summary: Collection should model explicitly declared Proto UI item sets, while focus roving may optionally consume collection but must also support non-collection focus candidate sources.
statement:
  zh-CN: >-
    Proto UI 应将 Collection 与 Focus Roving 视为共享 ordered member/candidate projection 问题域的两个独立抽象。Collection 只描述由 Proto UI 原型主动声明的 provider 与 item；Focus Roving 描述某个焦点导航范围内的 eligible focus target。二者经常重合，但 Focus Roving 不应被定义为必须依赖 Collection，Collection 也不应为了 Focus Roving 的宿主可聚焦元素场景扩张成通用 focus query。


  en: >-
    Proto UI should treat Collection and Focus Roving as two separate abstractions that share the ordered member/candidate projection problem space. Collection describes explicitly declared Proto UI providers and items; Focus Roving describes eligible focus targets in a focus navigation range. They often overlap, but Focus Roving must not be defined as always depending on Collection, and Collection must not expand into a generic focus query just to support host-focusable roving cases.


criteria:
  - id: D-COLLECTION-FOCUS-ROVING-RELATIONSHIP-0001-A
    text:
      zh-CN: Collection 必须由 Proto UI provider/item 主动声明，不得隐式吸收任意宿主可聚焦后代。
      en: Collection must be explicitly declared by Proto UI providers/items and must not implicitly absorb arbitrary host-focusable descendants.
  - id: D-COLLECTION-FOCUS-ROVING-RELATIONSHIP-0001-B
    text:
      zh-CN: Focus Roving 可以消费 Collection，但不得被定义为强依赖 Collection。
      en: Focus Roving may consume Collection but must not be defined as strictly depending on Collection.
  - id: D-COLLECTION-FOCUS-ROVING-RELATIONSHIP-0001-C
    text:
      zh-CN: Collection 不得拥有 selection、active item、keyboard policy 或 a11y pattern；这些必须由消费方协议或其他模块负责。
      en: Collection must not own selection, active item, keyboard policy, or a11y pattern semantics; those must be owned by consuming protocols or other modules.
