id: D-AS-HOOK-STATE-HANDLE-NAMING-0001
type: decision
title: asHook state handles are named by state declarations
status: draft
since: 0.1.0
summary: asHook state handle projection should use stable names declared by state definitions, should not infer names from expose.state, and should preserve nested asHook result structure instead of flattening nested state handles.
statement:
  zh-CN: >-
    asHook result 中用于 prototype composition 的 state handles 应由 state declaration 自身的稳定 state name 命名，而不是从 `expose.state` 的 expose name 反推。`expose.state` 定义 App Maker 面向的 external state surface，不参与 asHook state handle identity。asHook 自动返回的 `stateHandles` 只覆盖当前 asHook setup frame 直接声明的 state handles；嵌套调用的 asHook 应保留自己的 result 结构，由外层 asHook 显式返回、封装或重命名，而不得被运行时自动摊平到外层 `stateHandles` 中。state declaration 必须提供非空字符串 name；同一 setup frame 内不得声明多个同名 state。官方 JS/TS 原型应优先使用 identifier-safe name，但长期 portable authoring 的基础要求仍是稳定字符串。


  en: >-
    State handles used for prototype composition in an asHook result should be named by the stable state name declared by the state declaration itself, not inferred from the expose name passed to `expose.state`. `expose.state` defines the App Maker-facing external state surface and must not participate in asHook state handle identity. Automatically returned `stateHandles` from an asHook cover only state handles directly declared in the current asHook setup frame; nested asHooks keep their own result structures and may be explicitly returned, wrapped, or renamed by the outer asHook, but must not be runtime-flattened into the outer `stateHandles`. A state declaration must provide a non-empty string name, and the same setup frame must not declare multiple states with the same name. Official JS/TS prototypes should prefer identifier-safe names, while the portable authoring baseline remains a stable string.


criteria:
  - id: D-AS-HOOK-STATE-HANDLE-NAMING-0001-A
    text:
      zh-CN: state declaration 的 stable state name 是 asHook named state handle 的身份来源。
      en: The stable state name declared by a state declaration is the identity source for named asHook state handles.
  - id: D-AS-HOOK-STATE-HANDLE-NAMING-0001-B
    text:
      zh-CN: '`expose.state` 的 expose name 不得作为 asHook state handle identity 的来源或覆盖来源。'
      en: The expose name passed to `expose.state` must not be a source of, or override source for, asHook state handle identity.
  - id: D-AS-HOOK-STATE-HANDLE-NAMING-0001-C
    text:
      zh-CN: asHook 自动返回的 `stateHandles` 只包含当前 asHook setup frame 直接声明的 state handles。
      en: Automatically returned `stateHandles` from an asHook include only state handles directly declared in the current asHook setup frame.
  - id: D-AS-HOOK-STATE-HANDLE-NAMING-0001-D
    text:
      zh-CN: 嵌套 asHook 的返回值结构必须保留；嵌套 asHook 的 state handles 不得被运行时自动摊平到外层 asHook 的 `stateHandles`。
      en: Nested asHook result structure must be preserved; nested asHook state handles must not be automatically flattened into the outer asHook's `stateHandles` by runtime.
  - id: D-AS-HOOK-STATE-HANDLE-NAMING-0001-E
    text:
      zh-CN: 所有 state declaration 必须提供非空字符串 name。
      en: Every state declaration must provide a non-empty string name.
  - id: D-AS-HOOK-STATE-HANDLE-NAMING-0001-F
    text:
      zh-CN: 同一 setup frame 内不得声明多个同名 state；重名必须被诊断为错误而不是静默覆盖。
      en: A setup frame must not declare multiple states with the same name; duplicate names must be diagnosed as errors rather than silently overwritten.
  - id: D-AS-HOOK-STATE-HANDLE-NAMING-0001-G
    text:
      zh-CN: 官方 JS/TS 原型应优先使用 identifier-safe state names；portable authoring 的基础要求是稳定非空字符串，并通过 `getState(name)` 支持非 identifier-safe name。
      en: Official JS/TS prototypes should prefer identifier-safe state names; the portable authoring baseline is a stable non-empty string, with non-identifier-safe names supported through `getState(name)`.
  - id: D-AS-HOOK-STATE-HANDLE-NAMING-0001-H
    text:
      zh-CN: state name 应作为 state definition API 的第一个参数；现有 semantic 或其他 state 选项若需要与 name 分离，应进入后续参数或 options。
      en: State name should be the first argument of state definition APIs; existing semantic or other state options that need to differ from name should move to later arguments or options.
openQuestions:
  - id: D-AS-HOOK-STATE-HANDLE-NAMING-0001-Q1
    question:
      zh-CN: 哪些现有 state API 的第一个参数已经可以直接解释为 `name`，哪些 API 需要在新增首位 `name` 后把原 semantic 参数后延或移入 options？
      en: Which current state APIs can interpret their first argument directly as `name`, and which need to shift the existing semantic argument after the new leading `name` or move it into options?
    blocks:
      - state-api-migration
      - as-hook-state-projection
  - id: D-AS-HOOK-STATE-HANDLE-NAMING-0001-Q2
    question:
      zh-CN: 若 state name 与 semantic 分离，web state projection、debug semantic 与 rule identity 应优先使用哪个字段？
      en: If state name and semantic diverge, which field should web state projection, debug semantics, and rule identity prefer?
    blocks:
      - state-api-migration
      - web-state-projection
  - id: D-AS-HOOK-STATE-HANDLE-NAMING-0001-Q3
    question:
      zh-CN: 迁移期是否需要临时保留 `expose.state` name fallback，还是应一次性移除现有 expose-key 命名补丁与对应测试？
      en: During migration, should the expose-state name fallback be temporarily retained, or should the current expose-key naming patch and related test be removed in one step?
    blocks:
      - as-hook-state-projection
      - migration-safety
  - id: D-AS-HOOK-STATE-HANDLE-NAMING-0001-Q4
    question:
      zh-CN: 在当前 authored asHook `setup` 只能返回 render function 或 void 的边界下，外层 asHook 应通过什么显式 API 转交、封装或重命名嵌套 asHook result？
      en: Given the current boundary that authored asHook `setup` may return only a render function or void, what explicit API should let an outer asHook forward, wrap, or rename a nested asHook result?
    blocks:
      - nested-as-hook-result-structure
      - as-hook-result-api
