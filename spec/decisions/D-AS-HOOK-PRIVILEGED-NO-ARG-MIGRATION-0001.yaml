revisions:
  - version: 0.1.0
    change: introduced
    summary: Recorded the privileged asHook no-arg migration as an open fracture after narrowing ordinary authored asHook semantics.
  - version: 0.1.1
    change: partially-implemented
    summary: Migrated asFocusable to a no-arg caller with setup-time configuration through the returned FocusableHandle.
  - version: 0.1.2
    change: clarified
    summary: Clarified implementation direction by moving asFocusable and simple handle-backed privileged hooks to once registration with repeated configuration through returned handles.
  - version: 0.1.3
    change: partially-implemented
    summary: Migrated asFocusScope and asFocusRoving to no-arg callers with setup-time configuration through returned handles.
  - version: 0.1.4
    change: partially-implemented
    summary: Migrated asTransition to a no-arg once caller whose returned controls govern runtime transitions.
  - version: 0.1.5
    change: reclassified
    summary: Removed asTransition from privileged governance after ordinary authored asHooks gained stable custom handle projection.
