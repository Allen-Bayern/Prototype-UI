id: D-DEFAULT-ACTION-CONTROL-0001
type: decision
title: Default action control is host-mediated interaction policy
status: draft
since: 0.1.0
summary: Proto UI should model cancellation of host default interaction actions as an internal host-mediated policy capability rather than exposing Web preventDefault directly to prototype authors.
statement:
  zh-CN: >-
    Proto UI 应将取消宿主默认交互动作建模为内部 host-mediated interaction policy。原型和基础模块可以在 activation、roving focus、focus trap 等语义中请求取消默认动作，但不应直接依赖 Web `preventDefault()`。Adapter 负责通过 host capability 将该请求投射到具体宿主机制。


  en: >-
    Proto UI should model cancellation of host default interaction actions as an internal host-mediated interaction policy. Prototypes and foundation modules may request default-action cancellation for semantics such as activation, roving focus, and focus traps, but should not directly depend on Web `preventDefault()`. Adapters are responsible for projecting the request through host capabilities to concrete host mechanisms.


criteria:
  - id: D-DEFAULT-ACTION-CONTROL-0001-A
    text:
      zh-CN: default action control 必须与 boundary classification 分离。
      en: Default action control must stay separate from boundary classification.
  - id: D-DEFAULT-ACTION-CONTROL-0001-B
    text:
      zh-CN: '`preventDefault()` 不得作为新的 prototype author API 暴露；v0 初始实现应由 trigger、focus roving、focus scope 等基础能力内部消费。'
      en: '`preventDefault()` must not be exposed as a new prototype-author API; the initial v0 implementation should be consumed internally by foundation capabilities such as trigger, focus roving, and focus scope.'
  - id: D-DEFAULT-ACTION-CONTROL-0001-C
    text:
      zh-CN: 事件 payload 应提供宿主无关的 default-action request 方法，并由 adapter/host-cap 负责投射。
      en: Event payloads should provide a host-independent default-action request method, with adapters/host-caps responsible for projection.
  - id: D-DEFAULT-ACTION-CONTROL-0001-D
    text:
      zh-CN: 集合型键盘导航中的方向键、Home、End 默认动作控制应由 focus roving 或其基础行为承担，而不是由每个 trigger/item 原型重复实现。
      en: Default-action control for arrow, Home, and End keyboard navigation in composite collections should be owned by focus roving or its foundation behavior rather than repeated in every trigger/item prototype.
