id: D-STATE-SEMANTIC-ACCESSORS-DEPRECATION-0001
type: decision
title: State semantic accessors are deprecated
status: active
since: 0.1.0
summary: '`def.state.fromInteraction` and `def.state.fromAccessibility` are deprecated compatibility accessors and should be removed in the 0.2 or 0.3 line after cataloged prototypes migrate to protocol-owned state handles.'
statement:
  zh-CN: >-
    `def.state.fromInteraction(name)` 与 `def.state.fromAccessibility(name)` 在 0.1 中进入 deprecated 状态。它们曾用于提供同一 interaction/accessibility semantic slot 的 shared borrowed view，但 asHook 已能稳定返回 named state handles 后，styled prototype 与下游组合原型应优先消费协议 asHook 返回的 state handles，而不是重新通过 state semantic accessor 获取同一事实。具体协议的 truth source 必须由拥有该语义的原型或 privileged asHook 维护；accessibility state 应作为语义投影，而不是自动成为 value 或 validation 状态的默认拥有者。v0 小版本不承诺互相兼容，因此这些 API 可以在 0.2 或 0.3 彻底移除；0.1 期间暂时保留实现以避免未编目原型被迫同步迁移。


  en: >-
    `def.state.fromInteraction(name)` and `def.state.fromAccessibility(name)` are deprecated in 0.1. They previously provided shared borrowed views for interaction/accessibility semantic slots, but now that asHook can reliably return named state handles, styled prototypes and downstream composition prototypes should prefer protocol asHook state handles instead of reacquiring the same facts through state semantic accessors. The truth source of a protocol fact must be maintained by the owning prototype or privileged asHook; accessibility state should be a semantic projection, not the default owner of value or validation state. v0 minor versions do not promise compatibility, so these APIs may be fully removed in the 0.2 or 0.3 line; the 0.1 implementation remains temporarily to avoid forcing uncataloged prototypes to migrate immediately.


criteria:
  - id: D-STATE-SEMANTIC-ACCESSORS-DEPRECATION-0001-A
    text:
      zh-CN: >-
        `def.state.fromInteraction` 与 `def.state.fromAccessibility` 不再是新原型或 styled prototype 消费协议状态的推荐入口。


      en: >-
        `def.state.fromInteraction` and `def.state.fromAccessibility` are no longer the recommended entry points for new prototypes or styled prototypes to consume protocol state.


  - id: D-STATE-SEMANTIC-ACCESSORS-DEPRECATION-0001-B
    text:
      zh-CN: 下游 styled prototype 应优先消费对应 protocol asHook 返回的 named state handles。
      en: Downstream styled prototypes should prefer named state handles returned by the corresponding protocol asHook.
  - id: D-STATE-SEMANTIC-ACCESSORS-DEPRECATION-0001-C
    text:
      zh-CN: 具体协议拥有的 value、validation、selection、focus 或 interaction facts 必须由该协议原型或对应 privileged domain 维护 truth source。
      en: Value, validation, selection, focus, or interaction facts owned by a concrete protocol must have their truth source maintained by that protocol prototype or by the corresponding privileged domain.
  - id: D-STATE-SEMANTIC-ACCESSORS-DEPRECATION-0001-D
    text:
      zh-CN: accessibility state accessor 不得被新实现用作 checked、expanded、invalid 等具体协议状态的默认 truth source；a11y 应消费协议状态并投影语义。
      en: The accessibility state accessor must not be used by new implementations as the default truth source for concrete protocol states such as checked, expanded, or invalid; a11y should consume protocol state and project semantics.
  - id: D-STATE-SEMANTIC-ACCESSORS-DEPRECATION-0001-E
    text:
      zh-CN: 0.1 期间可以保留 deprecated API 的实现与兼容测试；0.2 或 0.3 可以直接 remove。
      en: The deprecated API implementation and compatibility tests may remain during 0.1; the APIs may be removed directly in 0.2 or 0.3.
