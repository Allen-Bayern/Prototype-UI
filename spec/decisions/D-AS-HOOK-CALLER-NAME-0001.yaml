id: D-AS-HOOK-CALLER-NAME-0001
type: decision
title: asHook caller binding name validation remains tooling debt
status: draft
since: 0.1.0
summary: asHook prototype spec names use prototype naming rules, while author-facing caller bindings should be asXxx; validating that binding shape requires tooling rather than runtime name checks.
statement:
  zh-CN: >-
    `defineAsHook({ name })` 中的 `name` 是 prototype spec name，应该遵守 prototype name 规则；作者实际调用的函数绑定则应呈现为 `asXxx`。运行时无法可靠知道返回的 caller 被赋值给了哪个变量，因此 `asXxx` caller binding 的检查需要由 lint、CLI、生成器或 TypeScript tooling 承担，而不是简单在 `defineAsHook` 中检查 `spec.name`。


  en: >-
    The `name` in `defineAsHook({ name })` is the prototype spec name and should follow prototype name rules, while the author-facing function binding should appear as `asXxx`. Runtime cannot reliably know which variable the returned caller was assigned to, so validating the `asXxx` caller binding should belong to lint, CLI, generator, or TypeScript tooling rather than a simple `spec.name` check inside `defineAsHook`.


explains:
  contracts:
    - C-AS-HOOK-0003
