id: D-PROTOTYPE-ENTITY-NAMING-0001
type: decision
title: Prototype contract entities use singleton P-prefixed protocol identities
status: draft
since: 0.1.0
summary: Prototype-level contract catalog entries use the singleton `P-{PROTOCOL}` entity family, while statically named JS/TS authoring entries use `*.proto.*` declaration files as the machine-discoverable catalog boundary.
statement:
  zh-CN: >-
    第一轮原型编目中，prototype-level contract entity 使用 `P-{PROTOCOL}` 标识，例如 `P-BASE-BUTTON`。一个 `P-*` 实体描述一个稳定 prototype protocol，并且同一原型协议默认只有一个 P 实体，不使用 `0001` 序号拆分。direct prototype form、authored asHook form 或其他官方 authoring entry 可以作为该实体的多个 authoring entries 记录。具有静态 protocol name 的 JS/TS authoring entry 必须位于 `*.proto.*` 文件中，使 CI 能自动发现声明并核对 P/T 编目；普通 helper、共享逻辑和动态命名的 prototype factory 保持普通源码文件。该后缀只是普通 JS/TS 的文件分类，不引入定制语法。


  en: >-
    In the first prototype cataloging pass, prototype-level contract entities use the `P-{PROTOCOL}` identifier family, such as `P-BASE-BUTTON`. A `P-*` entity describes one stable prototype protocol, and each prototype protocol has one P entity by default rather than `0001`-sequenced splits. Direct prototype forms, authored asHook forms, or other official authoring entries for the same protocol may be recorded as multiple authoring entries of that entity. A statically named JS/TS authoring entry must live in a `*.proto.*` file so CI can discover the declaration and check its P/T catalog coverage automatically; ordinary helpers, shared logic, and dynamically named prototype factories remain ordinary source files. The suffix classifies normal JS/TS files and introduces no custom syntax.


criteria:
  - id: D-PROTOTYPE-ENTITY-NAMING-0001-A
    text:
      zh-CN: 'Prototype contract entities 必须使用 `P-*` 前缀，而不是复用 `C-*` 核心契约前缀。'
      en: 'Prototype contract entities must use the `P-*` prefix instead of reusing the `C-*` core-contract prefix.'
  - id: D-PROTOTYPE-ENTITY-NAMING-0001-B
    text:
      zh-CN: '一个 `P-*` 实体描述一个 prototype protocol；它不得仅表示某个源码文件、包导出名或宿主 adapter 产物。'
      en: 'A `P-*` entity describes one prototype protocol; it must not merely represent one source file, package export name, or host-adapter artifact.'
  - id: D-PROTOTYPE-ENTITY-NAMING-0001-C
    text:
      zh-CN: '同一 prototype protocol 默认只允许一个 P 实体，并应使用 `P-{PROTOCOL}` 形态，例如 `P-BASE-BUTTON`；不得使用 `P-BASE-BUTTON-0001` 作为首选形态。'
      en: 'One prototype protocol should have one P entity by default and should use the `P-{PROTOCOL}` shape, such as `P-BASE-BUTTON`; `P-BASE-BUTTON-0001` must not be the preferred shape.'
  - id: D-PROTOTYPE-ENTITY-NAMING-0001-D
    text:
      zh-CN: '当 direct prototype 与 authored asHook 共享同一协议面时，必须在同一个 `P-*` 实体中记录为不同 authoring entries。'
      en: 'When a direct prototype and an authored asHook share the same protocol surface, they must be recorded as distinct authoring entries in the same `P-*` entity.'
  - id: D-PROTOTYPE-ENTITY-NAMING-0001-E
    text:
      zh-CN: '`P-*` 实体对核心能力的使用应通过 `dependsOn.contracts` 指向已有 `C-*` 契约，而不是在原型实体中重新定义核心能力。'
      en: 'A `P-*` entity should point to existing `C-*` contracts through `dependsOn.contracts` for core capabilities instead of redefining those capabilities inside the prototype entity.'
  - id: D-PROTOTYPE-ENTITY-NAMING-0001-F
    text:
      zh-CN: '在 `packages/prototypes/*/src` 中，具有静态 `name` 的 `definePrototype` 或 `defineAsHook` authoring entry 必须位于 `*.proto.ts`、`*.proto.js` 或对应 module/JSX 变体中；此后缀不改变源码语言或执行语义。'
      en: 'Under `packages/prototypes/*/src`, a `definePrototype` or `defineAsHook` authoring entry with a static `name` must live in `*.proto.ts`, `*.proto.js`, or the corresponding module/JSX variant; this suffix does not change the source language or execution semantics.'
  - id: D-PROTOTYPE-ENTITY-NAMING-0001-G
    text:
      zh-CN: '普通 helper、shared logic 与接受动态 protocol name 的 prototype factory 不得仅因内部调用声明 API 就被伪装成具体 `*.proto.*` 实体声明文件。'
      en: 'Ordinary helpers, shared logic, and prototype factories that accept dynamic protocol names must not be presented as concrete `*.proto.*` entity declaration files merely because they call declaration APIs internally.'
  - id: D-PROTOTYPE-ENTITY-NAMING-0001-H
    text:
      zh-CN: 'CI 必须自动发现原型库源码中的静态 authoring entries，并双向校验文件后缀、同库 P 实体 source 与 P→T 关系；已知未编目项只能进入显式 debt baseline，baseline 必须随编目完成而缩减。'
      en: 'CI must automatically discover static authoring entries in prototype-library sources and check the filename suffix, same-library P-entity source, and P-to-T relation in both directions; known uncataloged entries may only remain in an explicit debt baseline, which must shrink as cataloging completes.'
