id: D-RULE-CONTEXT-PATH-0001
type: decision
title: Rule context path access remains implementation debt
status: draft
since: 0.1.0
summary: Rule currently supports whole context value dependencies through `w.ctx(key)`; static context path access is deferred.
statement:
  zh-CN: >-
    Rule 当前只将 `w.ctx(key)` 作为 context whole-value dependency 对待。旧草案中的 `w.ctx(key).path(...)` 静态 path 访问尚未实现，因此不得被视为稳定 v0 core 语义。

  en: >-
    Rule currently treats only `w.ctx(key)` as a whole-value context dependency. Static path access from older drafts, such as `w.ctx(key).path(...)`, is not implemented and must not be treated as stable v0 core semantics.

explains:
  contracts:
    - C-RULE-WHEN-0002
