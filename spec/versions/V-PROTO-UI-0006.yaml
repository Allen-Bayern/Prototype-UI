id: V-PROTO-UI-0006
type: version
title: Proto UI 0.2.0-rc.6
status: active
since: 0.2.0-rc.6
summary: Sixth globally exact release candidate stabilizing Shadcn Switch geometry, Dialog composition and focus, component-local preset authoring, and shared Web adapter conformance.
statement:
  en: Proto UI 0.2.0-rc.6 is one ecosystem release identity shared exactly by every public @proto.ui package and the corresponding immutable spec snapshot.
  zh-CN: Proto UI 0.2.0-rc.6 是由全部公开 @proto.ui package 与对应不可变 spec snapshot 精确共享的一次生态发行身份。
release:
  version: 0.2.0-rc.6
  channel: prerelease
  gitTag: v0.2.0-rc.6
  npmDistTag: next
  packageVersionPolicy: exact
  packageScope: public-@proto.ui
  publishedAt: 2026-07-26T04:13:02Z
  commit: e4243850e0d9ad0dce3e9d6e099ca70bc2df0b27
  specSnapshotDigest: sha256:ccec6ecd79b276f67eac15ae3d4e153dc03f2e2ae975498b20dd4aa6e6d28a13
dependsOn:
  decisions:
    - D-GLOBAL-RELEASE-VERSION-0001
criteria:
  - id: V-PROTO-UI-0006-DRAFT-BOUNDARY
    text:
      en: The draft entity may govern aligned rc.6 package manifests, release assets, and catalog references, but it must not claim npm, Git tag, GitHub Release, or immutable snapshot evidence.
      zh-CN: 本 draft 实体可以治理已对齐的 rc.6 package manifest、发行物料与 catalog 引用，但不得声称已存在 npm、Git tag、GitHub Release 或不可变 snapshot 证据。
  - id: V-PROTO-UI-0006-IDENTITY
    text:
      en: Before publication, VERSION, every public @proto.ui package manifest, staged internal dependency versions, and the spec snapshot must be prepared at 0.2.0-rc.6 exactly.
      zh-CN: 发布前，VERSION、全部公开 @proto.ui package manifest、暂存发布包的内部依赖版本以及 spec snapshot 必须统一准备为 0.2.0-rc.6。
  - id: V-PROTO-UI-0006-PUBLICATION
    text:
      en: The entity may become active only after npm publication, the v0.2.0-rc.6 Git tag, and snapshot digest evidence all exist.
      zh-CN: 仅当 npm 发布、v0.2.0-rc.6 Git tag 与 snapshot digest 证据均存在后，本实体才可转为 active。
