id: V-PROTO-UI-0005
type: version
title: Proto UI 0.2.0-rc.5
status: draft
since: 0.2.0-rc.5
summary: Draft release train fixing Dialog default CloseIcon context initialization and Switch checked-state Thumb movement after external rc.4 trials.
statement:
  en: Proto UI 0.2.0-rc.5 is one reviewed draft ecosystem release identity shared exactly by every public @proto.ui package and the corresponding staged spec snapshot. It does not claim npm, Git tag, GitHub Release, or immutable snapshot evidence before publication.
  zh-CN: Proto UI 0.2.0-rc.5 是由全部公开 @proto.ui package 与对应暂存 spec snapshot 精确共享、处于评审阶段的一次生态发行身份；发布前不声称已存在 npm、Git tag、GitHub Release 或不可变 snapshot 证据。
release:
  version: 0.2.0-rc.5
  channel: prerelease
  gitTag: v0.2.0-rc.5
  npmDistTag: next
  packageVersionPolicy: exact
  packageScope: public-@proto.ui
dependsOn:
  decisions:
    - D-GLOBAL-RELEASE-VERSION-0001
criteria:
  - id: V-PROTO-UI-0005-DRAFT-BOUNDARY
    text:
      en: The draft entity may govern aligned rc.5 package manifests, release assets, and catalog references, but it must not claim npm, Git tag, GitHub Release, or immutable snapshot evidence.
      zh-CN: 本 draft 实体可以治理已对齐的 rc.5 package manifest、发行物料与 catalog 引用，但不得声称已存在 npm、Git tag、GitHub Release 或不可变 snapshot 证据。
  - id: V-PROTO-UI-0005-IDENTITY
    text:
      en: Before publication, VERSION, every public @proto.ui package manifest, staged internal dependency versions, and the spec snapshot must be prepared at 0.2.0-rc.5 exactly.
      zh-CN: 发布前，VERSION、全部公开 @proto.ui package manifest、暂存发布包的内部依赖版本以及 spec snapshot 必须统一准备为 0.2.0-rc.5。
  - id: V-PROTO-UI-0005-PUBLICATION
    text:
      en: The entity may become active only after npm publication, the v0.2.0-rc.5 Git tag, and snapshot digest evidence all exist.
      zh-CN: 仅当 npm 发布、v0.2.0-rc.5 Git tag 与 snapshot digest 证据均存在后，本实体才可转为 active。
sources:
  - path: internal/releases/0.2.0-rc.5/package-bom.json
  - path: internal/releases/0.2.0-rc.5/release-notes.md
  - path: internal/releases/0.2.0-rc.5/release-notes.zh-CN.md
openQuestions: []
revisions:
  - version: 0.2.0-rc.5
    change: introduced
    summary: Opened the full draft rc.5 release train with aligned package manifests and reviewed release assets while keeping publication evidence pending.
tags:
  - release
  - prerelease
  - global-version
  - draft
