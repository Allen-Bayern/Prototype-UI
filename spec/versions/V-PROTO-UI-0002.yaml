    - D-GLOBAL-RELEASE-VERSION-0001
criteria:
  - id: V-PROTO-UI-0002-IDENTITY
    text:
      en: VERSION, every public @proto.ui package manifest, staged internal dependency versions, and the spec snapshot use 0.2.0-rc.1 exactly.
      zh-CN: VERSION、全部公开 @proto.ui package manifest、暂存发布包的内部依赖版本以及 spec snapshot 均精确使用 0.2.0-rc.1。
