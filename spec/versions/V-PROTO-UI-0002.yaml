    text:
      en: The entity may become active only after npm publication, the v0.2.0-rc.1 Git tag, and snapshot digest evidence all exist.
      zh-CN: 仅当 npm 发布、v0.2.0-rc.1 Git tag 与 snapshot digest 证据均存在后，本实体才可转为 active。
