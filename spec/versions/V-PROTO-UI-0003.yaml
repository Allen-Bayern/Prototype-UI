id: V-PROTO-UI-0003
type: version
title: Proto UI 0.2.0-rc.3
status: active
since: 0.2.0-rc.3
summary: Third globally exact release candidate with runtime, styling, composition, and component-preset improvements collected after external rc.1 trials.
statement:
  en: Proto UI 0.2.0-rc.3 is one ecosystem release identity shared exactly by every public @proto.ui package and the corresponding immutable spec snapshot.
  zh-CN: Proto UI 0.2.0-rc.3 是由全部公开 @proto.ui package 与对应不可变 spec snapshot 精确共享的一次生态发行身份。
release:
  version: 0.2.0-rc.3
  channel: prerelease
  gitTag: v0.2.0-rc.3
  npmDistTag: next
  packageVersionPolicy: exact
  packageScope: public-@proto.ui
  publishedAt: 2026-07-22T13:28:12Z
  commit: 21d9f6b6b43108d2d5616b546d7c0f9180eec274
  specSnapshotDigest: sha256:a7b0a99b3071ef53d55933265ce0bb6c47d2d9e913fea0ee1ee00f83d5db6c2d
dependsOn:
  decisions:
    - D-GLOBAL-RELEASE-VERSION-0001
criteria:
  - id: V-PROTO-UI-0003-DRAFT-BOUNDARY
    text:
      en: The draft entity may govern aligned rc.3 package manifests, release assets, and catalog references, but it must not claim npm, Git tag, GitHub Release, or immutable snapshot evidence.
      zh-CN: 本 draft 实体可以治理已对齐的 rc.3 package manifest、发行物料与 catalog 引用，但不得声称已存在 npm、Git tag、GitHub Release 或不可变 snapshot 证据。
  - id: V-PROTO-UI-0003-IDENTITY
    text:
      en: Before publication, VERSION, every public @proto.ui package manifest, staged internal dependency versions, and the spec snapshot must be prepared at 0.2.0-rc.3 exactly.
      zh-CN: 发布前，VERSION、全部公开 @proto.ui package manifest、暂存发布包的内部依赖版本以及 spec snapshot 必须统一准备为 0.2.0-rc.3。
  - id: V-PROTO-UI-0003-PUBLICATION
    text:
      en: The entity may become active only after npm publication, the v0.2.0-rc.3 Git tag, and snapshot digest evidence all exist.
      zh-CN: 仅当 npm 发布、v0.2.0-rc.3 Git tag 与 snapshot digest 证据均存在后，本实体才可转为 active。
sources:
  - path: internal/releases/0.2.0-rc.3/package-bom.json
  - path: internal/releases/0.2.0-rc.3/release-notes.md
  - path: internal/releases/0.2.0-rc.3/release-notes.zh-CN.md
openQuestions: []
revisions:
  - version: 0.2.0-rc.3
    change: introduced
    summary: Declared the draft rc.3 catalog identity without starting package iteration or publication.
  - version: 0.2.0-rc.3
    change: revised
    summary: Opened the full rc.3 release train by aligning package manifests and reviewed release assets while keeping publication evidence pending.
  - version: 0.2.0-rc.3
    change: updated
    summary: Activated after publishing all 37 packages, the Git tag, GitHub prerelease, and immutable spec snapshot evidence.
