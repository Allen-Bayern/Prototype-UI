id: P-BASE-SELECT-VALUE
type: prototype
title: Base Select Value is a render-consumed committed-value display
status: draft
since: 0.2.0
summary: Value is a non-interactive display part that renders Root-owned selected text or an author placeholder and establishes the value-class anatomy precedent.
statement:
  zh-CN: Select Value 是 Select family 中至多一个的 value-class display part。它从同域 Context 派生 displayValue：优先显示 Root-owned selected text，其次显示 committed raw value，未选择时显示 placeholder。Value 可以触发自身 renderer refresh，但不得成为 selection owner、event target、focus target 或独立 accessible control。
  en: Select Value is the optional, at-most-one value-class display part in the Select family. It derives displayValue from same-domain Context, preferring Root-owned selected text, then the committed raw value, and showing placeholder when unselected. Value may request its own renderer refresh but must not become a selection owner, event target, focus target, or independent accessible control.
criteria:
  - id: P-BASE-SELECT-VALUE-ROLE
    text:
      zh-CN: Value 只能作为 committed Select value 的可见回显，不得表示 popup active option、可编辑 input 或自治 value control。
      en: Value may only visibly reflect the committed Select value and must not represent the popup active option, an editable input, or an autonomous value control.
  - id: P-BASE-SELECT-VALUE-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-select-value` 与 `asSelectValue` 必须是同一 Value protocol 的 authoring entries。'
      en: '`base-select-value` and `asSelectValue` must be authoring entries for the same Value protocol.'
  - id: P-BASE-SELECT-VALUE-CONTEXT
    text:
      zh-CN: Value 必须从同域 Select Context 订阅 committed value 与 textValue，不得复制 Root props、读取 host DOM 或消费 popup activeValue 作为显示真相。
      en: Value must subscribe to committed value and textValue from same-domain Select Context and must not copy Root props, read host DOM, or consume popup activeValue as display truth.
  - id: P-BASE-SELECT-VALUE-FALLBACK
    text:
      zh-CN: displayValue 必须按 textValue、raw value、placeholder、空内容的顺序回退；placeholder prop 更新必须立即刷新尚未选择的 Value。
      en: displayValue must fall back in textValue, raw value, placeholder, then empty-content order; updating placeholder must immediately refresh an unselected Value.
  - id: P-BASE-SELECT-VALUE-RENDER-REFRESH
    text:
      zh-CN: displayValue 变化必须通过 prototype-owned `run.update()` 刷新 renderer-consumed children；宿主 App 不应被要求重复渲染同一 selected text。
      en: A displayValue change must refresh renderer-consumed children through prototype-owned `run.update()`; the host App must not be required to render the same selected text again.
  - id: P-BASE-SELECT-VALUE-DERIVED-EXPOSE
    text:
      zh-CN: Value 必须 expose 只读语义上的 displayValue state，供 styled prototype 与验证读取；该 state 不得反向写入 Root value。
      en: Value must expose a semantically read-only displayValue state for styled prototypes and verification; that state must not write back to Root value.
  - id: P-BASE-SELECT-VALUE-NO-INTERACTION
    text:
      zh-CN: Value 不得安装 Trigger、Focusable、activation route 或 outward event，也不得成为独立 accessible control；它必须对 pointer hit testing 透明，确保嵌套于 Trigger 时由 Trigger 接收完整表面的指针激活。
      en: Value must not install Trigger, Focusable, activation routes, or outward events, and must not become an independent accessible control; it must be transparent to pointer hit testing so a containing Trigger receives pointer activation across its complete surface.
  - id: P-BASE-SELECT-VALUE-VALUE-CLASS-PRECEDENT
    text:
      zh-CN: Value-class part 的核心边界是“消费 owner fact 并拥有回显刷新”，而不是“拥有 input value”；未来 Input 等组件若兼具输入所有权，必须另行编目该差异。
      en: The core boundary of a value-class part is consuming owner facts and owning display refresh, not owning an input value; future components such as Input that also own input must catalog that distinction separately.
