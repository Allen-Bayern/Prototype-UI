id: P-SHADCN-HOVER-CARD-TRIGGER
type: prototype
title: Shadcn Hover Card Trigger inherits Base preview intent and adds link-like styling
status: draft
since: 0.2.0
summary: Shadcn Hover Card Trigger inherits Base hover and focus preview intent without activation semantics and adds the current link-like and state-driven surface.
statement:
  zh-CN: >-
    Shadcn Hover Card Trigger 是 `P-BASE-HOVER-CARD-TRIGGER` 之上的 direct anatomy part，保留 hover/focus preview intent、disabled gating 与无 activation 语义，并增加当前链接式 surface、hover underline、focus ring 与 disabled feedback。固定 upstream Trigger 不提供这些视觉 tokens；`asChild` 明确不提供。


  en: >-
    Shadcn Hover Card Trigger is a direct anatomy part over `P-BASE-HOVER-CARD-TRIGGER`. It retains hover and focus preview intent, disabled gating, and the absence of activation semantics while adding the current link-like surface, hover underline, focus ring, and disabled feedback. The pinned upstream Trigger supplies none of these visual tokens; `asChild` is explicitly unavailable.


criteria:
  - id: P-SHADCN-HOVER-CARD-TRIGGER-UPSTREAM-IDENTITY
    text:
      zh-CN: Trigger 必须沿用固定 Hover Card revision/path，并明确为非官方 Proto UI anatomy projection。
      en: Trigger must use the pinned Hover Card revision and path and identify itself as an unofficial Proto UI anatomy projection.
  - id: P-SHADCN-HOVER-CARD-TRIGGER-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-hover-card-trigger` 必须继承 `P-BASE-HOVER-CARD-TRIGGER` 并调用 `asHoverCardTrigger()`；任何负向补丁必须显式声明。'
      en: '`shadcn-hover-card-trigger` must inherit `P-BASE-HOVER-CARD-TRIGGER` and call `asHoverCardTrigger()`; any negative patch must be declared explicitly.'
    references:
      prototypes:
        - id: P-BASE-HOVER-CARD-TRIGGER
          anchors:
            [
              P-BASE-HOVER-CARD-TRIGGER-AUTHORING-ENTRIES,
              P-BASE-HOVER-CARD-TRIGGER-INTERACTION,
              P-BASE-HOVER-CARD-TRIGGER-NO-ACTIVATION,
            ]
  - id: P-SHADCN-HOVER-CARD-TRIGGER-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited hover/focus intent、disabled gating 或无 activation guarantee；新增 rules 仅构成视觉增量。
      en: The current implementation reverses no inherited hover or focus intent, disabled gating, or no-activation guarantee; added rules are visual deltas only.
  - id: P-SHADCN-HOVER-CARD-TRIGGER-DIRECT-ENTRY
    text:
      zh-CN: 当前 Trigger protocol 以 `shadcn-hover-card-trigger` direct prototype 公开。
      en: The current Trigger protocol is exposed as the `shadcn-hover-card-trigger` direct prototype.
  - id: P-SHADCN-HOVER-CARD-TRIGGER-CURRENT-VISUAL-SURFACE
    text:
      zh-CN: Trigger 必须提供当前 inline、cursor、typography、underline-offset 与 outline tokens。
      en: Trigger must provide the current inline, cursor, typography, underline-offset, and outline tokens.
  - id: P-SHADCN-HOVER-CARD-TRIGGER-STATE-DRIVEN-STYLES
    text:
      zh-CN: underline、focus ring 与 disabled feedback 必须分别从 inherited hovered、focusVisible 与 disabled state 派生。
      en: Underline, focus-ring, and disabled feedback must derive from inherited hovered, focusVisible, and disabled state respectively.
  - id: P-SHADCN-HOVER-CARD-TRIGGER-COMPATIBILITY-SUBSET
    text:
      zh-CN: 已测试行为与 surface 之外的全部差异必须集中在唯一 compatibility open question。
      en: Every difference beyond tested behavior and surface must be centralized in one compatibility open question.
  - id: P-SHADCN-HOVER-CARD-TRIGGER-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Trigger props 中的 `asChild` 依共享决策有意省略。
      en: The `asChild` member of upstream Trigger props is intentionally omitted under the shared decision.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
openQuestions:
  - id: P-SHADCN-HOVER-CARD-TRIGGER-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: Trigger 的元素/API forwarding 与额外链接式 surface 应如何定位？
      en: How should Trigger element and API forwarding and its extra link-like surface be positioned?
    context:
      zh-CN: >-
        intentional deviation 是省略 `asChild`。upstream 只转发 Radix Trigger props 并添加 data-slot，无默认 className；当前实现增加 cursor、font、underline hover、focus ring 与 disabled visuals。className/native props、data-slot 和当前额外视觉是否长期保留均待评审。


      en: >-
        The intentional deviation is omission of `asChild`. Upstream only forwards Radix Trigger props and adds data-slot, with no default className; the current implementation adds cursor, font, hover underline, focus ring, and disabled visuals. ClassName and native props, data-slot, and whether the extra visuals remain are pending review.


    blocks: [shadcn hover card trigger parity roadmap]
