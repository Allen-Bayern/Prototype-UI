id: P-BRUTALIST-SCROLL-AREA-THUMB
type: prototype
title: Brutalist Scroll Area Thumb projects foreground feedback
status: draft
since: 0.2.0-rc.7
summary: Brutalist Thumb inherits the feedback-only Base part and adds a square foreground fill without claiming drag behavior.
statement:
  zh-CN: Brutalist Thumb 是 composed Scrollbar 内的直角前景反馈面。它继承 Base Thumb 的无独立行为边界；`flex-1` 只是当前视觉占位，不构成精确 thumb geometry 或 drag guarantee。
  en: Brutalist Thumb is a square foreground feedback surface inside a composed Scrollbar. It inherits the Base Thumb no-independent-behavior boundary; `flex-1` is only the current visual placeholder and does not constitute an exact thumb-geometry or drag guarantee.
criteria:
  - id: P-BRUTALIST-SCROLL-AREA-THUMB-BASE-INHERITANCE
    text:
      zh-CN: Thumb 必须通过 `asScrollAreaThumb()` 继承 Base anatomy identity 与 feedback-only boundary。
      en: Thumb must inherit Base anatomy identity and the feedback-only boundary through `asScrollAreaThumb()`.
  - id: P-BRUTALIST-SCROLL-AREA-THUMB-SURFACE
    text:
      zh-CN: Thumb 必须投射 `relative flex-1 rounded-none bg-foreground`，不得把该样式声明解释为 host geometry 或 pointer interaction ownership。
      en: Thumb must project `relative flex-1 rounded-none bg-foreground`; this style declaration must not be interpreted as ownership of host geometry or pointer interaction.
sources:
  - path: packages/prototypes/brutalist/src/scroll-area/thumb.proto.ts
dependsOn:
  contracts: [C-AS-HOOK-0001, C-RULE-INTENT-FEEDBACK-STYLE-0001]
inherits:
  prototypes:
    - id: P-BASE-SCROLL-AREA-THUMB
verifies: { tests: [T-BRUTALIST-SCROLL-AREA-0001] }
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Cataloged the square foreground Thumb feedback surface and explicit no-drag guarantee.
tags: [prototype, brutalist, scroll-area, thumb, feedback-only, visual]
