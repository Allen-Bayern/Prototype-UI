id: P-BRUTALIST-SCROLL-AREA-THUMB
type: prototype
title: Brutalist Scroll Area Thumb projects foreground feedback
status: draft
since: 0.2.0-rc.7
summary: Brutalist Thumb inherits host-projected passive geometry and adds a square foreground fill without claiming drag behavior.
statement:
  zh-CN: Brutalist Thumb 是 composed Scrollbar 内的直角前景反馈面。它继承 Base Thumb 的无独立行为边界，尺寸与位移由家族级 host session 连续投射，不声明 drag guarantee。
  en: Brutalist Thumb is a square foreground feedback surface inside a composed Scrollbar. It inherits the Base Thumb no-independent-behavior boundary, receives continuous size and offset projection from the family-level host session, and makes no drag guarantee.
criteria:
  - id: P-BRUTALIST-SCROLL-AREA-THUMB-BASE-INHERITANCE
    text:
      zh-CN: Thumb 必须通过 `asScrollAreaThumb()` 继承 Base anatomy identity 与 feedback-only boundary。
      en: Thumb must inherit Base anatomy identity and the feedback-only boundary through `asScrollAreaThumb()`.
  - id: P-BRUTALIST-SCROLL-AREA-THUMB-SURFACE
    text:
      zh-CN: Thumb 必须投射 `relative h-full w-full rounded-none bg-foreground` 作为交叉轴填充，并允许 host session 通过专用 CSS variables/transform 覆盖主轴 geometry；该样式不取得 pointer interaction ownership。
      en: Thumb must project `relative h-full w-full rounded-none bg-foreground` for cross-axis fill and allow the host session to override primary-axis geometry through dedicated CSS variables and transform; this styling does not acquire pointer-interaction ownership.
sources:
  - path: packages/prototypes/brutalist/src/scroll-area/thumb.proto.ts
dependsOn:
  contracts: [C-AS-HOOK-0001, C-RULE-INTENT-FEEDBACK-STYLE-0001]
inherits:
  prototypes:
    - id: P-BASE-SCROLL-AREA-THUMB
verifies: { tests: [T-BRUTALIST-SCROLL-AREA-0001] }
revisions:
  - version: 0.2.0-rc.7
    change: revised
    summary: Replaced the full-track flex placeholder with host-projected passive Thumb geometry.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Cataloged the square foreground Thumb feedback surface and explicit no-drag guarantee.
tags: [prototype, brutalist, scroll-area, thumb, feedback-only, visual]
