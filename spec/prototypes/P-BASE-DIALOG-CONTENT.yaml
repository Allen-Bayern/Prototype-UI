revisions:
  - version: 0.2.0
    change: introduced
    summary: Cataloged Dialog Content semantics and lifecycle.
  - version: 0.2.1
    change: refined
    summary: Clarified that alert mode is owned by Root context.
tags: [prototype, base, dialog, content, accessibility]
