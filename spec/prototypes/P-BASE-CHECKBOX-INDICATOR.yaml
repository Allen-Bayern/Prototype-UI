id: P-BASE-CHECKBOX-INDICATOR
type: prototype
title: Base Checkbox Indicator is a context-driven checkbox indicator
status: draft
since: 0.1.0
summary: Base Checkbox Indicator is the optional and repeatable indicator part of Base Checkbox. It claims the Checkbox indicator anatomy role, consumes Checkbox context to reflect root checked and indeterminate state visually, and does not own checked value, mixed display state, activation, focus, accessibility control, form, or event semantics.
statement:
  zh-CN: >-
    Base Checkbox Indicator 是 Base Checkbox anatomy family 中可选且可重复的 indicator part。`base-checkbox-indicator` direct prototype 与 `asCheckboxIndicator` authored asHook 是同一 Checkbox indicator protocol 的两个 authoring entries。Indicator 通过 Checkbox context 读取或订阅 root 提供的 checked、indeterminate 与 disabled 信息，将其作为派生展示状态使用；它不拥有 checked input value，不拥有 indeterminate mixed display state，不处理 activation，不作为 event target，也不发出 outward signal。


  en: >-
    Base Checkbox Indicator is the optional and repeatable indicator part in the Base Checkbox anatomy family. The `base-checkbox-indicator` direct prototype and the `asCheckboxIndicator` authored asHook are two authoring entries of the same Checkbox indicator protocol. Indicator reads or subscribes to checked, indeterminate, and disabled information provided by the root through Checkbox context and uses it as derived display state; it does not own checked input value, own indeterminate mixed display state, process activation, act as an event target, or emit outward signals.


criteria:
  - id: P-BASE-CHECKBOX-INDICATOR-ROLE-INDICATOR
    text:
      zh-CN: Checkbox Indicator 只能作为 Checkbox root state 的 visual indicator；它不是 input control、value control 或 command control。
      en: Checkbox Indicator may only be a visual indicator for Checkbox root state; it is not an input control, value control, or command control.
    dependsOn:
      contracts:
        - C-ANATOMY-0008
      knowledge:
        - K-COMPONENT-INTERACTION-0001
    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-INDICATOR-ROLE
  - id: P-BASE-CHECKBOX-INDICATOR-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-checkbox-indicator` direct prototype 与 `asCheckboxIndicator` authored asHook 是同一 Checkbox indicator protocol 的两个 authoring entries。'
      en: 'The `base-checkbox-indicator` direct prototype and the `asCheckboxIndicator` authored asHook are two authoring entries of the same Checkbox indicator protocol.'
    dependsOn:
      contracts:
        - C-CORE-SYNTAX-0003
        - C-AS-HOOK-0001
      decisions:
        - D-PROTOTYPE-ENTITY-NAMING-0001
  - id: P-BASE-CHECKBOX-INDICATOR-PROTOCOL-DEPENDENCY
    text:
      zh-CN: Checkbox Indicator 的语义成立依赖 `P-BASE-CHECKBOX` 定义的 Checkbox anatomy family 与 Checkbox context；它不得脱离 Checkbox root 自行定义 checkbox 语义。
      en: Checkbox Indicator semantics depend on the Checkbox anatomy family and Checkbox context defined by `P-BASE-CHECKBOX`; it must not define checkbox semantics independently from Checkbox root.
    dependsOn:
      prototypes:
        - P-BASE-CHECKBOX
  - id: P-BASE-CHECKBOX-INDICATOR-CLAIM-ROLE
    text:
      zh-CN: Checkbox Indicator 必须 claim `base-checkbox` anatomy family 的 `indicator` role。
      en: Checkbox Indicator must claim the `indicator` role in the `base-checkbox` anatomy family.
    dependsOn:
      contracts:
        - C-ANATOMY-0004
        - C-ANATOMY-0005
    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-FAMILY-ROLES
            - P-BASE-CHECKBOX-INDICATOR-CARDINALITY
  - id: P-BASE-CHECKBOX-INDICATOR-SAME-DOMAIN
    text:
      zh-CN: Checkbox Indicator 必须解析到同一 Checkbox domain 中的 Checkbox root；跨 Checkbox domain 的 root state 不得被读取或展示。
      en: Checkbox Indicator must resolve to the Checkbox root in the same Checkbox domain; root state from another Checkbox domain must not be read or displayed.
    dependsOn:
      contracts:
        - C-ANATOMY-0005
        - C-CONTEXT-0002
    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-ROOT-DOMAIN-ANCHOR
            - P-BASE-CHECKBOX-ROOT-CONTAINS-INDICATOR
  - id: P-BASE-CHECKBOX-INDICATOR-CONTEXT-SUBSCRIBE
    text:
      zh-CN: Checkbox Indicator 必须通过 Checkbox context 读取或订阅 root state；不得通过复制 root props、读取 host DOM 状态或依赖 root exposed state 作为主通路。
      en: Checkbox Indicator must read or subscribe to root state through Checkbox context; it must not use copied root props, host DOM state, or root exposed state as its primary channel.
    dependsOn:
      contracts:
        - C-CONTEXT-0006
        - C-CONTEXT-0007
      prototypes:
        - P-BASE-CHECKBOX
    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-CONTEXT-KEY
            - P-BASE-CHECKBOX-PART-CONTEXT-CONSUME
  - id: P-BASE-CHECKBOX-INDICATOR-CONTEXT-REQUIRED
    text:
      zh-CN: Checkbox context 是 Checkbox Indicator 的必需依赖；setup 期间若无法解析同域 Checkbox context，Indicator 不得静默创建自治 checked 或 indeterminate state。
      en: Checkbox context is a required dependency for Checkbox Indicator; if same-domain Checkbox context cannot be resolved during setup, Indicator must not silently create autonomous checked or indeterminate state.
    dependsOn:
      contracts:
        - C-CONTEXT-0006
        - C-STATE-0001
    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-CONTEXT-VALUE
  - id: P-BASE-CHECKBOX-INDICATOR-DERIVED-CHECKED
    text:
      zh-CN: Checkbox Indicator 可以 expose 或提供派生的 `checked` display state，但该 state 必须来源于 Checkbox context，且不得成为 checked input value 的 source of truth。
      en: Checkbox Indicator may expose or provide derived `checked` display state, but that state must come from Checkbox context and must not become the source of truth for checked input value.
    dependsOn:
      contracts:
        - C-CONTEXT-0007
        - C-EXPOSE-STATE-0001
        - C-STATE-0001
    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-CHECKED-EXPOSE
            - P-BASE-CHECKBOX-CONTEXT-SYNC
  - id: P-BASE-CHECKBOX-INDICATOR-DERIVED-INDETERMINATE
    text:
      zh-CN: Checkbox Indicator 可以 expose 或提供派生的 `indeterminate` display state，但该 state 必须来源于 Checkbox context，且不得成为 mixed display state 的 source of truth。
      en: Checkbox Indicator may expose or provide derived `indeterminate` display state, but that state must come from Checkbox context and must not become the source of truth for mixed display state.
    dependsOn:
      contracts:
        - C-CONTEXT-0007
        - C-EXPOSE-STATE-0001
        - C-STATE-0001
    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-INDETERMINATE-STATE
            - P-BASE-CHECKBOX-CONTEXT-SYNC
  - id: P-BASE-CHECKBOX-INDICATOR-DERIVED-DISABLED
    text:
      zh-CN: Checkbox Indicator 可以读取 `disabled` 作为派生展示状态；disabled 不赋予 Indicator 独立的交互 gating 责任，因为 Indicator 不处理 activation。
      en: Checkbox Indicator may read `disabled` as derived display state; disabled does not give Indicator independent interaction gating responsibility because Indicator does not process activation.
    dependsOn:
      contracts:
        - C-CONTEXT-0007
        - C-STATE-INTERACTION-0001
    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-CONTEXT-VALUE
            - P-BASE-CHECKBOX-DISABLED-SUPPRESS-ACTIVATION
  - id: P-BASE-CHECKBOX-INDICATOR-NO-VALUE-OWNER
    text:
      zh-CN: Checkbox Indicator 不得接受 `checked`、`defaultChecked` 或 checked value-change callback props，也不得发出 `checkedChange`。
      en: Checkbox Indicator must not accept `checked`, `defaultChecked`, or checked value-change callback props, and must not emit `checkedChange`.
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-EXPOSE-EVENT-0001
    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-PROP-CHECKED
            - P-BASE-CHECKBOX-PROP-DEFAULT-CHECKED
            - P-BASE-CHECKBOX-CHECKED-CHANGE-SIGNAL
  - id: P-BASE-CHECKBOX-INDICATOR-NO-INDETERMINATE-OWNER
    text:
      zh-CN: Checkbox Indicator 不得接受 `indeterminate`、`defaultIndeterminate` 或 indeterminate-change callback props，也不得成为 mixed display state 的 owner。
      en: Checkbox Indicator must not accept `indeterminate`, `defaultIndeterminate`, or indeterminate-change callback props, and must not become the owner of mixed display state.
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-STATE-0001
    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-INDETERMINATE-STATE
            - P-BASE-CHECKBOX-INDETERMINATE-AUTHOR-CAPABILITY
  - id: P-BASE-CHECKBOX-INDICATOR-NO-EVENT-TARGET
    text:
      zh-CN: Checkbox Indicator 不得作为独立 event target，不得注册 activation route，也不得使用 Event 通路表达自身行为。
      en: Checkbox Indicator must not act as an independent event target, must not register activation routes, and must not use the Event channel to express its own behavior.
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-EXPOSE-EVENT-0001
    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-TRIGGER-SEMANTICS
  - id: P-BASE-CHECKBOX-INDICATOR-NO-FOCUS-TARGET
    text:
      zh-CN: Checkbox Indicator 不得成为独立 focus target；Checkbox 的焦点责任属于 Checkbox root。
      en: Checkbox Indicator must not become an independent focus target; Checkbox focus responsibility belongs to Checkbox root.
    dependsOn:
      contracts:
        - C-AS-FOCUSABLE-0001
    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-FOCUSABLE
  - id: P-BASE-CHECKBOX-INDICATOR-PRESENTATIONAL-A11Y
    text:
      zh-CN: Checkbox Indicator 不得成为独立 accessible control；它必须作为 root checkbox 语义的呈现结构。
      en: Checkbox Indicator must not become an independent accessible control; it must remain presentational structure for the root checkbox semantics.
    dependsOn:
      contracts:
        - C-A11Y-0001
    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-ACCESSIBLE-ROLE
            - P-BASE-CHECKBOX-A11Y-MIXED
  - id: P-BASE-CHECKBOX-INDICATOR-NO-FORM-INTEGRATION
    text:
      zh-CN: Checkbox Indicator 不参与 Form 联动；任何 form-associated value、hidden input、validation 或提交行为都不得归属于 Indicator。
      en: Checkbox Indicator does not participate in Form integration; any form-associated value, hidden input, validation, or submission behavior must not belong to Indicator.
    dependsOn:
      contracts:
        - C-PROPS-0001
    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-FORM-INTEGRATION-DEFERRED
  - id: P-BASE-CHECKBOX-INDICATOR-NO-VISUAL-VARIANT-CORE
    text:
      zh-CN: Checkbox Indicator core contract 不定义 size、motion、shape、tone、icon glyph 等视觉参数。
      en: Checkbox Indicator core contract does not define visual parameters such as size, motion, shape, tone, or icon glyph.
    dependsOn:
      decisions:
        - D-BASE-PROTOTYPE-INDEPENDENCE-0001
      knowledge:
        - K-DESIGN-TRADEOFF-0001
    references:
      prototypes:
        - id: P-BASE-CHECKBOX
          anchors:
            - P-BASE-CHECKBOX-NO-VISUAL-VARIANT-CORE
