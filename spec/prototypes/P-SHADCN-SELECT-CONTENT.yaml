id: P-SHADCN-SELECT-CONTENT
type: prototype
title: Shadcn Select Content inherits Base listbox overlay and adds position, motion, and surface
status: draft
since: 0.2.0
summary: Shadcn Select Content inherits Base listbox, focus, overlay, presence, position, keyboard, and dismissal behavior and adds a position prop, configured transition, and current surface.
statement:
  zh-CN: Shadcn Select Content 是 `P-BASE-SELECT-CONTENT` 之上的 direct part，保留 listbox a11y、roving focus、overlay/presence、position、keyboard 与 dismiss behavior，增加 position enum、150/100ms Transition 配置及当前 popover animations/surface。`asChild` 明确不提供。
  en: Shadcn Select Content is a direct part over `P-BASE-SELECT-CONTENT`. It retains listbox accessibility, roving focus, overlay and presence, positioning, keyboard, and dismissal behavior while adding a position enum, 150/100ms Transition configuration, and the current popover animations and surface. `asChild` is explicitly unavailable.
criteria:
  - id: P-SHADCN-SELECT-CONTENT-UPSTREAM-IDENTITY
    text:
      {
        zh-CN: Content 必须沿用固定 Select revision/path 并明确其非官方 projection 身份。,
        en: Content must use the pinned Select revision and path and identify its unofficial projection status.,
      }
  - id: P-SHADCN-SELECT-CONTENT-BASE-INHERITANCE
    text:
      {
        zh-CN: '`shadcn-select-content` 必须继承 `P-BASE-SELECT-CONTENT` 并调用 `asSelectContent()`。',
        en: '`shadcn-select-content` must inherit `P-BASE-SELECT-CONTENT` and call `asSelectContent()`.',
      }
    references:
      prototypes:
        - id: P-BASE-SELECT-CONTENT
          anchors:
            [
              P-BASE-SELECT-CONTENT-AUTHORING-ENTRIES,
              P-BASE-SELECT-CONTENT-A11Y,
              P-BASE-SELECT-CONTENT-FOCUS-ROVING,
              P-BASE-SELECT-CONTENT-OVERLAY-PRESENCE,
            ]
  - id: P-SHADCN-SELECT-CONTENT-CURRENT-BASE-DEVIATIONS
    text:
      {
        zh-CN: 当前实现不反转 inherited listbox/focus/overlay/position/keyboard/dismiss guarantee；新增 API、Transition 配置与 styles 是增量。,
        en: The current implementation reverses no inherited listbox,
        focus,
        overlay,
        position,
        keyboard,
        or dismissal guarantee; API,
        Transition configuration,
        and styles are deltas.,
      }
  - id: P-SHADCN-SELECT-CONTENT-DIRECT-ENTRY
    text:
      {
        zh-CN: 当前 Content protocol 以 `shadcn-select-content` direct prototype 公开。,
        en: The current Content protocol is exposed as the `shadcn-select-content` direct prototype.,
      }
  - id: P-SHADCN-SELECT-CONTENT-POSITION-PROP
    text:
      {
        zh-CN: position 接受 item-aligned/popper、默认 item-aligned；当前只保证参数存在，不保证官方 popper conditional projection 已完成。,
        en: Position accepts item-aligned and popper and defaults to item-aligned; the current guarantee covers parameter presence but not completed upstream popper conditional projection.,
      }
  - id: P-SHADCN-SELECT-CONTENT-TRANSITION
    text:
      {
        zh-CN: Content 必须配置 enterDuration=150ms、leaveDuration=100ms 并在 leave 完成前保留 portal surface。,
        en: Content must configure enterDuration=150ms and leaveDuration=100ms and retain the portaled surface until leave completion.,
      }
  - id: P-SHADCN-SELECT-CONTENT-CURRENT-VISUAL-SURFACE
    text:
      {
        zh-CN: Content 必须提供当前 anchor-width/height constraints、overflow、popover、border、padding、shadow、outline 与 duration tokens。,
        en: Content must provide the current anchor-width and height constraints,
        overflow,
        popover,
        border,
        padding,
        shadow,
        outline,
        and duration tokens.,
      }
  - id: P-SHADCN-SELECT-CONTENT-OPEN-AND-SIDE-STYLES
    text:
      {
        zh-CN: enter/leave/side animations 必须从 inherited Transition/open state 与 side prop 派生。,
        en: Enter,
        leave,
        and side animations must derive from inherited Transition and open state and side prop.,
      }
  - id: P-SHADCN-SELECT-CONTENT-COMPATIBILITY-SUBSET
    text:
      {
        zh-CN: 当前保证之外的 Viewport/scroll/position 差异集中在唯一 open question。,
        en: Viewport,
        scroll,
        and position differences beyond current guarantees are centralized in one open question.,
      }
  - id: P-SHADCN-SELECT-CONTENT-AS-CHILD-OMISSION
    text:
      {
        zh-CN: upstream Content props 中的 `asChild` 依共享决策省略。,
        en: Upstream Content `asChild` is omitted under the shared decision.,
      }
    dependsOn: { decisions: [D-AS-CHILD-OMISSION-0001] }
openQuestions:
  - id: P-SHADCN-SELECT-CONTENT-Q-UPSTREAM-DIFFERENCES
    question:
      {
        zh-CN: Content 的 position、Viewport/scroll controls 与 exact motion parity 应如何收敛？,
        en: How should Content position,
        Viewport and scroll controls,
        and exact motion parity converge?,
      }
    context:
      zh-CN: intentional deviation 是省略 `asChild`。upstream 固定 Portal、Viewport、上下 scroll buttons，默认 align=center，并仅在 popper 时使用 side translation 与 trigger size vars；当前没有这些 parts/conditional rules，且总是使用 anchor width、p-1。data-slot、transform-origin、Radix vars、forwarding 与 motion timing 也待核对。
      en: The intentional deviation is omission of `asChild`. Upstream fixes Portal, Viewport, and scroll buttons, defaults align=center, and uses side translation and trigger-size variables only for popper; current code lacks those parts and conditional rules and always uses anchor width and p-1. Data-slot, transform-origin, Radix variables, forwarding, and motion timing also need review.
    blocks: [shadcn select content parity roadmap]
