id: P-SHADCN-DIALOG-HEADER
type: prototype
title: Shadcn Dialog Header is an optional layout-only anatomy part
status: draft
since: 0.2.0-rc.3
summary: Dialog Header groups title and description content without owning interaction behavior.
statement:
  zh-CN: Shadcn Dialog Header 是可选的 `header` anatomy part，只提供 title/description 分组布局与 slot projection，不拥有 event、focus、a11y control 或 dialog state。
  en: Shadcn Dialog Header is an optional `header` anatomy part that provides title and description grouping layout and slot projection without owning events, focus, an accessibility control, or dialog state.
criteria:
  - id: P-SHADCN-DIALOG-HEADER-ANATOMY
    text:
      zh-CN: Header 必须 claim `base-dialog` family 的 `header` role，并被 Content containment 接受。
      en: Header must claim the `header` role in the `base-dialog` family and be accepted by Content containment.
  - id: P-SHADCN-DIALOG-HEADER-LAYOUT-ONLY
    text:
      zh-CN: Header 只能投射 slot 与布局 feedback，不得建立交互或 dialog state truth。
      en: Header may project only its slot and layout feedback and must not establish interaction or dialog-state truth.
sources:
  - path: packages/prototypes/shadcn/src/dialog/header.proto.ts
  - path: packages/prototypes/shadcn/test/dialog.test.ts
dependsOn:
  contracts: [C-ANATOMY-0001, C-RULE-INTENT-FEEDBACK-STYLE-0001]
  prototypes: [P-SHADCN-DIALOG-CONTENT]
verifies: { tests: [T-SHADCN-DIALOG-LAYOUT-0001] }
revisions:
  - version: 0.2.0-rc.3
    change: introduced
    summary: Added the optional layout-only Header part.
tags: [prototype, shadcn, dialog, header, anatomy, layout]
