id: P-SHADCN-DIALOG-TRIGGER
type: prototype
title: Shadcn Dialog Trigger inherits Base command behavior and adds button variants
status: draft
since: 0.2.0-rc.0
summary: Shadcn Dialog Trigger inherits Base open command, disabled gating, request, and accessibility behavior and adds six visual variants and current interaction styling.
statement:
  zh-CN: >-
    Shadcn Dialog Trigger 是 `P-BASE-DIALOG-TRIGGER` 之上的 direct part，保留 command、disabled、open request 与 a11y，并增加六种 button-like `variant`、基础 surface 及 inherited/a11y state-driven feedback。upstream DialogTrigger 本身不提供这些默认 styles；`asChild` 明确不提供。


  en: >-
    Shadcn Dialog Trigger is a direct part over `P-BASE-DIALOG-TRIGGER`. It retains command, disabled, open-request, and accessibility behavior while adding six button-like `variant` values, a base surface, and feedback driven by inherited and accessibility state. Upstream DialogTrigger itself provides no such default styles; `asChild` is explicitly unavailable.


criteria:
  - id: P-SHADCN-DIALOG-TRIGGER-UPSTREAM-IDENTITY
    text:
      {
        zh-CN: Trigger 必须沿用固定 Dialog revision/path 并明确其非官方 projection 身份。,
        en: Trigger must use the pinned Dialog revision and path and identify its unofficial projection status.,
      }
  - id: P-SHADCN-DIALOG-TRIGGER-BASE-INHERITANCE
    text:
      {
        zh-CN: '`shadcn-dialog-trigger` 必须继承 `P-BASE-DIALOG-TRIGGER` 并调用 `asDialogTrigger()`。',
        en: '`shadcn-dialog-trigger` must inherit `P-BASE-DIALOG-TRIGGER` and call `asDialogTrigger()`.',
      }
    references:
      prototypes:
        - id: P-BASE-DIALOG-TRIGGER
          anchors:
            [
              P-BASE-DIALOG-TRIGGER-AUTHORING-ENTRIES,
              P-BASE-DIALOG-TRIGGER-COMMAND,
              P-BASE-DIALOG-TRIGGER-REQUEST,
              P-BASE-DIALOG-TRIGGER-A11Y,
            ]
  - id: P-SHADCN-DIALOG-TRIGGER-CURRENT-BASE-DEVIATIONS
    text:
      {
        zh-CN: 当前实现不反转 inherited command、disabled、request 或 a11y guarantee；props/styles 是视觉增量。,
        en: The current implementation reverses no inherited command,
        disabled,
        request,
        or accessibility guarantee; props and styles are visual deltas.,
      }
  - id: P-SHADCN-DIALOG-TRIGGER-DIRECT-ENTRY
    text:
      {
        zh-CN: 当前 Trigger protocol 以 `shadcn-dialog-trigger` direct prototype 公开。,
        en: The current Trigger protocol is exposed as the `shadcn-dialog-trigger` direct prototype.,
      }
  - id: P-SHADCN-DIALOG-TRIGGER-VARIANT-PROP
    text:
      {
        zh-CN: variant 必须提供 default/destructive/outline/secondary/ghost/link、默认 default，并投射对应 surface。,
        en: Variant must provide default,
        destructive,
        outline,
        secondary,
        ghost,
        and link,
        default to default,
        and project the corresponding surface.,
      }
  - id: P-SHADCN-DIALOG-TRIGGER-CURRENT-VISUAL-SURFACE
    text:
      {
        zh-CN: Trigger 必须提供当前 compact button layout、border、typography、transition 与 outline tokens。,
        en: Trigger must provide the current compact-button layout,
        border,
        typography,
        transition,
        and outline tokens.,
      }
  - id: P-SHADCN-DIALOG-TRIGGER-STATE-DRIVEN-STYLES
    text:
      {
        zh-CN: focusVisible、pressed、hovered、expanded、invalid 与 disabled visuals 必须从 inherited 或 accessibility state 派生。,
        en: FocusVisible,
        pressed,
        hovered,
        expanded,
        invalid,
        and disabled visuals must derive from inherited or accessibility state.,
      }
  - id: P-SHADCN-DIALOG-TRIGGER-COMPATIBILITY-SUBSET
    text:
      {
        zh-CN: 当前 variant/surface 之外的 upstream forwarding 差异集中在唯一 open question。,
        en: Upstream forwarding differences beyond current variants and surface are centralized in one open question.,
      }
  - id: P-SHADCN-DIALOG-TRIGGER-AS-CHILD-OMISSION
    text:
      {
        zh-CN: upstream Trigger props 中的 `asChild` 依共享决策省略。,
        en: Upstream Trigger `asChild` is omitted under the shared decision.,
      }
    dependsOn: { decisions: [D-AS-CHILD-OMISSION-0001] }
openQuestions:
  - id: P-SHADCN-DIALOG-TRIGGER-Q-UPSTREAM-DIFFERENCES
    question:
      {
        zh-CN: Trigger 的 button-like defaults 与 upstream transparent wrapper 应如何定位？,
        en: How should Trigger's button-like defaults relate to the upstream transparent wrapper?,
      }
    context:
      {
        zh-CN: intentional deviation 是省略 `asChild`。upstream 只添加 data-slot 并转发 props；当前六 variant 与 state styles 是额外设计，且未通过继承 `P-SHADCN-BUTTON` 获得。className/native/data-slot forwarding、与 Button visual convention 的同步责任均待评审。,
        en: The intentional deviation is omission of `asChild`. Upstream only adds data-slot and forwards props; current six variants and state styles are extra design and are not inherited from `P-SHADCN-BUTTON`. Forwarding and responsibility for synchronizing Button visual conventions remain under review.,
      }
    blocks: [shadcn dialog trigger parity roadmap]
