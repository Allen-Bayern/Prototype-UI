id: P-BRUTALIST-TABS-CONTENT
type: prototype
title: Brutalist Tabs Content inherits Base Tabs Content and layers a hard-shadowed panel
status: draft
since: 0.2.0-rc.7
summary: >-
  Brutalist Tabs Content inherits Base Tabs Content reveal semantics and projects a style-family panel surface: a square bordered panel with a hard offset shadow, hidden via the `hidden` token when its tab is not active.

statement:
  en: >-
    Brutalist Tabs Content is a draft Proto UI-maintained Neo-Brutalist design-language projection over Base Tabs Content. It preserves inherited Base protocol semantics (the hidden handle driven by tab activation) and adds only visual/style behavior: a square bordered panel with a hard zero-blur offset shadow, flat theme-token fill, and a hidden-state guard that collapses the panel when `hidden` is true.

  zh-CN: >-
    Brutalist Tabs Content 是 Proto UI 维护的 draft Neo-Brutalist design-language 投射，建立在 Base Tabs Content 之上。它保留继承的 Base 协议语义（由 tab 激活驱动的 hidden handle），仅增加视觉/style 行为：带零模糊硬偏移阴影的直角边框面板、平面主题 token 填充，以及 `hidden` 为 true 时折叠面板的 hidden-state 守卫。

criteria:
  - id: P-BRUTALIST-TABS-CONTENT-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Tabs Content through `asTabsContent()` once and must not redefine Base tab activation or mounting/portal protocol semantics. Visual projection may only consume the projected `hidden` handle.

      zh-CN: >-
        该 prototype 必须通过 `asTabsContent()` 一次性继承 Base Tabs Content，不得重定义 Base 的 tab 激活或挂载/portal 协议语义；视觉投射只能消费投影出的 `hidden` handle。

  - id: P-BRUTALIST-TABS-CONTENT-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-tabs-content` and is the only public Tabs Content entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-tabs-content`，且是本 foundation 切片中唯一公开的 Tabs Content 入口。
  - id: P-BRUTALIST-TABS-CONTENT-HIDDEN-STATE
    text:
      en: >-
        When `hidden` is true the content must collapse entirely by applying the `hidden` token (display: none) as a single rule; no partial-content or off-screen hiding is permitted. When `hidden` is false the panel surface is fully rendered with its content exposed.

      zh-CN: >-
        当 `hidden` 为 true 时 content 必须通过单一规则应用 `hidden` token（display: none）完全折叠；不允许部分内容隐藏或离屏隐藏。当 `hidden` 为 false 时面板表面随内容完全渲染。

  - id: P-BRUTALIST-TABS-CONTENT-VISUAL-GRAMMAR
    text:
      en: >-
        The panel surface must preserve square `rounded-none` corners, a black structural `border-2 border-black`, a hard zero-blur offset shadow (`shadow-[3px_3px_0_0_#000]` via BRUTALIST_PANEL_TOKENS), and a flat `bg-secondary-background` fill with `text-foreground`, over a `block w-full min-h-28 p-4 text-sm` block. No gradients, glass, rounded cards, or soft elevation.

      zh-CN: >-
        面板表面必须保持直角 `rounded-none`、黑色结构边框 `border-2 border-black`、零模糊硬偏移阴影（经 BRUTALIST_PANEL_TOKENS 的 `shadow-[3px_3px_0_0_#000]`）与平面 `bg-secondary-background` 填充及 `text-foreground`，承于 `block w-full min-h-28 p-4 text-sm` 块之上。不得使用渐变、玻璃拟态、圆角卡片或柔和高度阴影。

