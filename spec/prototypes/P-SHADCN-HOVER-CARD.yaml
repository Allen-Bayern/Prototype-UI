id: P-SHADCN-HOVER-CARD
type: prototype
title: Shadcn Hover Card Root inherits Base ownership and adds its current host layout
status: draft
since: 0.2.0-rc.0
summary: Shadcn Hover Card Root is an unofficial projection that inherits Base link-preview ownership, delays, open state, and family context and adds the current root host layout.
statement:
  zh-CN: >-
    Shadcn Hover Card Root 是 `P-BASE-HOVER-CARD` 之上的 direct prototype，保留 link-preview open ownership、controlled/uncontrolled state、delays、interaction intent、context 与 anatomy，并增加当前 Root host 的 layout tokens。比较基线固定到 shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc` 的 v4 new-york Hover Card；官方 Root 不提供可见 surface，当前 host layout 属于 Proto UI 投射差异。


  en: >-
    Shadcn Hover Card Root is a direct prototype over `P-BASE-HOVER-CARD`. It retains link-preview open ownership, controlled and uncontrolled state, delays, interaction intent, context, and anatomy while adding the current Root host layout tokens. Its comparison baseline is the v4 new-york Hover Card at shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc`; upstream Root has no visible surface, so the current host layout is a Proto UI projection difference.


criteria:
  - id: P-SHADCN-HOVER-CARD-UPSTREAM-IDENTITY
    text:
      zh-CN: Root 必须标记为 Proto UI 维护的非官方衍生实现并固定 upstream revision/path，不主张上游所有权或认证。
      en: Root must identify itself as an unofficial Proto UI-maintained derivative and pin its upstream revision and path without claiming upstream ownership or endorsement.
  - id: P-SHADCN-HOVER-CARD-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-hover-card-root` 必须继承 `P-BASE-HOVER-CARD` 并调用 `asHoverCardRoot()`；任何 setup-only 负向补丁必须显式声明。'
      en: '`shadcn-hover-card-root` must inherit `P-BASE-HOVER-CARD` and call `asHoverCardRoot()`; any setup-only negative patch must be declared explicitly.'
    references:
      prototypes:
        - id: P-BASE-HOVER-CARD
          anchors:
            [
              P-BASE-HOVER-CARD-AUTHORING-ENTRIES,
              P-BASE-HOVER-CARD-ROOT-OWNER,
              P-BASE-HOVER-CARD-INTERACTION-INTENT,
            ]
  - id: P-SHADCN-HOVER-CARD-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited open ownership、delays、context、interaction intent 或 anatomy guarantee；新增 tokens 仅构成 host layout 增量。
      en: The current implementation reverses no inherited open-ownership, delay, context, interaction-intent, or anatomy guarantee; added tokens are host-layout deltas only.
  - id: P-SHADCN-HOVER-CARD-DIRECT-ENTRY
    text:
      zh-CN: 当前 Root protocol 以 `shadcn-hover-card-root` direct prototype 公开。
      en: The current Root protocol is exposed as the `shadcn-hover-card-root` direct prototype.
  - id: P-SHADCN-HOVER-CARD-CURRENT-VISUAL-SURFACE
    text:
      zh-CN: Root 必须提供当前 relative、inline-flex 与 items-start host tokens；该 surface 不表示 upstream Root 产生同类 DOM 或布局。
      en: Root must provide the current relative, inline-flex, and items-start host tokens; this surface does not imply that upstream Root produces equivalent DOM or layout.
  - id: P-SHADCN-HOVER-CARD-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已测试的 inherited family behavior 与 host layout；全部 upstream 差异集中在唯一 compatibility open question。
      en: This entity claims only tested inherited family behavior and host layout; all upstream differences are centralized in one compatibility open question.
openQuestions:
  - id: P-SHADCN-HOVER-CARD-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: Root 的 host projection、open API 与 upstream parity 应如何收敛？
      en: How should Root host projection, open API, and upstream parity converge?
    context:
      zh-CN: >-
        upstream Root 直接转发 Radix props，仅添加 data-slot，不提供 className 或可见布局；当前 Proto Root 是 `relative inline-flex items-start` host。待评审项还包括 `onOpenChange` 相对 `openChange` signal、disabled 扩展、data-slot 和其他 prop forwarding。Root 没有 upstream `asChild`，因此本实体不引用省略决策。


      en: >-
        Upstream Root forwards Radix props and adds only data-slot, with no className or visible layout; the current Proto Root is a `relative inline-flex items-start` host. Review gaps also include `onOpenChange` versus the `openChange` signal, the disabled extension, data-slot, and other prop forwarding. Root has no upstream `asChild`, so this entity does not reference the omission decision.


    blocks: [shadcn hover card root parity roadmap]
sources:
  - path: packages/prototypes/shadcn/src/hover-card/root.proto.ts
  - path: packages/prototypes/shadcn/src/hover-card/types.ts
