id: P-SHADCN-DIALOG-TITLE
type: prototype
title: Shadcn Dialog Title inherits Base labeling and adds current heading typography
status: draft
since: 0.2.0
summary: Shadcn Dialog Title inherits Base dialog-label semantics without behavior and adds the current heading typography surface.
statement:
  zh-CN: Shadcn Dialog Title 是 `P-BASE-DIALOG-TITLE` 之上的 direct part，继续作为 Content 的 accessible label 且不拥有行为，并增加当前 heading typography。其 `definePrototype<Props, Exposes>` 类型参数保持 props-first 顺序；`asChild` 明确不提供。
  en: Shadcn Dialog Title is a direct part over `P-BASE-DIALOG-TITLE`. It remains the accessible label for Content and owns no behavior while adding the current heading typography. Its `definePrototype<Props, Exposes>` type arguments retain props-first order; `asChild` is explicitly unavailable.
criteria:
  - id: P-SHADCN-DIALOG-TITLE-UPSTREAM-IDENTITY
    text:
      {
        zh-CN: Title 必须沿用固定 Dialog revision/path 并明确其非官方 projection 身份。,
        en: Title must use the pinned Dialog revision and path and identify its unofficial projection status.,
      }
  - id: P-SHADCN-DIALOG-TITLE-BASE-INHERITANCE
    text:
      {
        zh-CN: '`shadcn-dialog-title` 必须继承 `P-BASE-DIALOG-TITLE` 并调用 `asDialogTitle()`，不增加行为语义。',
        en: '`shadcn-dialog-title` must inherit `P-BASE-DIALOG-TITLE` and call `asDialogTitle()` without adding behavioral semantics.',
      }
    references:
      prototypes:
        - id: P-BASE-DIALOG-TITLE
          anchors:
            [
              P-BASE-DIALOG-TITLE-AUTHORING-ENTRIES,
              P-BASE-DIALOG-TITLE-LABEL,
              P-BASE-DIALOG-TITLE-NO-BEHAVIOR,
            ]
  - id: P-SHADCN-DIALOG-TITLE-DIRECT-ENTRY
    text:
      {
        zh-CN: 当前 Title protocol 以 `shadcn-dialog-title` direct prototype 公开，并保持 Props/Exposes 泛型顺序正确。,
        en: The current Title protocol is exposed as `shadcn-dialog-title` and keeps the Props and Exposes generic order correct.,
      }
  - id: P-SHADCN-DIALOG-TITLE-CURRENT-VISUAL-SURFACE
    text:
      {
        zh-CN: Title 必须提供 text-lg、font-semibold、leading-none 与 tracking-tight tokens。,
        en: Title must provide text-lg,
        font-semibold,
        leading-none,
        and tracking-tight tokens.,
      }
  - id: P-SHADCN-DIALOG-TITLE-COMPATIBILITY-SUBSET
    text:
      {
        zh-CN: typography 与 forwarding 差异集中在唯一 open question。,
        en: Typography and forwarding differences are centralized in one open question.,
      }
  - id: P-SHADCN-DIALOG-TITLE-AS-CHILD-OMISSION
    text:
      {
        zh-CN: upstream Title props 中的 `asChild` 依共享决策省略。,
        en: Upstream Title `asChild` is omitted under the shared decision.,
      }
    dependsOn: { decisions: [D-AS-CHILD-OMISSION-0001] }
openQuestions:
  - id: P-SHADCN-DIALOG-TITLE-Q-UPSTREAM-DIFFERENCES
    question:
      {
        zh-CN: Title exact typography 与 forwarding parity 应如何收敛？,
        en: How should exact Title typography and forwarding parity converge?,
      }
    context:
      {
        zh-CN: intentional deviation 是省略 `asChild`。upstream 使用 text-lg leading-none font-semibold；当前额外 tracking-tight，且缺 className/native/data-slot forwarding。,
        en: The intentional deviation is omission of `asChild`. Upstream uses text-lg,
        leading-none,
        and font-semibold; current code adds tracking-tight and lacks className,
        native,
        and data-slot forwarding.,
      }
    blocks: [shadcn dialog title parity roadmap]
sources:
  - path: packages/prototypes/shadcn/src/dialog/title.proto.ts
  - path: packages/prototypes/shadcn/test/dialog.test.ts
  - path: https://github.com/shadcn-ui/ui/blob/f31ed81983653919dd4fe77aee4b4859f610f1dc/apps/v4/registry/new-york-v4/ui/dialog.tsx
    label: shadcn/ui v4 new-york DialogTitle pinned baseline
dependsOn:
  contracts: [C-AS-HOOK-0001, C-RULE-INTENT-FEEDBACK-STYLE-0001]
  decisions: [D-PROTOTYPE-ENTITY-NAMING-0001, D-AS-CHILD-OMISSION-0001]
  prototypes: [P-SHADCN-DIALOG-CONTENT]
inherits:
  prototypes:
    [
      {
        id: P-BASE-DIALOG-TITLE,
        note: Default inherited dialog-label protocol; no behavior reversal is declared.,
      },
    ]
verifies: { tests: [T-SHADCN-DIALOG-TITLE-0001] }
revisions:
  [
    {
      version: 0.2.0,
      change: introduced,
      summary: Introduced Shadcn Dialog Title cataloging with Base labeling,
      corrected generic order,
      typography,
      and bounded parity.,
    },
  ]
tags: [prototype, shadcn, dialog, title, upstream-derived, delta, compatibility]
