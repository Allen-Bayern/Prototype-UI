id: P-BRUTALIST-TOGGLE
type: prototype
title: Brutalist Toggle inherits Base Toggle and layers a square active-control surface
status: draft
since: 0.2.0-rc.7
summary: >-
  Brutalist Toggle inherits Base Toggle interaction semantics and projects a style-family visual API: a constrained size enum, square geometry, hard offset shadows, flat paired fills, and an active accent pair.

statement:
  en: >-
    Brutalist Toggle is a draft Proto UI-maintained Neo-Brutalist design-language projection over Base Toggle. It preserves inherited Base protocol semantics (active/defaultActive/disabled) and adds only visual/style behavior: zero radius, black structural borders, hard offset shadows, a `default | sm | lg` size enum, and a main accent pair when active.

  zh-CN: >-
    Brutalist Toggle 是 Proto UI 维护的 draft Neo-Brutalist design-language 投射，建立在 Base Toggle 之上。它保留继承的 Base 协议语义（active/defaultActive/disabled），仅增加视觉/style 行为：零圆角、黑色结构边框、硬偏移阴影、`default | sm | lg` size 枚举，以及 active 时的 main 强调色对。

criteria:
  - id: P-BRUTALIST-TOGGLE-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Toggle through `asToggle()` once and must not redefine Base active, press, hover, focus, or disabled protocol semantics. Visual projection may only consume the projected state handles.

      zh-CN: >-
        该 prototype 必须通过 `asToggle()` 一次性继承 Base Toggle，不得重定义 Base 的 active、press、hover、focus 或 disabled 协议语义；视觉投射只能消费投影出的 state handles。

  - id: P-BRUTALIST-TOGGLE-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-toggle`.
      zh-CN: 直接 prototype 入口名为 `brutalist-toggle`。
  - id: P-BRUTALIST-TOGGLE-SIZE-PROP
    text:
      en: Public `size` is the enum `default | sm | lg` with default `default`, mapping to distinct height/min-width/padding/typography tokens.
      zh-CN: 公开 `size` 为枚举 `default | sm | lg`，默认 `default`，对应不同的高度/最小宽度/内边距/排版 token。
  - id: P-BRUTALIST-TOGGLE-DEFAULTS
    text:
      en: >-
        When `size`, `defaultActive`, or `disabled` are omitted or removed after mount, the prototype must restore `default`, `false`, and `false` respectively.

      zh-CN: >-
        当 `size`、`defaultActive` 或 `disabled` 缺省或在挂载后被移除时，prototype 必须分别恢复为 `default`、`false` 与 `false`。

  - id: P-BRUTALIST-TOGGLE-PAIR-INVARIANT
    text:
      en: >-
        The active fill must co-select its foreground: active uses `bg-main` with `text-main-foreground`. No rule may replace the active fill's foreground with a theme-global text token independently of its background.

      zh-CN: >-
        active 填充必须同时选择其前景：active 使用 `bg-main` 与 `text-main-foreground`。任何规则都不得在脱离背景的情况下用主题全局文本 token 覆盖 active 填充前景。

  - id: P-BRUTALIST-TOGGLE-INTERACTION
    text:
      en: >-
        Hover (while not active) lifts the control. Press translates into the shadow axis and clears the shadow. Focus-visible applies a hard ring with offset. Disabled reduces emphasis with `opacity-50` and `pointer-events-none` while preserving geometry.

      zh-CN: >-
        Hover（非 active 时）抬升控件。Press 沿阴影轴压入并清除阴影。Focus-visible 使用带 offset 的硬 ring。Disabled 以 `opacity-50` 与 `pointer-events-none` 降低强调，同时保留几何。

  - id: P-BRUTALIST-TOGGLE-VISUAL-GRAMMAR
    text:
      en: >-
        The visual surface must preserve square corners, black structural borders, hard zero-blur offset shadows, and flat theme-token fills without gradients, glass, rounded cards, or soft elevation.

      zh-CN: >-
        视觉表面必须保持直角、黑色结构边框、零模糊硬偏移阴影和平面主题 token 填充，不得使用渐变、玻璃拟态、圆角卡片或柔和高度阴影。

