id: P-SHADCN-TABS-LIST
type: prototype
title: Shadcn Tabs List inherits Base Tabs List and adds the current collection surface
status: draft
since: 0.2.0-rc.0
summary: Shadcn Tabs List inherits Base collection, roving-focus, orientation, and accessibility behavior and adds its currently implemented list surface.
statement:
  zh-CN: >-
    Shadcn Tabs List 是 `P-BASE-TABS-LIST` 之上的 direct anatomy part，保留同域 collection、roving focus、keyboard navigation、orientation 与 tablist a11y，并增加当前 list surface。固定 upstream 的 `variant` 与方向感知样式尚未进入 passing API；`asChild` 明确不提供。


  en: >-
    Shadcn Tabs List is a direct anatomy part over `P-BASE-TABS-LIST`. It retains same-domain collection, roving focus, keyboard navigation, orientation, and tablist accessibility while adding the current list surface. The pinned upstream `variant` and orientation-aware styles are not yet part of the passing API; `asChild` is explicitly unavailable.


criteria:
  - id: P-SHADCN-TABS-LIST-UPSTREAM-IDENTITY
    text:
      zh-CN: List 必须沿用固定 Shadcn Tabs revision/path，并明确为 Proto UI 治理的非官方 anatomy projection。
      en: List must use the pinned Shadcn Tabs revision and path and identify itself as an unofficial Proto UI-governed anatomy projection.
  - id: P-SHADCN-TABS-LIST-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-tabs-list` 必须继承 `P-BASE-TABS-LIST` 并调用 `asTabsList()`；任何 setup-only 负向补丁必须显式声明。'
      en: '`shadcn-tabs-list` must inherit `P-BASE-TABS-LIST` and call `asTabsList()`; any setup-only negative patch must be declared explicitly.'
    references:
      prototypes:
        - id: P-BASE-TABS-LIST
          anchors:
            [
              P-BASE-TABS-LIST-AUTHORING-ENTRIES,
              P-BASE-TABS-LIST-ROLE-COLLECTION,
              P-BASE-TABS-LIST-FOCUS-ROVING,
            ]
  - id: P-SHADCN-TABS-LIST-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited collection、context、focus、keyboard 或 a11y guarantee；新增 tokens 仅构成视觉增量。
      en: The current implementation reverses no inherited collection, context, focus, keyboard, or accessibility guarantee; added tokens are visual deltas only.
  - id: P-SHADCN-TABS-LIST-DIRECT-ENTRY
    text:
      zh-CN: 当前 List protocol 以 `shadcn-tabs-list` direct prototype 公开。
      en: The current List protocol is exposed as the `shadcn-tabs-list` direct prototype.
  - id: P-SHADCN-TABS-LIST-CURRENT-VISUAL-SURFACE
    text:
      zh-CN: List 必须提供当前 inline-flex、height、alignment、radius、border、muted surface、padding、text 与 shadow tokens；不得据此宣称 upstream variant parity。
      en: List must provide the current inline-flex, height, alignment, radius, border, muted surface, padding, text, and shadow tokens without claiming upstream variant parity.
  - id: P-SHADCN-TABS-LIST-COMPATIBILITY-SUBSET
    text:
      zh-CN: 已测试的 Base behavior 与当前 surface 之外，所有差异必须集中在唯一 compatibility open question。
      en: Beyond tested Base behavior and the current surface, all differences must be centralized in one compatibility open question.
  - id: P-SHADCN-TABS-LIST-AS-CHILD-OMISSION
    text:
      zh-CN: upstream List props 中的 `asChild` 依共享决策有意省略。
      en: The `asChild` member of upstream List props is intentionally omitted under the shared decision.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
openQuestions:
  - id: P-SHADCN-TABS-LIST-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: List 的 variant、orientation 与 token parity 应如何收敛？
      en: How should List variant, orientation, and token parity converge?
    context:
      zh-CN: >-
        intentional deviation 是省略 `asChild`。upstream 公开 `variant: default | line`，使用 Root orientation group 调整高度/纵向布局，并有 data-slot/data-variant、w-fit、justify、rounded-lg 与 p-[3px]；当前 API 没有 variant，固定 horizontal-style height，并额外使用 border、shadow、rounded-xl 与 bg-muted/80。上述均为待实现或待评审 gap。


      en: >-
        The intentional deviation is omission of `asChild`. Upstream exposes `variant: default | line`, uses the Root orientation group for height and vertical layout, and adds data-slot, data-variant, w-fit, justify, rounded-lg, and p-[3px]; the current API has no variant, fixes a horizontal-style height, and adds border, shadow, rounded-xl, and bg-muted/80. These remain implementation or review gaps.


    blocks: [shadcn tabs list parity roadmap]
sources:
