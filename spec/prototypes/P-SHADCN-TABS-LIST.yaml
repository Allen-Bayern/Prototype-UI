    change: introduced
    summary: Introduced Shadcn Tabs List delta cataloging with Base inheritance, current surface, intentional asChild omission, and variant parity gaps.
tags: [prototype, shadcn, tabs, list, upstream-derived, delta, compatibility, visual]
