  - path: https://github.com/shadcn-ui/ui/blob/f31ed81983653919dd4fe77aee4b4859f610f1dc/apps/v4/registry/new-york-v4/ui/tabs.tsx
    label: shadcn/ui v4 new-york TabsList pinned baseline
dependsOn:
