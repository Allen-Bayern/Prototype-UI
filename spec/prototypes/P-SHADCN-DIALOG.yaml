id: P-SHADCN-DIALOG
type: prototype
title: Shadcn Dialog Root inherits Base modal ownership and adds the current host layout
status: draft
since: 0.2.0-rc.0
summary: Shadcn Dialog Root is an unofficial projection that inherits Base modal open ownership, context, and anatomy and adds the current visible root-host layout.
statement:
  zh-CN: >-
    Shadcn Dialog Root 是 `P-BASE-DIALOG` 之上的 direct prototype，保留 modal window open ownership、controlled/uncontrolled state、context 与 anatomy，并增加当前 Root host 的 relative inline-flex layout。比较基线固定到 shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc` 的 v4 new-york Dialog；upstream Root 不产生同类可见 layout。


  en: >-
    Shadcn Dialog Root is a direct prototype over `P-BASE-DIALOG`. It retains modal-window open ownership, controlled and uncontrolled state, context, and anatomy while adding the current Root host's relative inline-flex layout. Its comparison baseline is the v4 new-york Dialog at shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc`; upstream Root produces no equivalent visible layout.


criteria:
  - id: P-SHADCN-DIALOG-UPSTREAM-IDENTITY
    text:
      {
        zh-CN: Root 必须固定 upstream revision/path 并明确为非官方 Proto UI projection。,
        en: Root must pin the upstream revision and path and identify itself as an unofficial Proto UI projection.,
      }
  - id: P-SHADCN-DIALOG-BASE-INHERITANCE
    text:
      {
        zh-CN: '`shadcn-dialog-root` 必须继承 `P-BASE-DIALOG` 并调用 `asDialogRoot()`；任何 setup-only 负向补丁必须显式声明。',
        en: '`shadcn-dialog-root` must inherit `P-BASE-DIALOG` and call `asDialogRoot()`; any setup-only negative patch must be declared explicitly.',
      }
    references:
      prototypes:
        - id: P-BASE-DIALOG
          anchors:
            [
              P-BASE-DIALOG-AUTHORING-ENTRIES,
              P-BASE-DIALOG-ROLE-MODAL-WINDOW,
              P-BASE-DIALOG-ROOT-OWNER,
              P-BASE-DIALOG-ANATOMY,
            ]
  - id: P-SHADCN-DIALOG-CURRENT-BASE-DEVIATIONS
    text:
      {
        zh-CN: 当前实现不反转 inherited open ownership、controlled state、context 或 anatomy guarantee；新增 host layout 仅为呈现增量。,
        en: The current implementation reverses no inherited open ownership,
        controlled state,
        context,
        or anatomy guarantee; the added host layout is a presentation delta only.,
      }
  - id: P-SHADCN-DIALOG-DIRECT-ENTRY
    text:
      {
        zh-CN: 当前 Root protocol 以 `shadcn-dialog-root` direct prototype 公开。,
        en: The current Root protocol is exposed as the `shadcn-dialog-root` direct prototype.,
      }
  - id: P-SHADCN-DIALOG-CURRENT-VISUAL-SURFACE
    text:
      {
        zh-CN: Root 必须提供 relative、inline-flex 与 items-start tokens，但不得宣称 upstream Root DOM parity。,
        en: Root must provide relative,
        inline-flex,
        and items-start tokens without claiming upstream Root DOM parity.,
      }
  - id: P-SHADCN-DIALOG-COMPATIBILITY-SUBSET
    text:
      {
        zh-CN: 当前 family 只声明 Root、Trigger、Mask、Content、Title、Description、Close；upstream composition 差异集中在唯一 open question。,
        en: The current family claims only Root,
        Trigger,
        Mask,
        Content,
        Title,
        Description,
        and Close; upstream composition differences are centralized in one open question.,
      }
openQuestions:
  - id: P-SHADCN-DIALOG-Q-UPSTREAM-DIFFERENCES
    question:
      {
        zh-CN: Dialog family composition 与 Root API parity 应如何收敛？,
        en: How should Dialog family composition and Root API parity converge?,
      }
    context:
      zh-CN: upstream 还公开 Portal、Header、Footer，Content 内固定组合 Portal、Overlay 与可选内置 Close button；Proto UI 公开独立 Mask/Content/Close。Root 待核对 `onOpenChange` 相对 signal、modal/data-slot/forwarding，以及 visible host layout。Root 无 upstream `asChild`。
      en: Upstream also exposes Portal, Header, and Footer and composes Portal, Overlay, and an optional built-in Close button inside Content; Proto UI exposes separate Mask, Content, and Close parts. Root gaps include callback versus signal, modal, data-slot, forwarding, and visible host layout. Root has no upstream `asChild`.
    blocks: [shadcn dialog parity roadmap]
sources:
  - path: packages/prototypes/shadcn/src/dialog/root.proto.ts
  - path: packages/prototypes/shadcn/test/dialog.test.ts
  - path: https://github.com/shadcn-ui/ui/blob/f31ed81983653919dd4fe77aee4b4859f610f1dc/apps/v4/registry/new-york-v4/ui/dialog.tsx
    label: shadcn/ui v4 new-york Dialog pinned baseline
dependsOn:
  contracts:
    [C-AS-HOOK-0001, C-CORE-SYNTAX-0003, C-CORE-SYNTAX-0007, C-RULE-INTENT-FEEDBACK-STYLE-0001]
  decisions: [D-PROTOTYPE-ENTITY-NAMING-0001]
inherits:
