id: P-BASE-SCROLL-AREA-SCROLLBAR
type: prototype
title: Base Scroll Area Scrollbar is an optional composed control track
status: draft
since: 0.2.0-rc.7
summary: Scrollbar carries orientation and anatomy identity for a composed scroll-control projection without owning the Viewport offset.
statement:
  zh-CN: Scrollbar 是 composed projection 中可选的方向性控制轨道。它公开 vertical/horizontal orientation，但逻辑 offset、extent 与 scrolling 仍由 Viewport 的宿主滚动面拥有；system projection 可以不渲染该 part。
  en: Scrollbar is an optional directional control track in composed projection. It exposes vertical or horizontal orientation, while logical offset, extent, and scrolling remain owned by the Viewport host surface; system projection may omit this part.
criteria:
  - id: P-BASE-SCROLL-AREA-SCROLLBAR-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-scroll-area-scrollbar` 与 `asScrollAreaScrollbar` 必须是同一 Scrollbar protocol 的 direct 与 authored-asHook entries。'
      en: '`base-scroll-area-scrollbar` and `asScrollAreaScrollbar` must be direct and authored-asHook entries for the same Scrollbar protocol.'
  - id: P-BASE-SCROLL-AREA-SCROLLBAR-ORIENTATION
    text:
      zh-CN: Scrollbar 必须接受 `vertical` 或 `horizontal` orientation，缺省为 `vertical`，并 expose 当前 orientation。
      en: Scrollbar must accept vertical or horizontal orientation, default to vertical, and expose the current orientation.
  - id: P-BASE-SCROLL-AREA-SCROLLBAR-NOT-OFFSET-OWNER
    text:
      zh-CN: Scrollbar 不得复制或成为 Viewport scroll offset、extent、scrolling 与 projection 的 source of truth。
      en: Scrollbar must not duplicate or become the source of truth for Viewport scroll offset, extent, scrolling, or projection.
  - id: P-BASE-SCROLL-AREA-SCROLLBAR-PROJECTION-PARTICIPATION
    text:
      zh-CN: Scrollbar 只在 composed projection 中需要参与视觉树；system projection 可由 host adapter 隐藏或省略它，而不改变逻辑 Scroll Area。
      en: Scrollbar only needs to participate in the visual tree for composed projection; a host adapter may hide or omit it for system projection without changing the logical Scroll Area.
  - id: P-BASE-SCROLL-AREA-SCROLLBAR-PASSIVE-GEOMETRY
    text:
      zh-CN: 第一阶段 Scrollbar 只提供 orientation、track target 与对后代 Thumb 的结构归属；host session 必须拥有 track measurement 和 Thumb geometry projection。
      en: In the first stage Scrollbar provides only orientation, a track target, and structural ownership of its descendant Thumb; the host session must own track measurement and Thumb geometry projection.
openQuestions:
  - id: P-BASE-SCROLL-AREA-SCROLLBAR-Q-CONTROL-BINDING
    question:
      zh-CN: composed Scrollbar 的 track request 与 Thumb drag 应由新的 privileged `asScrollControl` 还是 anatomy-aware host binding 承载？
      en: Should composed Scrollbar track requests and Thumb drag be carried by a new privileged `asScrollControl` or an anatomy-aware host binding?
    context:
      zh-CN: 当前切片已经保证 host-local passive geometry；在 pointer capture 和跨宿主 drag 归一化被规范并测试前，不宣称 track click 或 thumb drag。
      en: The current slice guarantees host-local passive geometry; it does not claim track click or thumb drag until pointer capture and cross-host drag normalization are specified and tested.
    blocks: [composed scrollbar interaction guarantee]
sources:
  - path: packages/prototypes/base/src/scroll-area/scrollbar.proto.ts
dependsOn:
  prototypes: [P-BASE-SCROLL-AREA]
  contracts: [C-AS-HOOK-0001, C-SCROLL-0001]
verifies: { tests: [T-BASE-SCROLL-AREA-0001] }
revisions:
  - version: 0.2.0-rc.7
    change: revised
    summary: Added host-owned passive track and Thumb geometry participation without interaction ownership.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Cataloged Scrollbar orientation and composed-projection boundary without claiming unimplemented control binding.
tags: [prototype, base, scroll-area, scrollbar, composed-projection]
