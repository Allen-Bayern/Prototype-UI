id: P-SHADCN-TABS
type: prototype
title: Shadcn Tabs Root inherits Base Tabs and projects the pinned v4 default layout
status: draft
since: 0.2.0-rc.0
summary: Shadcn Tabs Root is an unofficial projection that inherits Base Tabs selection and family semantics and reproduces the pinned v4 default horizontal root layout.
statement:
  zh-CN: >-
    Shadcn Tabs Root 是 `P-BASE-TABS` 之上的 direct prototype，保留 Base Tabs 的 single-selection value、orientation、activation mode、context、anatomy 与 `valueChange` signal，并为默认 horizontal 用法投射固定 v4 baseline 的 flex column 与 gap-2 layout。比较基线固定到 shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc` 的 v4 new-york Tabs；`asChild` 明确不提供，vertical layout 与其他差异集中记录为 compatibility differences。


  en: >-
    Shadcn Tabs Root is a direct prototype over `P-BASE-TABS`. It retains Base Tabs single-selection value, orientation, activation mode, context, anatomy, and the `valueChange` signal while projecting the pinned v4 flex-column and gap-2 layout for the default horizontal composition. Its comparison baseline is the v4 new-york Tabs at shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc`; `asChild` is explicitly unavailable, and vertical layout and other differences are centralized as compatibility differences.


criteria:
  - id: P-SHADCN-TABS-UPSTREAM-IDENTITY
    text:
      zh-CN: Root 必须标记为 Proto UI 维护的非官方 shadcn/ui 衍生实现并固定 upstream revision/path；本实体不主张上游所有权或认证。
      en: Root must identify itself as an unofficial Proto UI-maintained shadcn/ui-derived implementation and pin its upstream revision and path; this entity claims neither upstream ownership nor endorsement.
  - id: P-SHADCN-TABS-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-tabs-root` 必须通过 `inherits.prototypes` 指向 `P-BASE-TABS` 并调用 `asTabsRoot()`；任何 setup-only 负向补丁必须明确声明被改写的 Base guarantee 与替代语义。'
      en: '`shadcn-tabs-root` must point to `P-BASE-TABS` through `inherits.prototypes` and call `asTabsRoot()`; any setup-only negative patch must identify the rewritten Base guarantee and replacement semantics.'
    references:
      prototypes:
        - id: P-BASE-TABS
          anchors:
            [
              P-BASE-TABS-AUTHORING-ENTRIES,
              P-BASE-TABS-ROOT-SEMANTIC-OWNER,
              P-BASE-TABS-ANATOMY-FAMILY,
            ]
    dependsOn:
      contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0007]
  - id: P-SHADCN-TABS-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited value、selection、orientation、activation、context、anatomy、a11y 或 signal guarantee；新增 style tokens 仅构成视觉增量。
      en: The current implementation reverses no inherited value, selection, orientation, activation, context, anatomy, accessibility, or signal guarantee; added style tokens are visual deltas only.
  - id: P-SHADCN-TABS-DIRECT-ENTRY
    text:
      zh-CN: 当前 Root protocol 以 `shadcn-tabs-root` direct prototype 公开，本层不额外提供 authored asHook。
      en: The current Root protocol is exposed as `shadcn-tabs-root`; this layer provides no additional authored asHook.
  - id: P-SHADCN-TABS-CURRENT-VISUAL-SURFACE
    text:
      zh-CN: 默认 horizontal Root 必须按固定 v4 baseline 提供 `flex flex-col gap-2`，不得额外以 Root token 强制 foreground；该 surface 不表示 vertical orientation-aware layout 已对齐。
      en: The default horizontal Root must provide `flex flex-col gap-2` from the pinned v4 baseline without forcing foreground through an extra Root token; this surface does not imply parity with the vertical orientation-aware layout.
    dependsOn:
      contracts: [C-RULE-INTENT-FEEDBACK-STYLE-0001]
  - id: P-SHADCN-TABS-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已测试的 inherited family behavior 与 root surface；固定 baseline 的所有差异必须集中在唯一 compatibility open question。
      en: This entity claims only tested inherited family behavior and root surface; every difference from the pinned baseline must be centralized in one compatibility open question.
  - id: P-SHADCN-TABS-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Root props 中的 `asChild` 依 `D-AS-CHILD-OMISSION-0001` 有意不进入 API。
      en: The `asChild` member of upstream Root props is intentionally omitted under `D-AS-CHILD-OMISSION-0001`.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
openQuestions:
  - id: P-SHADCN-TABS-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: Shadcn Tabs Root 相对固定 upstream baseline 的全部差异应如何分类与收敛？
      en: How should every Shadcn Tabs Root difference from the pinned upstream baseline be classified and converged?
    context:
      zh-CN: >-
        intentional deviation 是不提供 `asChild`。默认 horizontal layout 已对齐固定 v4 baseline。待实现或待评审项包括 upstream `onValueChange` 相对 `valueChange` signal、className/native prop forwarding、data-slot/data-orientation，以及只有 horizontal 才采用 flex-column 的方向感知 layout。实现并测试前不得扩大 passing guarantee。


      en: >-
        The intentional deviation is omission of `asChild`. The default horizontal layout now matches the pinned v4 baseline. Implementation or review gaps include upstream `onValueChange` versus the `valueChange` signal, className and native prop forwarding, data-slot and data-orientation, and orientation-aware layout that uses flex-column only for horizontal tabs. The passing guarantee must not expand before implementation and tests.


    blocks: [shadcn tabs root parity roadmap]
