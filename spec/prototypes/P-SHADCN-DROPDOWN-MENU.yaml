id: P-SHADCN-DROPDOWN-MENU
type: prototype
title: Shadcn Dropdown Menu Root inherits Base action-menu ownership
status: draft
since: 0.2.0-rc.0
summary: Shadcn Dropdown Menu Root is an unofficial direct projection that inherits Base transient action-menu ownership and currently adds no Root-specific behavior or visual surface.
statement:
  zh-CN: >-
    Shadcn Dropdown Menu Root 是 `P-BASE-DROPDOWN-MENU` 之上的 direct prototype，保留 transient action-menu open ownership、controlled/uncontrolled state、requests、context 与 anatomy；当前 Root 层不增加行为或视觉 surface。比较基线固定到 shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc` 的 v4 new-york Dropdown Menu，尚未实现的官方 anatomy parts 统一记录为 family compatibility gap。


  en: >-
    Shadcn Dropdown Menu Root is a direct prototype over `P-BASE-DROPDOWN-MENU`. It retains transient action-menu open ownership, controlled and uncontrolled state, requests, context, and anatomy; the current Root layer adds no behavior or visual surface. Its comparison baseline is the v4 new-york Dropdown Menu at shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc`, and unimplemented upstream anatomy parts are centralized as a family compatibility gap.


criteria:
  - id: P-SHADCN-DROPDOWN-MENU-UPSTREAM-IDENTITY
    text:
      zh-CN: Root 必须标记为 Proto UI 维护的非官方衍生实现并固定 upstream revision/path，不主张上游所有权或认证。
      en: Root must identify itself as an unofficial Proto UI-maintained derivative and pin its upstream revision and path without claiming upstream ownership or endorsement.
  - id: P-SHADCN-DROPDOWN-MENU-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-dropdown-root` 必须继承 `P-BASE-DROPDOWN-MENU` 并调用 `asDropdownRoot()`；任何 setup-only 负向补丁必须显式声明。'
      en: '`shadcn-dropdown-root` must inherit `P-BASE-DROPDOWN-MENU` and call `asDropdownRoot()`; any setup-only negative patch must be declared explicitly.'
    references:
      prototypes:
        - id: P-BASE-DROPDOWN-MENU
          anchors:
            [
              P-BASE-DROPDOWN-MENU-AUTHORING-ENTRIES,
              P-BASE-DROPDOWN-MENU-ROLE-ACTION-MENU,
              P-BASE-DROPDOWN-MENU-ROOT-OWNER,
            ]
  - id: P-SHADCN-DROPDOWN-MENU-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不反转 inherited open ownership、requests、context 或 anatomy guarantee，也不增加 Root-specific props 或 styles。
      en: The current implementation reverses no inherited open-ownership, request, context, or anatomy guarantee and adds no Root-specific props or styles.
  - id: P-SHADCN-DROPDOWN-MENU-DIRECT-ENTRY
    text:
      zh-CN: 当前 Root protocol 以 `shadcn-dropdown-root` direct prototype 公开。
      en: The current Root protocol is exposed as the `shadcn-dropdown-root` direct prototype.
  - id: P-SHADCN-DROPDOWN-MENU-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前 family 只声明 Root、Trigger、Content、Item；固定 upstream 的其他 parts 与所有 Root API 差异必须集中在唯一 compatibility open question。
      en: The current family claims only Root, Trigger, Content, and Item; other pinned-upstream parts and all Root API differences must be centralized in one compatibility open question.
openQuestions:
  - id: P-SHADCN-DROPDOWN-MENU-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: Dropdown Menu 的 family scope 与 Root API parity 应按什么顺序收敛？
      en: In what order should Dropdown Menu family scope and Root API parity converge?
    context:
      zh-CN: >-
        当前缺少 upstream Portal、Group、CheckboxItem、RadioGroup、RadioItem、Label、Separator、Shortcut、Sub、SubTrigger 与 SubContent projections。Root 待评审项包括 `onOpenChange` 相对 `openChange` signal、modal prop、data-slot 及其他 forwarding；Root 没有 upstream `asChild`，因此不引用省略决策。


      en: >-
        Current projections omit upstream Portal, Group, CheckboxItem, RadioGroup, RadioItem, Label, Separator, Shortcut, Sub, SubTrigger, and SubContent. Root review gaps include `onOpenChange` versus the `openChange` signal, modal prop, data-slot, and other forwarding; Root has no upstream `asChild`, so it does not reference the omission decision.


    blocks: [shadcn dropdown menu parity roadmap]
sources:
  - path: packages/prototypes/shadcn/src/dropdown/root.proto.ts
  - path: packages/prototypes/shadcn/src/dropdown/types.ts
  - path: packages/prototypes/shadcn/test/dropdown.test.ts
  - path: https://github.com/shadcn-ui/ui/blob/f31ed81983653919dd4fe77aee4b4859f610f1dc/apps/v4/registry/new-york-v4/ui/dropdown-menu.tsx
    label: shadcn/ui v4 new-york Dropdown Menu pinned baseline
dependsOn:
  contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0003, C-CORE-SYNTAX-0007]
  decisions: [D-PROTOTYPE-ENTITY-NAMING-0001]
inherits:
  prototypes:
    - id: P-BASE-DROPDOWN-MENU
      note: Default inherited action-menu protocol; explicit setup-time negative patches must be declared.
verifies: { tests: [T-SHADCN-DROPDOWN-MENU-0001] }
revisions:
