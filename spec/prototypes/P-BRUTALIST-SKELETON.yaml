id: P-BRUTALIST-SKELETON
type: prototype
title: Brutalist Skeleton protocol
status: draft
since: 0.2.0-rc.7
summary: Brutalist Skeleton inherits visual-only semantics and adds a static hard-shadow placeholder surface.
statement:
  en: Brutalist Skeleton remains aria-hidden and non-interactive through Base Skeleton while adding a square lavender surface, ink border, and hard offset shadow without owning dimensions.
  zh-CN: Brutalist Skeleton 通过 Base Skeleton 保持 aria-hidden 与无交互，并增加方角 lavender 表面、ink 边框和硬偏移阴影，同时不拥有尺寸。
criteria:
  - id: P-BRUTALIST-SKELETON-BASE-INHERITANCE
    text:
      en: The projection must retain Base Skeleton contentless, visual-only, aria-hidden, non-interactive behavior without fake loading announcements.
      zh-CN: 该投影必须保留 Base Skeleton 的 contentless、visual-only、aria-hidden、无交互行为，且不得伪造 loading announcement。
  - id: P-BRUTALIST-SKELETON-VISUAL-GRAMMAR
    text:
      en: The projection must use square geometry, a foreground border, lavender fill, and a hard 2px offset shadow without built-in motion.
      zh-CN: 该投影必须使用方角 geometry、foreground 边框、lavender 填色与 2px 硬偏移阴影，且不内置 motion。
  - id: P-BRUTALIST-SKELETON-CONSUMER-SIZE
    text:
      en: The projection must not emit width, height, or min/max dimension tokens; the consuming composition owns size.
      zh-CN: 该投影不得生成 width、height 或 min/max dimension token；尺寸由消费端组合拥有。
sources:
  - path: packages/prototypes/brutalist/src/skeleton/root.proto.ts
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Introduced brutalist skeleton protocol.
tags:
  - prototype
  - brutalist
  - skeleton
inherits:
  prototypes:
    - id: P-BASE-SKELETON
dependsOn:
  contracts:
    - C-CORE-SYNTAX-0003
    - C-AS-HOOK-0001
    - C-RULE-INTENT-FEEDBACK-STYLE-0001
verifies:
