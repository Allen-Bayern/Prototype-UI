id: P-SHADCN-DIALOG-DESCRIPTION
type: prototype
title: Shadcn Dialog Description inherits Base description relations and adds muted typography
status: draft
since: 0.2.0
summary: Shadcn Dialog Description inherits Base accessible description and alert semantics and adds the current muted text surface.
statement:
  zh-CN: Shadcn Dialog Description 是 `P-BASE-DIALOG-DESCRIPTION` 之上的 direct part，继续建立 Content description relation 并支持 alert semantics，增加当前 muted typography。其 `definePrototype<Props, Exposes>` 泛型顺序保持 props-first；`asChild` 明确不提供。
  en: Shadcn Dialog Description is a direct part over `P-BASE-DIALOG-DESCRIPTION`. It retains the Content description relation and alert semantics while adding the current muted typography. Its `definePrototype<Props, Exposes>` generic order remains props-first; `asChild` is explicitly unavailable.
criteria:
  - id: P-SHADCN-DIALOG-DESCRIPTION-UPSTREAM-IDENTITY
    text:
      {
        zh-CN: Description 必须沿用固定 Dialog revision/path 并明确其非官方 projection 身份。,
        en: Description must use the pinned Dialog revision and path and identify its unofficial projection status.,
      }
  - id: P-SHADCN-DIALOG-DESCRIPTION-BASE-INHERITANCE
    text:
      {
        zh-CN: '`shadcn-dialog-description` 必须继承 `P-BASE-DIALOG-DESCRIPTION` 并调用 `asDialogDescription()`。',
        en: '`shadcn-dialog-description` must inherit `P-BASE-DIALOG-DESCRIPTION` and call `asDialogDescription()`.',
      }
    references:
      prototypes:
        - id: P-BASE-DIALOG-DESCRIPTION
          anchors:
            [
              P-BASE-DIALOG-DESCRIPTION-AUTHORING-ENTRIES,
              P-BASE-DIALOG-DESCRIPTION-RELATION,
              P-BASE-DIALOG-DESCRIPTION-ALERT,
            ]
  - id: P-SHADCN-DIALOG-DESCRIPTION-DIRECT-ENTRY
    text:
      {
        zh-CN: 当前 Description protocol 以 `shadcn-dialog-description` direct prototype 公开，并保持 Props/Exposes 泛型顺序正确。,
        en: The current Description protocol is exposed as `shadcn-dialog-description` and keeps the Props and Exposes generic order correct.,
      }
  - id: P-SHADCN-DIALOG-DESCRIPTION-CURRENT-VISUAL-SURFACE
    text:
      {
        zh-CN: Description 必须提供 text-sm 与 text-muted-foreground tokens。,
        en: Description must provide text-sm and text-muted-foreground tokens.,
      }
  - id: P-SHADCN-DIALOG-DESCRIPTION-COMPATIBILITY-SUBSET
    text:
      {
        zh-CN: 当前 typography 之外的 forwarding 差异集中在唯一 open question。,
        en: Forwarding differences beyond current typography are centralized in one open question.,
      }
  - id: P-SHADCN-DIALOG-DESCRIPTION-AS-CHILD-OMISSION
    text:
      {
        zh-CN: upstream Description props 中的 `asChild` 依共享决策省略。,
        en: Upstream Description `asChild` is omitted under the shared decision.,
      }
    dependsOn: { decisions: [D-AS-CHILD-OMISSION-0001] }
openQuestions:
  - id: P-SHADCN-DIALOG-DESCRIPTION-Q-UPSTREAM-DIFFERENCES
    question:
      {
        zh-CN: Description forwarding parity 应如何收敛？,
        en: How should Description forwarding parity converge?,
      }
    context:
      {
        zh-CN: intentional deviation 是省略 `asChild`。视觉 tokens 已与 pinned upstream 对齐，剩余 gap 主要是 className/native/data-slot forwarding 与实际 host element 映射。,
        en: The intentional deviation is omission of `asChild`. Visual tokens align with the pinned upstream; remaining gaps are primarily className,
        native,
        and data-slot forwarding and actual host-element mapping.,
      }
    blocks: [shadcn dialog description parity roadmap]
sources:
  - path: packages/prototypes/shadcn/src/dialog/description.proto.ts
  - path: packages/prototypes/shadcn/test/dialog.test.ts
  - path: https://github.com/shadcn-ui/ui/blob/f31ed81983653919dd4fe77aee4b4859f610f1dc/apps/v4/registry/new-york-v4/ui/dialog.tsx
    label: shadcn/ui v4 new-york DialogDescription pinned baseline
dependsOn:
  contracts: [C-AS-HOOK-0001, C-RULE-INTENT-FEEDBACK-STYLE-0001]
  decisions: [D-PROTOTYPE-ENTITY-NAMING-0001, D-AS-CHILD-OMISSION-0001]
  prototypes: [P-SHADCN-DIALOG-CONTENT]
inherits:
  prototypes:
    [
      {
        id: P-BASE-DIALOG-DESCRIPTION,
        note: Default inherited dialog-description protocol; no behavior reversal is declared.,
      },
    ]
verifies: { tests: [T-SHADCN-DIALOG-DESCRIPTION-0001] }
revisions:
  [
    {
      version: 0.2.0,
      change: introduced,
      summary: Introduced Shadcn Dialog Description cataloging with Base relations,
      corrected generic order,
      muted typography,
      and bounded parity.,
    },
  ]
tags: [prototype, shadcn, dialog, description, upstream-derived, delta, compatibility]
