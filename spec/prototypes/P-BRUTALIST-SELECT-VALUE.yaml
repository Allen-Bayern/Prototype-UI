    change: introduced
    summary: >-
      Introduced draft Brutalist Select Value projection with real public-API criteria (Base inheritance, direct entry, display-value render behavior) on rc.7. Not present in immutable rc.6.

tags: [prototype, brutalist, neo-brutalist, visual, delta, select]
