id: A-REACT-18-19-0001
type: adapter
title: Official React 18.2-19 Web Adapter profile
status: active
since: 0.2.0-rc.7
summary: The official React Web Adapter translates React 18.2 through 19 component props and Web interaction input into the required Props and Event modules.
adapterProfile:
  package: '@proto.ui/adapter-react'
  target:
    platform: web
    runtime:
      name: react
      versionRange: '>=18.2.0 <20'
statement:
  zh-CN: >-
    该 profile 表示 `@proto.ui/adapter-react` 在 Web platform 上面向 React `>=18.2.0 <20` 的 official translation identity。当前已编目的 Props slice 固定安装 required Props Module，以稳定 `RawPropsSource` 读取经过 Adapter 分类的 component props，在 React effect 中发送 snapshot invalidation，并由 runtime sync point 完成语义 diff 与 watcher dispatch。`autoUpdateOnPropsChange` 是 profile render policy，不属于 Props host capability。Event slice 固定安装 required Event Module，通过共用 Web router 把 native input 翻译为 root/global Proto event stream，按 logical interaction owner 路由 semantic event，在 view lifecycle 中启用或禁用 delivery，并把 default-action request 翻译为 DOM `preventDefault()`。


  en: >-
    This profile is the official translation identity of `@proto.ui/adapter-react` for React `>=18.2.0 <20` on the Web platform. Its currently cataloged Props slice installs the required Props Module, exposes Adapter-classified component props through a stable `RawPropsSource`, sends snapshot invalidation from a React effect, and leaves semantic diffing and watcher dispatch to runtime synchronization points. `autoUpdateOnPropsChange` is a profile render policy rather than part of the Props host capability. Its Event slice installs the required Event module, uses the shared Web router to translate native input into root and global Proto event streams, routes semantic events by logical interaction owner, enables or disables delivery with the view lifecycle, and translates default-action requests to DOM `preventDefault()`.


criteria:
  - id: A-REACT-18-19-0001-A
    text:
      zh-CN: Profile identity 必须对应 `@proto.ui/adapter-react` 与 peer range `react >=18.2.0 <20`，不得被表述为所有 React 版本或非 Web host 的保证。
      en: The profile identity must correspond to `@proto.ui/adapter-react` and peer range `react >=18.2.0 <20` and must not be represented as a guarantee for every React version or a non-Web host.
  - id: A-REACT-18-19-0001-B
    text:
      zh-CN: Adapter 必须把 Props Module 作为 required Module 接入，并以 translated capability 提供 `HC-PROPS-SOURCE-0001`。
      en: The Adapter must wire the Props Module as required and provide `HC-PROPS-SOURCE-0001` as a translated capability.
  - id: A-REACT-18-19-0001-C
    text:
      zh-CN: 默认 Props normalization 必须剥离 `children`、class/style presentation fields 与函数型 `onXxx` listeners，同时允许显式 `getProps` option 替换分类策略。
      en: Default Props normalization must exclude `children`, class and style presentation fields, and function-valued `onXxx` listeners while allowing an explicit `getProps` option to replace the classification policy.
  - id: A-REACT-18-19-0001-D
    text:
      zh-CN: React effect 只能在规范化 snapshot 发生浅层变化时发送 invalidation；是否自动调用 runtime update 由 `autoUpdateOnPropsChange` profile policy 决定，notification 自身不得被解释为 render commit。
      en: The React effect may send invalidation only when the normalized snapshot changes shallowly; automatic runtime update is controlled by the `autoUpdateOnPropsChange` profile policy, and the notification itself must not be interpreted as a render commit.
  - id: A-REACT-18-19-0001-E
    text:
      zh-CN: Adapter 必须把 Event Module 作为 required Module 接入，并以 translated capability 提供 `HC-EVENT-BINDING-0001` 与 `HC-DEFAULT-ACTION-0001`；这些关系不得把 DOM `EventTarget` 写成跨宿主保证。
      en: The Adapter must wire the Event module as required and provide `HC-EVENT-BINDING-0001` and `HC-DEFAULT-ACTION-0001` as translated capabilities; these relations must not turn DOM `EventTarget` into a cross-host guarantee.
  - id: A-REACT-18-19-0001-F
    text:
      zh-CN: React view wiring 必须把 host input 翻译为当前支持的 root/global Event type，按 logical owner 路由 semantic event，并在 unmount 后停止旧 root 的 delivery。
      en: React view wiring must translate host input into currently supported root and global Event types, route semantic events by logical owner, and stop delivery from the old root after unmount.
supports:
  modules:
    - id: M-PROPS-0001
      role: required-module
      note: Props is required for the standard Maker-to-Component configuration channel.
    - id: M-EVENT-0001
      role: required-module
      note: Event is installed for the standard User-to-Component interaction channel; host binding is only required for scopes with registrations.
provides:
  hostCaps:
    - id: HC-PROPS-SOURCE-0001
      role: translated-capability
      note: React props are classified and exposed as a stable readable source with effect-driven invalidation.
    - id: HC-EVENT-BINDING-0001
      role: translated-capability
      note: The shared Web router translates DOM input into Adapter-owned root and global Proto event streams.
    - id: HC-DEFAULT-ACTION-0001
      role: translated-capability
      note: Default-action cancellation requests are translated to preventDefault when the native DOM event supports it.
relates:
  decisions:
    - D-ADAPTER-PROFILE-0001
verifies:
  tests:
    - T-ADAPTER-PROFILE-0001
    - T-PROPS-0012
    - T-EVENT-0003
sources:
  - path: packages/adapters/react/package.json
  - path: packages/adapters/react/src/adapt.ts
  - path: packages/adapters/react/src/runtime/modules.ts
  - path: packages/adapters/react/test/contract/props-host-source.v0.contract.test.ts
  - path: packages/adapters/react/test/framework-contract.test.ts
  - path: packages/adapters/base/src/events/web-event-router.ts
  - path: packages/adapters/react/test/event.test.ts
  - path: packages/adapters/react/test/event-routing.test.ts
revisions:
  - version: 0.2.0-rc.7
    change: revised
    summary: Added required Event Module support, translated scoped Event binding, Default Action provision, lifecycle routing criteria, and conformance evidence.
  - version: 0.2.0-rc.7
    change: introduced
    summary: Cataloged the official React 18.2-19 profile identity and its required Props translation slice.
tags: [adapter, react, web, props, event, official]
